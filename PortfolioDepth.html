<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Command · NBFC Depth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   Recykal · NBFC Depth — Phase 2 prototype
   Portfolio Command canvas + Seller Journey storyboard
   Apple system design language · shares tokens with the live tracker.
   Standalone: mock data mirrors the real entity/doc-status shape.
   ═══════════════════════════════════════════════════════════════════════ */

/* ── Design tokens (mirrored from Index.html) ───────────────────────────── */
:root{
  --rk-green:#00A651; --rk-green-deep:#008843; --rk-green-ink:#036B36;
  --rk-green-tint:#E4F6EC; --rk-green-tint-2:#F1FAF5;
  --amber:#F59E0B; --amber-tint:#FFF6E0; --amber-ink:#7A4D06;
  --gray-dot:#C7C7CC;
  --remark-ink:#4338CA; --remark-tint:rgba(79,70,229,.07); --remark-bd:rgba(79,70,229,.22);

  /* NBFC brand accent — set live by applyAccent(). Default = Billmart. */
  --nc:#E85D04; --nc-rgb:232,93,4; --nc-ring:#FF8C4A;

  --font:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,'Roboto Mono',monospace;

  --surface:#F5F5F7; --card:#FFFFFF;
  --ink:#1D1D1F; --ink-2:#6E6E73; --ink-3:#86868B;
  --line:rgba(18,20,28,.08); --line-2:rgba(18,20,28,.045);
  --fill:rgba(120,122,134,.09); --fill-2:rgba(120,122,134,.17);

  --shadow-sm:0 1px 2px rgba(18,20,28,.04),0 2px 6px rgba(18,20,28,.05);
  --shadow-md:0 4px 10px rgba(18,20,28,.06),0 12px 28px rgba(18,20,28,.09);
  --shadow-lg:0 14px 32px rgba(18,20,28,.12),0 36px 74px rgba(18,20,28,.17);

  --radius:16px;
  --ease:cubic-bezier(.4,0,.2,1); --ease-out:cubic-bezier(0,0,.2,1);
  --drawer-open:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme:dark){
  :root{
    --surface:#000000; --card:#1C1C1E;
    --ink:#F5F5F7; --ink-2:#A1A1A6; --ink-3:#86868B;
    --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.06);
    --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.36);
    --gray-dot:#48484A;
    --rk-green-ink:#30D158; --rk-green-tint:rgba(48,209,88,.14);
    --amber-ink:#FFD60A; --amber-tint:rgba(245,158,11,.16);
    --remark-ink:#A5B4FC; --remark-tint:rgba(129,140,248,.13); --remark-bd:rgba(129,140,248,.30);
    --shadow-sm:0 1px 2px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.42);
    --shadow-md:0 6px 16px rgba(0,0,0,.5),0 16px 40px rgba(0,0,0,.55);
    --shadow-lg:0 18px 44px rgba(0,0,0,.62),0 44px 92px rgba(0,0,0,.72);
  }
}
:root[data-theme="dark"]{
  --surface:#000000; --card:#1C1C1E;
  --ink:#F5F5F7; --ink-2:#A1A1A6; --ink-3:#86868B;
  --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.06);
  --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.36);
  --gray-dot:#48484A;
  --rk-green-ink:#30D158; --rk-green-tint:rgba(48,209,88,.14);
  --amber-ink:#FFD60A; --amber-tint:rgba(245,158,11,.16);
  --remark-ink:#A5B4FC; --remark-tint:rgba(129,140,248,.13); --remark-bd:rgba(129,140,248,.30);
  --shadow-sm:0 1px 2px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.42);
  --shadow-md:0 6px 16px rgba(0,0,0,.5),0 16px 40px rgba(0,0,0,.55);
  --shadow-lg:0 18px 44px rgba(0,0,0,.62),0 44px 92px rgba(0,0,0,.72);
}
:root[data-theme="light"]{
  --surface:#F5F5F7; --card:#FFFFFF;
  --ink:#1D1D1F; --ink-2:#6E6E73; --ink-3:#86868B;
  --line:rgba(18,20,28,.08); --line-2:rgba(18,20,28,.045);
  --fill:rgba(120,122,134,.09); --fill-2:rgba(120,122,134,.17);
  --gray-dot:#C7C7CC;
  --rk-green-ink:#036B36; --rk-green-tint:#E4F6EC;
  --amber-ink:#7A4D06; --amber-tint:#FFF6E0;
  --remark-ink:#4338CA; --remark-tint:rgba(79,70,229,.07); --remark-bd:rgba(79,70,229,.22);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font); background:var(--surface); color:var(--ink);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  line-height:1.5; letter-spacing:-.01em; min-height:100vh;
}
::selection{background:rgba(var(--nc-rgb),.22)}
svg{display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ── App bar ────────────────────────────────────────────────────────────── */
.appbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:18px;
  padding:14px clamp(16px,4vw,40px);
  background:color-mix(in srgb,var(--surface) 82%,transparent);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--line-2);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .mark{
  width:34px;height:34px;border-radius:9px;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--nc),var(--nc-ring));
  box-shadow:0 2px 8px rgba(var(--nc-rgb),.4);color:#fff;
}
.brand .mark svg{width:19px;height:19px}
.brand-txt .t1{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.brand-txt .t2{font-size:15px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:1px}

.seg{
  display:inline-flex;background:var(--fill);border-radius:12px;padding:3px;gap:2px;
  margin:0 auto;position:relative;
}
.seg button{
  position:relative;padding:7px 16px;border-radius:9px;font-size:13px;font-weight:600;
  color:var(--ink-2);letter-spacing:-.01em;transition:color .2s var(--ease);white-space:nowrap;
}
.seg button .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:middle;opacity:.5;transition:opacity .2s}
.seg button.on{color:var(--ink)}
.seg button.on .dot{opacity:1}
.seg .glider{
  position:absolute;top:3px;left:0;height:calc(100% - 6px);border-radius:9px;
  background:var(--card);box-shadow:var(--shadow-sm),0 0 0 .5px var(--line-2);
  transition:transform .34s var(--drawer-open),width .34s var(--drawer-open);z-index:0;
}
.seg button span{position:relative;z-index:1}

.bar-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.legend{display:flex;align-items:center;gap:13px;padding-right:4px}
.legend .lg{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.legend .sw{width:10px;height:10px;border-radius:50%;flex:none}
.sw.rec{background:var(--rk-green)} .sw.pen{background:var(--amber)} .sw.na{background:transparent;border:1.5px solid var(--gray-dot)}
.icon-btn{
  width:36px;height:36px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--fill);color:var(--ink-2);transition:all .16s var(--ease);
}
.icon-btn:hover{background:var(--fill-2);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}
.icon-btn .moon{display:none}
:root[data-theme="dark"] .icon-btn .sun,@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .icon-btn .sun{display:none}}
:root[data-theme="dark"] .icon-btn .moon{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .icon-btn .moon{display:block}}

/* ── Canvas shell ───────────────────────────────────────────────────────── */
.wrap{max-width:1240px;margin:0 auto;padding:clamp(20px,3.4vw,38px) clamp(16px,4vw,40px) 80px}
.page-head{
  position:relative;overflow:hidden;border-radius:22px;
  padding:26px clamp(20px,3vw,34px);margin-bottom:22px;
  background:var(--card);box-shadow:var(--shadow-md),0 0 0 .5px var(--line-2);
}
.page-head::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(680px 300px at 3% -40%,rgba(var(--nc-rgb),.20),transparent 62%),
    radial-gradient(520px 260px at 102% 150%,rgba(var(--nc-rgb),.10),transparent 60%);
}
.page-head .inner{position:relative}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--nc);box-shadow:0 0 0 3px rgba(var(--nc-rgb),.16)}
.page-head h1{font-size:clamp(24px,3.4vw,34px);font-weight:800;letter-spacing:-.045em;margin-top:11px;line-height:1.08}
.page-head .sub{font-size:14px;color:var(--ink-2);margin-top:7px;font-weight:450;max-width:60ch}
.page-head .sub b{color:var(--ink);font-weight:650}

/* ── Stat strip ─────────────────────────────────────────────────────────── */
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{
  background:var(--card);border-radius:var(--radius);padding:16px 18px;
  box-shadow:var(--shadow-sm),0 0 0 .5px var(--line-2);
  position:relative;overflow:hidden;transition:transform .2s var(--ease),box-shadow .2s var(--ease);
}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--stat-ac,var(--nc));opacity:.9}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-md),0 0 0 .5px var(--line)}
.stat .k{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.01em;text-transform:uppercase}
.stat .k svg{width:14px;height:14px;color:var(--stat-ac,var(--nc))}
.stat .v{font-size:29px;font-weight:800;letter-spacing:-.045em;margin-top:8px;font-variant-numeric:tabular-nums;line-height:1}
.stat .v small{font-size:15px;font-weight:700;color:var(--ink-3);margin-left:1px}
.stat .d{font-size:11.5px;color:var(--ink-2);margin-top:5px;font-weight:450}

/* ── Panels grid ────────────────────────────────────────────────────────── */
.grid{display:grid;gap:16px}
.grid.r1{grid-template-columns:1.32fr 1fr;margin-bottom:16px}
.grid.r2{grid-template-columns:1fr 1.32fr}
.panel{
  background:var(--card);border-radius:20px;padding:20px 22px;
  box-shadow:var(--shadow-md),0 0 0 .5px var(--line-2);
  display:flex;flex-direction:column;min-width:0;
}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
.panel-h .ttl{font-size:15px;font-weight:700;letter-spacing:-.025em}
.panel-h .hint{font-size:11.5px;color:var(--ink-3);font-weight:500}

/* ── Conversion funnel ──────────────────────────────────────────────────── */
.funnel{display:flex;flex-direction:column;gap:9px}
.frow{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:14px}
.frow .fl{font-size:12.5px;font-weight:600;color:var(--ink-2);letter-spacing:-.01em}
.frow .fbar-wrap{position:relative;height:38px;display:flex;align-items:center}
.frow .fbar{
  height:100%;border-radius:10px;min-width:44px;width:0;
  background:linear-gradient(90deg,var(--nc),var(--nc-ring));
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18),0 3px 10px rgba(var(--nc-rgb),.22);
  transition:width 1s var(--drawer-open);display:flex;align-items:center;justify-content:flex-end;
  padding-right:12px;
}
.frow .fbar b{color:#fff;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.16)}
.frow.t2 .fbar{opacity:.92} .frow.t3 .fbar{opacity:.84} .frow.t4 .fbar{opacity:.76}
.frow .fconv{font-size:12px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:52px;text-align:right}
.frow .fconv.good{color:var(--rk-green-ink)}
.frow .fconv.warn{color:var(--amber-ink)}
.funnel-foot{margin-top:14px;padding-top:14px;border-top:1px solid var(--line-2);display:flex;gap:22px;flex-wrap:wrap}
.ffoot-i .fv{font-size:17px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ffoot-i .fk{font-size:10.5px;color:var(--ink-3);font-weight:500;margin-top:1px}

/* ── Bottleneck board ───────────────────────────────────────────────────── */
.bottle{display:flex;flex-direction:column;gap:2px}
.brow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.brow:last-child{border-bottom:none}
.brow .bname{font-size:13px;font-weight:600;letter-spacing:-.015em;display:flex;align-items:center;gap:8px;min-width:0}
.brow .brank{font-size:10px;font-weight:800;color:var(--ink-3);width:16px;text-align:center;flex:none;font-variant-numeric:tabular-nums}
.brow .bmeter{grid-column:1/-1;height:7px;border-radius:4px;background:var(--fill);overflow:hidden;margin-top:2px;position:relative}
.brow .bmeter i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,var(--rk-green-deep),var(--rk-green));width:0;transition:width .9s var(--drawer-open)}
.brow.hot .bmeter i{background:linear-gradient(90deg,#D9480F,var(--amber))}
.brow .bstat{font-size:11.5px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.brow .bstat em{color:var(--amber-ink);font-style:normal;font-weight:700}
.brow .bpct{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-width:42px;text-align:right}

/* ── Completion spread ──────────────────────────────────────────────────── */
.spread{display:flex;flex-direction:column;gap:14px}
.hist{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:6px}
.hcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.hcol .hbar-wrap{width:100%;flex:1;display:flex;align-items:flex-end;justify-content:center}
.hcol .hbar{
  width:74%;max-width:46px;border-radius:8px 8px 4px 4px;min-height:4px;height:0;
  background:linear-gradient(180deg,var(--nc-ring),var(--nc));
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16);
  transition:height .9s var(--drawer-open);position:relative;
}
.hcol .hbar .hn{position:absolute;top:-19px;left:0;right:0;text-align:center;font-size:12px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hcol.lo .hbar{background:linear-gradient(180deg,#E8A0A0,#D9480F)}
.hcol .hx{font-size:10px;font-weight:600;color:var(--ink-3);letter-spacing:.01em;white-space:nowrap}
.spread-avg{
  display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;
  background:var(--fill);
}
.spread-avg .big{font-size:22px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.spread-avg .lbl{font-size:11.5px;color:var(--ink-2);font-weight:500;line-height:1.35}

/* ── Needs attention ────────────────────────────────────────────────────── */
.attn{display:flex;flex-direction:column;gap:6px}
.arow{
  display:flex;align-items:center;gap:13px;padding:11px 12px;border-radius:13px;
  cursor:pointer;transition:background .16s var(--ease),transform .16s var(--ease);
  border:1px solid transparent;
}
.arow:hover{background:rgba(var(--nc-rgb),.06);border-color:rgba(var(--nc-rgb),.14);transform:translateX(2px)}
.av{
  width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;letter-spacing:-.02em;color:#fff;
  background:linear-gradient(135deg,var(--nc),var(--nc-ring));box-shadow:0 2px 7px rgba(var(--nc-rgb),.3);
}
.arow .amid{flex:1;min-width:0}
.arow .anm{font-size:13.5px;font-weight:650;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .asub{display:flex;align-items:center;gap:8px;margin-top:4px}
.mini-prog{width:74px;height:5px;border-radius:3px;background:var(--fill);overflow:hidden;flex:none}
.mini-prog i{display:block;height:100%;border-radius:3px;background:var(--rk-green)}
.mini-prog.lo i{background:var(--amber)}
.arow .apct{font-size:11px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.arow .aright{display:flex;align-items:center;gap:8px;flex:none}
.eta-pill{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;
  padding:4px 9px;border-radius:980px;background:var(--amber-tint);color:var(--amber-ink);white-space:nowrap;
}
.eta-pill svg{width:11px;height:11px}
.rmk-pill{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:4px 9px;border-radius:980px;background:var(--remark-tint);color:var(--remark-ink);
  border:1px solid var(--remark-bd);max-width:230px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.rmk-pill svg{width:11px;height:11px;flex:none}
.arow .chev{color:var(--ink-3);flex:none;transition:transform .16s,color .16s}
.arow:hover .chev{color:var(--nc);transform:translateX(2px)}
.arow .chev svg{width:16px;height:16px}
.attn-empty{padding:24px;text-align:center;color:var(--ink-3);font-size:13px}

/* ── Seller Journey modal ───────────────────────────────────────────────── */
.scrim{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  padding:clamp(14px,3vw,32px);
  background:rgba(18,20,28,.42);
  backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);
  opacity:0;pointer-events:none;transition:opacity .28s var(--ease);
}
.scrim.on{opacity:1;pointer-events:auto}
.jm{
  position:relative;background:var(--card);border-radius:26px;
  width:min(1000px,100%);max-height:calc(100vh - 48px);
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:var(--shadow-lg),0 0 0 .5px var(--line);
  transform:translateY(18px) scale(.982);opacity:.4;
  transition:transform .38s var(--drawer-open),opacity .3s var(--ease);
}
.scrim.on .jm{transform:none;opacity:1}
.jm-head{flex:none;position:relative;padding:24px clamp(20px,3vw,30px) 20px;border-bottom:1px solid var(--line-2);overflow:hidden}
.jm-head::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(520px 220px at 0% -60%,rgba(var(--nc-rgb),.16),transparent 62%)}
.jm-head .htop{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
.jm-eyebrow{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
.jm-eyebrow i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--nc);box-shadow:0 0 0 3px rgba(var(--nc-rgb),.16)}
.jm-x{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:var(--ink-2);background:var(--fill);transition:all .15s}
.jm-x:hover{background:var(--fill-2);color:var(--ink)}
.jm-x:active{transform:scale(.93)}
.jm-x svg{width:15px;height:15px}
.jm-head .hrow{position:relative;display:flex;align-items:center;gap:20px}
.jm-head .hleft{flex:1;min-width:0}
.jm-head h2{font-size:clamp(20px,2.6vw,26px);font-weight:800;letter-spacing:-.04em;line-height:1.12;word-break:break-word}
.jm-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:980px;background:var(--fill);color:var(--ink-2);white-space:nowrap}
.chip.brand{background:rgba(var(--nc-rgb),.12);color:var(--nc)}
.chip.mono{font-family:var(--mono);font-size:11px;letter-spacing:.02em}
.chip svg{width:12px;height:12px;flex:none}
/* progress ring */
.ring-wrap{position:relative;width:88px;height:88px;flex:none}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-wrap .rl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-wrap .rl b{font-size:20px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.ring-wrap .rl span{font-size:8.5px;font-weight:700;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}

.jm-body{flex:1;overflow-y:auto;padding:clamp(20px,3vw,28px) clamp(20px,3vw,30px) 30px;background:var(--surface)}

/* the journey rail */
.rail-card{background:var(--card);border-radius:18px;padding:26px 22px 22px;box-shadow:var(--shadow-sm),0 0 0 .5px var(--line-2);margin-bottom:16px}
.rail{display:flex;position:relative}
.rail-line{position:absolute;top:19px;left:8%;right:8%;height:3px;border-radius:2px;background:var(--fill-2)}
.rail-line i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,var(--nc),var(--nc-ring));width:0;transition:width 1s var(--drawer-open)}
.station{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;padding:0 4px;min-width:0}
.node{
  width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:3px solid var(--fill-2);color:var(--ink-3);position:relative;z-index:1;
  transition:all .3s var(--ease);
}
.node svg{width:16px;height:16px}
.station.done .node{background:var(--rk-green);border-color:var(--rk-green);color:#fff;box-shadow:0 3px 10px rgba(0,166,81,.3)}
.station.current .node{background:var(--card);border-color:var(--nc);color:var(--nc);box-shadow:0 0 0 5px rgba(var(--nc-rgb),.14),0 3px 12px rgba(var(--nc-rgb),.25)}
.station.blocked .node{background:var(--card);border-color:var(--amber);color:var(--amber-ink);box-shadow:0 0 0 5px rgba(245,158,11,.14)}
.station .st-t{font-size:12px;font-weight:700;letter-spacing:-.015em;margin-top:11px;color:var(--ink)}
.station.upcoming .st-t{color:var(--ink-3)}
.station .st-s{font-size:10.5px;font-weight:500;color:var(--ink-2);margin-top:3px;line-height:1.35;min-height:2.4em}
.station.current .st-s{color:var(--nc);font-weight:600}
.station .st-badge{margin-top:6px;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:980px}
.station.current .st-badge{background:rgba(var(--nc-rgb),.12);color:var(--nc)}

/* journey detail split */
.jsplit{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.doc-card,.side-card{background:var(--card);border-radius:18px;padding:20px;box-shadow:var(--shadow-sm),0 0 0 .5px var(--line-2)}
.dc-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dc-h .t{font-size:13.5px;font-weight:700;letter-spacing:-.02em}
.dc-h .counts{display:flex;gap:5px}
.cbadge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:980px;font-variant-numeric:tabular-nums}
.cbadge.rec{background:var(--rk-green-tint);color:var(--rk-green-ink)}
.cbadge.pen{background:var(--amber-tint);color:var(--amber-ink)}
.cbadge.na{background:var(--fill);color:var(--ink-3)}
.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.dchip{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;background:var(--fill);min-width:0}
.dchip .di{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center}
.dchip .di svg{width:16px;height:16px}
.dchip.rec .di{color:var(--rk-green)} .dchip.pen .di{color:var(--amber)} .dchip.na .di{color:var(--gray-dot)}
.dchip .dn{font-size:12px;font-weight:550;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dchip.na .dn{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line)}

.meta-list{display:flex;flex-direction:column;gap:1px;margin-bottom:6px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.mrow:last-child{border-bottom:none}
.mrow .mk{font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:.02em;text-transform:uppercase}
.mrow .mv{font-size:13px;font-weight:600;letter-spacing:-.01em;text-align:right}
.mrow .mv.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em}
.remark-card{margin-top:14px;border-radius:14px;padding:14px 15px;background:var(--remark-tint);border:1px solid var(--remark-bd)}
.remark-card .rh{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--remark-ink);letter-spacing:.04em;text-transform:uppercase}
.remark-card .rh svg{width:14px;height:14px}
.remark-card .rh .eta{margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:var(--amber-tint);color:var(--amber-ink);padding:3px 9px;border-radius:980px;font-size:10.5px;letter-spacing:0;text-transform:none}
.remark-card .rh .eta svg{width:11px;height:11px}
.remark-card .rb{font-size:12.5px;color:var(--ink);margin-top:9px;line-height:1.5;font-weight:450}

/* ── Responsive ─────────────────────────────────────────────────────────── */
@media (max-width:900px){
  .grid.r1,.grid.r2{grid-template-columns:1fr}
  .stat-strip{grid-template-columns:1fr 1fr}
  .jsplit{grid-template-columns:1fr}
  .legend{display:none}
  .seg{margin:0}
}
@media (max-width:640px){
  .brand-txt .t1{display:none}
  .rail{flex-wrap:wrap;gap:16px 0}
  .rail-line{display:none}
  .station{flex:0 0 33.33%}
  .station .st-s{min-height:0}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.001ms!important;animation-duration:.001ms!important}
}

/* entrance */
.reveal{opacity:0;transform:translateY(10px);animation:rise .6s var(--ease-out) forwards}
@keyframes rise{to{opacity:1;transform:none}}
</style>

<body>

<div class="appbar">
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9 9 0 0 1 6.7 3"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9 9 0 0 1-6.7-3"/><path d="M3 21v-5h5"/></svg></div>

<script>
/* ═══════════════════════════ helpers ═══════════════════════════════════ */
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function initials(n){return n.split(/\s+/).filter(Boolean).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase()}
/* seeded RNG for stable mock data */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ═══════════════════════════ icons ═════════════════════════════════════ */
var IC={
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-11.9 7.8L3 21l1.7-6.1A8.5 8.5 0 1 1 21 11.5z"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="3.4"/><path d="M22 20v-2a4 4 0 0 0-3-3.8"/><path d="M16 3.2A4 4 0 0 1 16 11"/></svg>',
  gauge:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M12 3a9 9 0 1 0 9 9"/><path d="M14 10l4-4"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5z"/><path d="m9 12 2 2 4-4"/></svg>',
  card:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V4M4 4c3-2 6 2 9 0s5 0 7-1v10c-2 1-4 1-7-.5s-6 2-9 .5"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="2.8"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>'
};

/* ═══════════════════════════ NBFC config ═══════════════════════════════ */
var NBFCS={
  billmart:{name:'Billmart',noun:'seller',nc:'#E85D04',rgb:'232,93,4',ring:'#FF8C4A',vint:1,count:16},
  capitalxb:{name:'Capital XB',noun:'seller',nc:'#0A84FF',rgb:'10,132,255',ring:'#5AC8FA',vint:0.5,count:13},
  strideone:{name:'StrideOne',noun:'buyer',nc:'#AF52DE',rgb:'175,82,222',ring:'#DA8FFF',vint:0,count:11}
};
var DOCS={
  seller:['GST Certificate','PAN Card','Cancelled Cheque','Bank Statement (6M)','ITR (2Y)','Audited Financials','MOA','AOA','Board Resolution','Udyam / MSME','Address Proof'],
  buyer:['MOA','AOA','Board Resolution','PAN Card','GST Certificate','Bank Statement','Audited Financials','Debtors Ageing','Creditors Ageing','Sanction Letters']
};
var NA_PRONE={'Udyam / MSME':1,'Address Proof':1,'Debtors Ageing':1,'Creditors Ageing':1,'Sanction Letters':1};

var NAMES=['Acme Recycling','Zenith Polymers','GreenLoop Industries','Nova Fibres','Orbit Metals','Sahyadri Plastics','Vertex Recyclers','Indus Scrap Co','Kaveri Pulp & Paper','Meridian Alloys','Suryodaya Enviro','Trident Waste','Ecogenix Solutions','Bharat Circular','Pioneer Reclaim','Sterling Ferrous','Anmol Traders','Vaayu Composites','Rise E-Waste','Zircon Recycling','Nirmal Plastics','Om Sai Enterprises','Precision Polymers','Ganga Recyclers','Aditya Metals','Coastal Fibre Mills','Deccan Reprocessing','Evergreen Pulp'];
var STATES=['Maharashtra','Telangana','Karnataka','Gujarat','Tamil Nadu','Delhi','Uttar Pradesh','West Bengal','Madhya Pradesh','Rajasthan'];
var REGIONS=['West','South','South','West','South','North','North','East','Central','North'];
var ENTITY=['Private Limited','Proprietorship','Partnership','LLP','Public Limited'];
var REMARKS=['Awaiting audited financials from CA; promised by month-end.','Bank statement shared but 6-month window incomplete — re-requested.','Board resolution pending director signature.','GST certificate mismatch with PAN; clarification sought.','Ageing report format not as per template; follow-up sent.','Docs complete — under final credit committee review.','MSME certificate not applicable; declaration collected.','Delayed response; second reminder issued to POC.'];
var ETAS=['2 days','5 days','Next week','12 Aug','3 days','This week','10 days',''];

/* ═══════════════════════════ data generation ═══════════════════════════ */
function gstFor(state,seed){
  var codes={'Maharashtra':27,'Telangana':36,'Karnataka':29,'Gujarat':24,'Tamil Nadu':33,'Delhi':7,'Uttar Pradesh':9,'West Bengal':19,'Madhya Pradesh':23,'Rajasthan':8};
  var c=codes[state]||27; var L='ABCDEFGHJKLMNPQRSTUVWXYZ';
  var pan=''; for(var i=0;i<5;i++)pan+=L[Math.floor(seed()*24)];
  pan+=String(1000+Math.floor(seed()*8999)); pan+=L[Math.floor(seed()*24)];
  return (c<10?'0'+c:c)+pan+'1Z'+L[Math.floor(seed()*24)];
}
function buildNbfc(id){
  var cfg=NBFCS[id]; var rng=mulberry32(id.split('').reduce(function(a,c){return a+c.charCodeAt(0)},0)*7+13);
  var docList=DOCS[cfg.noun==='buyer'?'buyer':'seller'];
  var ents=[];
  for(var i=0;i<cfg.count;i++){
    var name=NAMES[(i*3+id.length)%NAMES.length]+ (i>=NAMES.length?' II':'');
    var si=Math.floor(rng()*STATES.length); var state=STATES[si];
    var p=0.18+rng()*0.8;                       // diligence / completion propensity
    var vint=+(0.2+rng()*7.6).toFixed(1);
    var docs={}, rec=0, pen=0, na=0;
    docList.forEach(function(d){
      var st;
      if(NA_PRONE[d] && rng()<0.16){ st='na'; na++; }
      else if(rng()<p){ st='received'; rec++; }
      else { st='pending'; pen++; }
      docs[d]={status:st, note:''};
    });
    var applicable=rec+pen;
    var completion=applicable? rec/applicable : 1;
    var eligible = cfg.vint>0 ? vint>=cfg.vint : p>0.4;
    var qualified = eligible && completion>=0.6;
    var credit = qualified && completion>=0.86 && rng()>0.35;
    var hasR = !credit && rng()<0.5;
    var remarks = hasR? REMARKS[Math.floor(rng()*REMARKS.length)] : '';
    var eta = hasR? ETAS[Math.floor(rng()*ETAS.length)] : '';
    ents.push({
      id:id+'-'+i, nbfc:id, name:name, state:state, region:REGIONS[si], entityType:ENTITY[Math.floor(rng()*ENTITY.length)],
      gstin:gstFor(state,rng), vintage:vint, docList:docList, docs:docs,
      rec:rec, pen:pen, na:na, applicable:applicable, completion:completion,
      eligible:eligible, qualified:qualified, credit:credit,
      remarks:remarks, eta:eta,
      onboardMon:['Jan','Feb','Mar','Apr','May','Jun','Jul'][Math.floor(rng()*7)]+" '"+(23+Math.floor(rng()*3))
    });
  }
  return {cfg:cfg, id:id, entities:ents};
}
var DATA={billmart:buildNbfc('billmart'),capitalxb:buildNbfc('capitalxb'),strideone:buildNbfc('strideone')};
var activeId='billmart';

/* ═══════════════════════════ aggregates ════════════════════════════════ */
function aggregate(nb){
  var e=nb.entities, n=e.length;
  var total=n, eligible=0, qualified=0, credit=0, sumComp=0;
  e.forEach(function(x){ if(x.eligible)eligible++; if(x.qualified)qualified++; if(x.credit)credit++; sumComp+=x.completion; });
  var avg=n? sumComp/n : 0;
  // bottlenecks per doc
  var docList=e.length? e[0].docList : [];
  var bott=docList.map(function(d){
    var r=0,ap=0;
    e.forEach(function(x){ var s=x.docs[d].status; if(s==='na')return; ap++; if(s==='received')r++; });
    return {doc:d, rec:r, applicable:ap, missing:ap-r, pct: ap? r/ap : 1};
  }).sort(function(a,b){return a.pct-b.pct});
  // completion buckets
  var buckets=[0,0,0,0,0];
  e.forEach(function(x){ var b=clamp(Math.floor(x.completion*5),0,4); buckets[b]++; });
  // attention
  var attn=e.filter(function(x){ return x.eta||x.remarks||x.completion<0.5; })
    .sort(function(a,b){ var ae=a.eta?0:1, be=b.eta?0:1; if(ae!==be)return ae-be; return a.completion-b.completion; })
    .slice(0,6);
  return {total:total,eligible:eligible,qualified:qualified,credit:credit,avg:avg,bott:bott,buckets:buckets,attn:attn};
}

/* ═══════════════════════════ accent theming ════════════════════════════ */
function applyAccent(id){
  var c=NBFCS[id]; var r=document.documentElement.style;
  r.setProperty('--nc',c.nc); r.setProperty('--nc-rgb',c.rgb); r.setProperty('--nc-ring',c.ring);
}

/* ═══════════════════════════ render canvas ═════════════════════════════ */
function pct(x){return Math.round(x*100)}
function renderCanvas(){
  var nb=DATA[activeId], cfg=nb.cfg, A=aggregate(nb);
  applyAccent(activeId);

  $('phName').textContent=cfg.name;
  $('ehText').textContent = cfg.noun==='buyer'?'Buyer portfolio · executive overview':'Seller portfolio · executive overview';
  $('phSub').innerHTML='<b>'+A.total+'</b> '+cfg.noun+'s tracked · <b>'+pct(A.avg)+'%</b> average document completion · <b>'+A.credit+'</b> at credit approval';

  var Noun=cfg.noun.charAt(0).toUpperCase()+cfg.noun.slice(1);
  // stat strip
  var stats=[
    {k:Noun+'s',ic:IC.users,v:A.total,d:'in this book',ac:cfg.nc},
    {k:'Avg completion',ic:IC.gauge,v:pct(A.avg),suf:'%',d:'documents received',ac:cfg.nc},
    {k:'First check',ic:IC.shield,v:A.eligible,d:pct(A.eligible/A.total)+'% eligible',ac:'var(--rk-green)'},
    {k:'Credit approved',ic:IC.card,v:A.credit,d:pct(A.credit/A.total)+'% of book',ac:cfg.nc}
  ];
  $('statStrip').innerHTML=stats.map(function(s){
    return '<div class="stat reveal" style="--stat-ac:'+s.ac+'">'+
      '<div class="k">'+s.ic+s.k+'</div>'+
      '<div class="v">'+s.v+(s.suf?'<small>'+s.suf+'</small>':'')+'</div>'+
      '<div class="d">'+s.d+'</div></div>';
  }).join('');

  // funnel
  var steps=[
    {l:'Total',v:A.total,t:'t1'},
    {l:'First check',v:A.eligible,t:'t2'},
    {l:'Qualified',v:A.qualified,t:'t3'},
    {l:'Credit',v:A.credit,t:'t4'}
  ];
  var maxV=A.total||1;
  $('funnelHint').textContent=cfg.noun==='buyer'?'buyer pipeline':'seller pipeline';
  $('funnel').innerHTML=steps.map(function(s,i){
    var w=Math.max(6,(s.v/maxV)*100);
    var conv=i===0?'':Math.round((s.v/(steps[i-1].v||1))*100)+'%';
    var cls=i===0?'':(s.v/(steps[i-1].v||1)>=0.7?'good':(s.v/(steps[i-1].v||1)>=0.45?'':'warn'));
    return '<div class="frow '+s.t+'">'+
      '<div class="fl">'+s.l+'</div>'+
      '<div class="fbar-wrap"><div class="fbar" data-w="'+w+'"><b>'+s.v+'</b></div></div>'+
      '<div class="fconv '+cls+'">'+(conv?('&darr; '+conv):'&mdash;')+'</div></div>';
  }).join('');
  var overall=Math.round((A.credit/(A.total||1))*100);
  $('funnelFoot').innerHTML=
    '<div class="ffoot-i"><div class="fv">'+overall+'%</div><div class="fk">Total &rarr; Credit</div></div>'+
    '<div class="ffoot-i"><div class="fv">'+Math.round((A.qualified/(A.eligible||1))*100)+'%</div><div class="fk">Check &rarr; Qualified</div></div>'+
    '<div class="ffoot-i"><div class="fv">'+(A.eligible-A.qualified)+'</div><div class="fk">Stuck at check</div></div>';

  // bottlenecks (worst 6)
  $('bottle').innerHTML=A.bott.slice(0,6).map(function(b,i){
    var hot=b.pct<0.55;
    return '<div class="brow '+(hot?'hot':'')+'">'+
      '<div class="bname"><span class="brank">'+(i+1)+'</span>'+esc(b.doc)+'</div>'+
      '<div class="bstat">'+(b.missing>0?'<em>'+b.missing+' missing</em>':'complete')+' · '+b.applicable+' appl.</div>'+
      '<div class="bmeter"><i data-w="'+pct(b.pct)+'"></i></div>'+
      '</div>';
  }).join('');
  // append pct at right — rebuild with pct column inline
  $('bottle').innerHTML=A.bott.slice(0,6).map(function(b,i){
    var hot=b.pct<0.55;
    return '<div class="brow '+(hot?'hot':'')+'">'+
      '<div class="bname"><span class="brank">'+(i+1)+'</span>'+esc(b.doc)+'</div>'+
      '<div class="bpct">'+pct(b.pct)+'%</div>'+
      '<div class="bmeter"><i data-w="'+pct(b.pct)+'"></i></div>'+
      '<div class="bstat" style="grid-column:1/-1;text-align:left;margin-top:2px">'+
        (b.missing>0?'<em>'+b.missing+' '+cfg.noun+'s still owe this</em>':'received by all')+' · '+b.applicable+' applicable</div>'+
      '</div>';
  }).join('');

  // completion spread
  var maxB=Math.max.apply(null,A.buckets)||1;
  var labels=['0–20','20–40','40–60','60–80','80–100'];
  $('hist').innerHTML=A.buckets.map(function(c,i){
    var h=(c/maxB)*100;
    return '<div class="hcol '+(i<2?'lo':'')+'">'+
      '<div class="hbar-wrap"><div class="hbar" data-h="'+h+'"><span class="hn">'+c+'</span></div></div>'+
      '<div class="hx">'+labels[i]+'%</div></div>';
  }).join('');
  var below=A.buckets[0]+A.buckets[1];
  $('spreadAvg').innerHTML='<div class="big">'+pct(A.avg)+'%</div><div class="lbl">portfolio average &middot; <b style="color:var(--amber-ink)">'+below+'</b> '+cfg.noun+'s below 40% completion</div>';

  // attention
  if(!A.attn.length){ $('attn').innerHTML='<div class="attn-empty">Nothing flagged — every '+cfg.noun+' is on track.</div>'; }
  else{
    $('attn').innerHTML=A.attn.map(function(e){
      var lo=e.completion<0.5;
      var right='';
      if(e.eta) right+='<span class="eta-pill">'+IC.clock+'ETA · '+esc(e.eta)+'</span>';
      else if(e.remarks) right+='<span class="rmk-pill">'+IC.chat+esc(e.remarks)+'</span>';
      return '<div class="arow" data-id="'+e.id+'">'+
        '<div class="av">'+esc(initials(e.name))+'</div>'+
        '<div class="amid">'+
          '<div class="anm">'+esc(e.name)+'</div>'+
          '<div class="asub"><div class="mini-prog '+(lo?'lo':'')+'"><i style="width:'+pct(e.completion)+'%"></i></div>'+
          '<span class="apct">'+pct(e.completion)+'%</span>'+
          '<span style="font-size:11px;color:var(--ink-3)">'+esc(e.region)+' · '+esc(e.entityType)+'</span></div>'+
        '</div>'+
        '<div class="aright">'+right+'<span class="chev">'+IC.chev+'</span></div>'+
      '</div>';
    }).join('');
    Array.prototype.forEach.call($('attn').querySelectorAll('.arow'),function(row){
      row.addEventListener('click',function(){ openJourney(row.getAttribute('data-id')); });
    });
  }

  // animate bars — setTimeout (rAF stalls when the preview pane isn't compositing)
  setTimeout(function(){
    Array.prototype.forEach.call(document.querySelectorAll('.fbar'),function(el){ el.style.width=el.getAttribute('data-w')+'%'; });
    Array.prototype.forEach.call(document.querySelectorAll('.bmeter i'),function(el){ el.style.width=el.getAttribute('data-w')+'%'; });
    Array.prototype.forEach.call(document.querySelectorAll('.hbar'),function(el){ el.style.height=el.getAttribute('data-h')+'%'; });
  }, 45);
}

/* ═══════════════════════════ Seller Journey ════════════════════════════ */
function ringSvg(pctVal,size){
  var r=(size-8)/2, c=2*Math.PI*r, off=c*(1-pctVal/100);
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--fill-2)" stroke-width="6"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--nc)" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+c+'" style="transition:stroke-dashoffset 1s var(--drawer-open)" data-off="'+off+'"/></svg>';
}
function stageInfo(e){
  // returns 5 stations with state: done | current | blocked | upcoming
  var Noun=e.nbfc==='strideone'?'buyer':'seller';
  var st=[
    {t:'Onboarded', s:'Joined '+e.onboardMon, ic:IC.flag},
    {t:'Documents',  s:e.rec+'/'+e.applicable+' received', ic:IC.doc},
    {t:'First Check',s: e.eligible?'Eligibility passed':'Vintage '+e.vintage+'y', ic:IC.shield},
    {t:'Qualified',  s: e.qualified?'Credit-ready':'Under review', ic:IC.gauge},
    {t:'Credit',     s: e.credit?'Limit assigned':'—', ic:IC.card}
  ];
  // reached index
  var reached=0;                         // onboarded always
  if(e.applicable>0) reached=1;          // documents stage engaged
  if(e.eligible) reached=2;
  if(e.qualified) reached=3;
  if(e.credit) reached=4;
  st.forEach(function(x,i){
    if(i<reached) x.state='done';
    else if(i===reached && !e.credit) x.state='current';
    else if(i===reached && e.credit) x.state='done';
    else x.state='upcoming';
  });
  // blocked nuance: if current is documents/check and incomplete with eta
  var cur=st[reached];
  if(cur && cur.state==='current' && (e.eta||e.completion<0.6)) { cur.state='blocked'; cur.badge='Blocked'; }
  else if(cur && cur.state==='current') cur.badge='In progress';
  return {stations:st, reached:reached};
}
function openJourney(id){
  var e=null;
  DATA[activeId].entities.forEach(function(x){ if(x.id===id)e=x; });
  if(!e) return;
  var cfg=NBFCS[e.nbfc];
  $('jName').textContent=e.name;
  $('jChips').innerHTML=
    '<span class="chip brand">'+IC.card+cfg.name+'</span>'+
    '<span class="chip">'+IC.pin+esc(e.region)+' · '+esc(e.state)+'</span>'+
    '<span class="chip">'+esc(e.entityType)+'</span>'+
    '<span class="chip">Vintage '+e.vintage+' yr</span>'+
    '<span class="chip mono">'+esc(e.gstin)+'</span>';
  $('jRing').innerHTML=ringSvg(pct(e.completion),88)+'<div class="rl"><b>'+pct(e.completion)+'%</b><span>Docs</span></div>';

  var J=stageInfo(e);
  $('rail').innerHTML=J.stations.map(function(s){
    var ico = s.state==='done'?IC.check : (s.state==='blocked'?IC.clock : (s.state==='upcoming'?IC.dash : s.ic));
    return '<div class="station '+s.state+'">'+
      '<div class="node">'+ico+'</div>'+
      '<div class="st-t">'+s.t+'</div>'+
      '<div class="st-s">'+esc(s.s)+'</div>'+
      (s.badge?'<div class="st-badge">'+s.badge+'</div>':'')+
    '</div>';
  }).join('');

  // doc card grouped
  var groups={received:[],pending:[],na:[]};
  e.docList.forEach(function(d){ var st=e.docs[d].status; groups[st==='received'?'received':st==='na'?'na':'pending'].push(d); });
  function chips(list,cls,icon){ return list.map(function(d){ return '<div class="dchip '+cls+'"><div class="di">'+icon+'</div><div class="dn">'+esc(d)+'</div></div>'; }).join(''); }
  $('docCard').innerHTML=
    '<div class="dc-h"><div class="t">Document checklist</div><div class="counts">'+
      '<span class="cbadge rec">'+groups.received.length+' received</span>'+
      '<span class="cbadge pen">'+groups.pending.length+' pending</span>'+
      (groups.na.length?'<span class="cbadge na">'+groups.na.length+' n/a</span>':'')+
    '</div></div>'+
    '<div class="doc-grid">'+
      chips(groups.pending,'pen',IC.clock)+
      chips(groups.received,'rec',IC.check)+
      chips(groups.na,'na',IC.dash)+
    '</div>';

  // side card: meta + funnel status + remark
  var fstatus=e.credit?'Credit approved':e.qualified?'Qualified — credit pending':e.eligible?'Eligible — qualifying':'Not yet eligible';
  var remark='';
  if(e.remarks||e.eta){
    remark='<div class="remark-card"><div class="rh">'+IC.chat+'Follow-up'+
      (e.eta?'<span class="eta">'+IC.clock+'ETA · '+esc(e.eta)+'</span>':'')+'</div>'+
      (e.remarks?'<div class="rb">'+esc(e.remarks)+'</div>':'')+'</div>';
  }
  $('sideCard').innerHTML=
    '<div class="dc-h"><div class="t">Profile</div></div>'+
    '<div class="meta-list">'+
      '<div class="mrow"><span class="mk">Stage</span><span class="mv">'+esc(fstatus)+'</span></div>'+
      '<div class="mrow"><span class="mk">Vintage</span><span class="mv">'+e.vintage+' yr</span></div>'+
      '<div class="mrow"><span class="mk">Region</span><span class="mv">'+esc(e.region)+'</span></div>'+
      '<div class="mrow"><span class="mk">State</span><span class="mv">'+esc(e.state)+'</span></div>'+
      '<div class="mrow"><span class="mk">Entity</span><span class="mv">'+esc(e.entityType)+'</span></div>'+
      '<div class="mrow"><span class="mk">GSTIN</span><span class="mv mono">'+esc(e.gstin)+'</span></div>'+
    '</div>'+remark;

  $('scrim').classList.add('on');
  document.body.style.overflow='hidden';
  setTimeout(function(){
    var reachW=[8,30,50,72,92][J.reached] || 8;
    $('railFill').style.width=reachW+'%';
    var rc=$('jRing').querySelector('circle[data-off]'); if(rc) rc.style.strokeDashoffset=rc.getAttribute('data-off');
  }, 45);
}
function closeJourney(){ $('scrim').classList.remove('on'); document.body.style.overflow=''; }

/* ═══════════════════════════ wiring ════════════════════════════════════ */
function moveGlider(btn){
  var g=$('glider'); g.style.width=btn.offsetWidth+'px'; g.style.transform='translateX('+btn.offsetLeft+'px)';
}
function initSeg(){
  var seg=$('seg'), btns=seg.querySelectorAll('button');
  var on=seg.querySelector('button.on'); moveGlider(on);
  Array.prototype.forEach.call(btns,function(b){
    b.addEventListener('click',function(){
      seg.querySelector('button.on').classList.remove('on');
      b.classList.add('on'); moveGlider(b);
      activeId=b.getAttribute('data-id'); renderCanvas();
    });
  });
}
$('themeBtn').addEventListener('click',function(){
  var r=document.documentElement;
  var cur=r.getAttribute('data-theme');
  if(!cur){ cur = matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'; }
  r.setAttribute('data-theme', cur==='dark'?'light':'dark');
});
$('jmX').addEventListener('click',closeJourney);
$('scrim').addEventListener('click',function(e){ if(e.target===$('scrim')) closeJourney(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeJourney(); });
window.addEventListener('resize',function(){ var on=$('seg').querySelector('button.on'); if(on) moveGlider(on); });

initSeg();
renderCanvas();
</script>
