<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBFC Tracker — Recykal Open Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════════
   NBFC Tracker — Recykal Open Marketplace credit-onboarding platform
   Design system: Recykal brand · Poppins · flat/hairline · warm paper
   Two colour axes kept separate:
     · per-NBFC accent  = identity  (changes with the NBFC)
     · status semantics = meaning   (green/amber/rose/grey, never change)
   ══════════════════════════════════════════════════════════════════════ */

:root{
  /* Brand */
  --brand:#005DFF; --brand-rgb:0,93,255;
  --brand-midnight:#024C8A; --brand-purple:#8460D4;
  --brand-mint:#1DC797; --brand-green:#049769;

  /* Warm paper ground */
  --bg:#FAFAF8; --surface:#FFFFFF; --surface-2:#F4F3EE;
  --ink:#14150F; --ink-2:#54564A; --ink-3:#6F7165;
  --line:rgba(20,21,15,.12); --line-2:rgba(20,21,15,.07);
  --fill:rgba(20,21,15,.045);

  /* Status semantics */
  --ok:#049769;   --ok-tint:#E7F3EC;   --ok-rgb:4,151,105;
  --warn:#B9782B; --warn-tint:#FBF0DF;  --warn-rgb:185,120,43;
  --bad:#C0392B;  --bad-tint:#FBEAE7;   --bad-rgb:192,57,43;
  --na:#8D8F82;   --na-tint:#EEEEE8;

  /* Per-NBFC accents (identity) */
  --nc:#005DFF; --nc-rgb:0,93,255;

  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(20,21,15,.04);
  --shadow-lg:0 20px 48px rgba(20,21,15,.14),0 8px 20px rgba(20,21,15,.08);
  --sidebar-w:250px; --topbar-h:60px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --font:'Poppins','Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'SF Mono','Roboto Mono',Menlo,monospace;
}
:root[data-theme="dark"]{
  --bg:#0E0F0C; --surface:#191A15; --surface-2:#22231D;
  --ink:#F2F1EA; --ink-2:#A9AA9C; --ink-3:#8B8C7F;
  --line:rgba(242,241,234,.13); --line-2:rgba(242,241,234,.07);
  --fill:rgba(242,241,234,.05);
  --ok-tint:rgba(4,151,105,.16); --warn-tint:rgba(185,120,43,.18);
  --bad-tint:rgba(192,57,43,.18); --na-tint:rgba(141,143,130,.16);
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --shadow-lg:0 24px 60px rgba(0,0,0,.6);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);background:var(--bg);color:var(--ink);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:rgba(var(--brand-rgb),.16)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}

/* ─────────────────────────── LOGIN ─────────────────────────── */
#login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);padding:24px}
.login-card{width:min(370px,100%);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:34px 32px;box-shadow:var(--shadow)}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.login-logo .mk{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:-.03em}
.login-logo b{font-weight:600;font-size:15px;letter-spacing:.01em;color:var(--ink)}
.login-card h2{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-bottom:5px}
.login-card .sub{color:var(--ink-3);font-size:13px;margin-bottom:26px}
.role-lbl{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:7px}
.field{margin-bottom:15px}
.field label{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;
  letter-spacing:.08em;color:var(--ink-3);margin-bottom:7px}
.field .inp{position:relative}
.field input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);
  background:var(--surface);font-size:14px;transition:border-color .16s,box-shadow .16s}
.field input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(var(--brand-rgb),.13)}
.role-row{display:flex;gap:8px;margin-bottom:22px}
.role-opt{flex:1;padding:11px 10px;border:1px solid var(--line);border-radius:var(--radius-sm);
  text-align:center;font-size:12.5px;font-weight:500;color:var(--ink-2);transition:.16s}
.role-opt .r-t{font-weight:600;color:var(--ink);font-size:13px}
.role-opt.on{border-color:var(--brand);background:rgba(var(--brand-rgb),.06)}
.role-opt.on .r-t{color:var(--brand)}
.btn-login{width:100%;padding:12.5px;border-radius:var(--radius-sm);background:var(--brand);color:#fff;
  font-weight:600;font-size:14px;letter-spacing:.01em;transition:filter .15s,transform .05s}
.btn-login:hover{filter:brightness(1.06)}.btn-login:active{transform:translateY(1px)}
.login-note{margin-top:24px;padding:11px 13px;background:var(--surface-2);border-radius:var(--radius-sm);
  font-size:11.5px;color:var(--ink-3);line-height:1.5;border:1px solid var(--line-2)}

/* ─────────────────────────── APP SHELL ─────────────────────────── */
#app{display:none;min-height:100vh}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--surface);
  border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30}
.sb-brand{display:flex;align-items:center;gap:10px;height:var(--topbar-h);padding:0 18px;
  border-bottom:1px solid var(--line);flex-shrink:0}
.sb-brand .mk{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:-.03em}
.sb-brand b{font-weight:600;font-size:14.5px}.sb-brand .mut{font-size:10.5px;color:var(--ink-3);font-weight:500}
.sb-nav{flex:1;overflow-y:auto;padding:12px 12px 20px}
.sb-group{margin-top:16px;padding:0 10px 6px;font-size:10px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3)}
.sb-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;
  font-size:13px;font-weight:500;color:var(--ink-2);position:relative;transition:.13s;margin-bottom:1px}
.sb-item svg{width:17px;height:17px;flex-shrink:0;stroke-width:2}
.sb-item .badge{margin-left:auto;font-size:11px;font-weight:600;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.sb-item:hover{background:var(--fill);color:var(--ink)}
.sb-item.on{background:rgba(var(--nc-rgb),.10);color:var(--nc)}
.sb-item.on .badge{color:var(--nc)}
.sb-item.on::before{content:'';position:absolute;left:-12px;top:7px;bottom:7px;width:3px;
  border-radius:0 3px 3px 0;background:var(--nc)}
.sb-item .dot{width:8px;height:8px;border-radius:50%;margin-left:auto}
.sb-foot{padding:12px;border-top:1px solid var(--line);flex-shrink:0}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px}
.sb-user:hover{background:var(--fill)}
.sb-ava{width:32px;height:32px;border-radius:9px;background:var(--brand-purple);color:#fff;
  display:grid;place-items:center;font-weight:600;font-size:12.5px}
.sb-user .nm{font-size:12.5px;font-weight:600;line-height:1.2}
.sb-user .rl{font-size:11px;color:var(--ink-3)}

.main{margin-left:var(--sidebar-w)}
.topbar{position:sticky;top:0;z-index:20;height:var(--topbar-h);display:flex;align-items:center;
  gap:14px;padding:0 26px;background:rgba(var(--brand-rgb),0);backdrop-filter:blur(8px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--line)}
.tb-title{font-size:15px;font-weight:600;letter-spacing:-.01em}
.tb-title .mut{color:var(--ink-3);font-weight:400;margin-left:8px;font-size:13px}
.tb-search{margin-left:auto;position:relative;width:260px}
.tb-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;
  color:var(--ink-3);stroke-width:2}
.tb-search input{width:100%;padding:8px 11px 8px 33px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface);font-size:13px}
.tb-search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(var(--brand-rgb),.12)}
.tb-sync{display:flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--line);
  border-radius:999px;font-size:12px;color:var(--ink-2);font-weight:500}
.tb-sync .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.tb-sync .dot.live{box-shadow:0 0 0 0 rgba(var(--ok-rgb),.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(var(--ok-rgb),.5)}70%{box-shadow:0 0 0 6px rgba(var(--ok-rgb),0)}100%{box-shadow:0 0 0 0 rgba(var(--ok-rgb),0)}}
.icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);
  border:1px solid var(--line)}
.icon-btn:hover{background:var(--fill);color:var(--ink)}
.icon-btn svg{width:16px;height:16px;stroke-width:2}

.content{padding:24px 26px 60px}
.view{display:none;animation:fade .3s var(--ease)}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ─────────────────────────── KPI CARDS ─────────────────────────── */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:13px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px 17px;position:relative;overflow:hidden;
  transition:border-color .16s var(--ease),background .16s var(--ease)}
.kpi.clickable{cursor:pointer}
.kpi.clickable:hover{border-color:var(--ink-3)}
.kpi .k-label{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.kpi .k-num{font-size:38px;font-weight:600;letter-spacing:-.03em;line-height:1.02;margin-top:11px;font-variant-numeric:tabular-nums}
.kpi .k-sub{font-size:12px;color:var(--ink-3);margin-top:10px;display:flex;align-items:center;gap:5px}
.kpi .k-sub .arw{opacity:.55;transition:transform .16s var(--ease)}
.kpi.clickable:hover .k-sub .arw{transform:translateX(3px)}
.kpi.amber .k-num{color:var(--warn)}
/* Metric with no column in the master sheet — muted dash, never a number. */
.kpi .k-nodata{color:var(--ink-3);opacity:.42;font-weight:400}

/* Needs-documents rows — one per entity not yet eligible for the selected NBFC.
   Every document chip comes from that NBFC's requirement matrix. */
.nd-row{display:flex;gap:12px;align-items:flex-start;padding:12px 18px;
  border-bottom:1px solid var(--line-2);cursor:pointer;transition:background .13s var(--ease)}
.nd-row:last-child{border-bottom:none}
.nd-row:hover{background:var(--fill)}
.nd-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.nd-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.nd-name{font-size:13px;font-weight:600;line-height:1.3}
.nd-type{font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:1px 5px;flex-shrink:0}
.nd-req{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.nd-tags{display:flex;flex-wrap:wrap;gap:5px}
.nd-more{opacity:.72}
.nd-meta{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.nd-status{flex-shrink:0;margin-top:1px}

/* ─────────────────────────── CARDS / SECTIONS ─────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.card+.card{margin-top:18px}
.card-h{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.card-h .sub{font-size:12.5px;color:var(--ink-3);font-weight:400}
.card-h .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
@media(max-width:1100px){.grid-2{grid-template-columns:1fr}}

/* ─────────────────────────── NBFC ELIGIBILITY BARS ─────────────────────────── */
.nbfc-elig-list{padding:6px 18px 16px}
.nbfc-elig{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.nbfc-elig:last-child{border-bottom:none}
.ne-badge{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:700;
  font-size:12px;color:#fff;flex-shrink:0}
.ne-name{font-weight:600;font-size:13.5px;min-width:96px}
.ne-name .mut{display:block;font-size:11px;color:var(--ink-3);font-weight:400}
.ne-track{flex:1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.ne-fill{height:100%;border-radius:4px}
.ne-count{font-size:12.5px;font-weight:600;min-width:118px;text-align:right;font-variant-numeric:tabular-nums}
.ne-count .mut{color:var(--ink-3);font-weight:400}

/* ─────────────────────────── TABLES ─────────────────────────── */
.toolbar{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.search-sm{position:relative;flex:1;min-width:180px;max-width:320px}
.search-sm svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ink-3)}
.search-sm input{width:100%;padding:8px 10px 8px 31px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);font-size:13px}
.search-sm input:focus{outline:none;border-color:var(--brand)}
.chip{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);transition:.13s}
.chip:hover{border-color:var(--ink-3)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tbl-count{font-size:12px;color:var(--ink-3);margin-left:auto;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow:auto;max-height:min(64vh,720px)}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:760px}
.tbl thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);color:var(--ink-3);
  text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  padding:10px 13px;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl tbody td{padding:11px 13px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tbody tr{cursor:pointer;transition:background .1s}
.tbl tbody tr:hover td{background:var(--fill)}
.tbl tbody tr:last-child td{border-bottom:none}
.cell-name{font-weight:600;letter-spacing:-.005em;line-height:1.25;max-width:250px}
.cell-sub{font-size:11.5px;color:var(--ink-3);font-weight:400;margin-top:1px}
.gst{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);letter-spacing:-.02em}
.vcat{display:inline-flex;align-items:center;gap:5px;font-size:12px}
.vcat .vd{width:7px;height:7px;border-radius:2px}
.vd.plastic{background:var(--brand)}.vd.metal{background:var(--brand-purple)}

/* progress cell */
.prog{display:flex;align-items:center;gap:9px;min-width:130px}
.prog .track{flex:1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--ink)}
.prog .pt{font-size:11.5px;font-weight:600;color:var(--ink-2);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}

/* eligibility chips in table */
.elig-chips{display:flex;gap:4px;flex-wrap:wrap;max-width:230px}
.ec{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:700;
  color:#fff;position:relative}
.ec.blocked{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.ec .n{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:8.5px;
  width:14px;height:14px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--surface)}

.status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:11px;font-weight:600}
.status-pill .d{width:6px;height:6px;border-radius:50%}
.sp-ok{background:var(--ok-tint);color:var(--ok)}.sp-ok .d{background:var(--ok)}
.sp-warn{background:var(--warn-tint);color:var(--warn)}.sp-warn .d{background:var(--warn)}
.sp-bad{background:var(--bad-tint);color:var(--bad)}.sp-bad .d{background:var(--bad)}
.sp-na{background:var(--na-tint);color:var(--na)}.sp-na .d{background:var(--na)}

/* ─────────────────────────── NBFC PAGE ─────────────────────────── */
.nbfc-hero{display:flex;align-items:flex-start;gap:16px;padding:20px 22px;border-radius:var(--radius);
  border:1px solid var(--line);background:var(--surface);margin-bottom:20px;position:relative;overflow:hidden}
.nbfc-hero::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--nc)}
.nbfc-hero .bmk{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;
  font-weight:700;font-size:17px;color:#fff;background:var(--nc);flex-shrink:0}
.nbfc-hero h2{font-size:21px;font-weight:600;letter-spacing:-.02em}
.nbfc-hero .h-sub{color:var(--ink-3);font-size:13px;margin-top:2px}
.nbfc-hero .h-stats{margin-left:auto;display:flex;gap:26px;text-align:right}
.nbfc-hero .h-stats .s b{display:block;font-size:24px;font-weight:600;letter-spacing:-.02em}
.nbfc-hero .h-stats .s span{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.split-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:1000px){.split-cols{grid-template-columns:1fr}.nbfc-hero .h-stats{display:none}}
/* ─────────────────────────── NBFC DASHBOARD — 7-CARD KPI ROW ─────────────────────────── */
.kpi-row-7{grid-template-columns:repeat(7,1fr);gap:10px}
.kpi-row-7 .kpi .k-num{font-size:28px;margin-top:9px}
.kpi-row-7 .kpi.compact .k-num{font-size:20px;margin-top:11px;letter-spacing:-.01em}
@media(max-width:1400px){.kpi-row-7{grid-template-columns:repeat(4,1fr)}}
@media(max-width:900px){.kpi-row-7{grid-template-columns:repeat(2,1fr)}}
/* ─────────────────────────── DOCUMENT REQUIREMENT ROWS ─────────────────────────── */
/* Document requirements — compact grid. No progress bars: the three counts
   carry the same information in a fraction of the height, and a 20-document
   NBFC fits in four rows instead of twenty. 1px gap over a line-coloured
   background draws the hairline dividers. */
.drq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));
  gap:1px;background:var(--line-2);border-top:1px solid var(--line-2)}
.drq{background:var(--surface);padding:11px 16px 12px;display:flex;flex-direction:column;gap:6px}
.drq-nm{font-size:12.5px;font-weight:500;line-height:1.32}
.drq-cat{font-size:10px;color:var(--ink-3);font-weight:400;letter-spacing:.05em;text-transform:uppercase}
.drq-stat{display:flex;align-items:baseline;gap:10px;font-size:13px;font-variant-numeric:tabular-nums}
.drq-ok{color:var(--ok);font-weight:600}
.drq-warn{color:var(--warn);font-weight:600}
.drq-bad{color:var(--bad);font-weight:600}
.drq-pct{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-weight:500}
.drq-none{font-size:11.5px;color:var(--ink-3)}
/* Legend in the card header, so the bare numbers above read unambiguously. */
.drq-key{display:flex;gap:12px;align-items:center;font-size:10.5px;color:var(--ink-3)}
.drq-key span{display:inline-flex;align-items:center;gap:5px}
.drq-key i{width:6px;height:6px;border-radius:50%}
.ent-row{display:flex;align-items:center;gap:11px;padding:11px 18px;border-bottom:1px solid var(--line-2);cursor:pointer}
.ent-row:hover{background:var(--fill)}
.ent-row:last-child{border-bottom:none}
.ent-ava{width:30px;height:30px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;
  font-size:11px;font-weight:700;color:var(--ink-2);flex-shrink:0}
.ent-row .en{font-weight:600;font-size:13px;line-height:1.2;flex:1;min-width:0}
.ent-row .en .mut{font-size:11px;color:var(--ink-3);font-weight:400}
.miss-tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:52%}
.miss-tag{font-size:10px;font-weight:500;padding:2px 7px;border-radius:6px;background:var(--bad-tint);color:var(--bad)}

/* ─────────────────────────── MATRIX ─────────────────────────── */
.matrix-wrap{overflow:auto;max-height:72vh}
table.matrix{border-collapse:separate;border-spacing:0;min-width:100%}
.matrix th,.matrix td{border-bottom:1px solid var(--line-2);white-space:nowrap}
.matrix thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);font-size:10px;font-weight:600;
  color:var(--ink-3);letter-spacing:.02em;text-transform:uppercase;padding:10px 7px;text-align:center;
  max-width:40px;white-space:normal;vertical-align:bottom;line-height:1.25;border-bottom:1px solid var(--line)}
.matrix thead th:first-child{left:0;z-index:4;text-align:left;padding-left:16px;min-width:210px;max-width:210px}
.matrix tbody th{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;font-size:12.5px;
  font-weight:500;padding:9px 16px;max-width:210px;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.matrix tbody tr:hover th,.matrix tbody tr:hover td{background:var(--fill)}
.matrix td{text-align:center;padding:7px}
.mdot{display:inline-block;width:11px;height:11px;border-radius:50%}
.mdot.ok{background:var(--ok)}.mdot.warn{background:var(--warn)}.mdot.bad{background:var(--bad);opacity:.5}
.mdot.na{background:transparent;border:1.5px solid var(--na)}
.mdot.exp{background:var(--bad);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px rgba(var(--bad-rgb),.5)}

/* ─────────────────────────── SETTINGS ─────────────────────────── */
.settings-layout{display:grid;grid-template-columns:210px 1fr;gap:22px}
@media(max-width:900px){.settings-layout{grid-template-columns:1fr}}
.set-nav{position:sticky;top:calc(var(--topbar-h) + 20px);align-self:start}
.set-nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:13px;
  font-weight:500;color:var(--ink-2);margin-bottom:2px}
.set-nav-item svg{width:16px;height:16px;stroke-width:2}
.set-nav-item:hover{background:var(--fill)}
.set-nav-item.on{background:rgba(var(--brand-rgb),.09);color:var(--brand)}
.set-panel{display:none}.set-panel.on{display:block}
.doc-cat-row,.map-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line-2)}
.doc-cat-row:last-child{border-bottom:none}
.dc-cat{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
  padding:12px 16px 4px;background:var(--surface-2)}
.dc-name{font-weight:600;font-size:13px;flex:1}
.dc-alias{font-size:11.5px;color:var(--ink-3);margin-top:2px;font-weight:400}
.toggle{width:38px;height:22px;border-radius:999px;background:var(--surface-2);position:relative;
  transition:.16s;flex-shrink:0;border:1px solid var(--line)}
.toggle.on{background:var(--brand);border-color:var(--brand)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;transition:.16s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on::after{transform:translateX(16px)}
.map-grid{display:grid;grid-template-columns:1fr;gap:0}
.map-nbfc-tabs{display:flex;gap:6px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.map-tab{padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-2);
  border:1px solid var(--line)}
.map-tab.on{color:#fff}
.reqmap-item{display:flex;align-items:center;gap:11px;padding:9px 16px;border-bottom:1px solid var(--line-2)}
.reqmap-item .rm-check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);
  display:grid;place-items:center;flex-shrink:0}
.reqmap-item.req .rm-check{background:var(--brand);border-color:var(--brand)}
.reqmap-item.req .rm-check svg{width:12px;height:12px;color:#fff}
.reqmap-item .rm-name{font-size:13px;font-weight:500}
.reqmap-item.req .rm-name{font-weight:600}
.reqmap-item .rm-cat{margin-left:auto;font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.sync-stat{display:flex;gap:16px;padding:18px;flex-wrap:wrap}
.sync-box{flex:1;min-width:150px;padding:15px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--bg)}
.sync-box .sl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.sync-box .sv{font-size:19px;font-weight:600;margin-top:6px;letter-spacing:-.01em}
.btn{padding:9px 15px;border-radius:9px;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface)}
.btn:hover{background:var(--fill)}
.btn-primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn-primary:hover{filter:brightness(1.06);background:var(--brand)}
.btn-sm{padding:6px 11px;font-size:12px}
.user-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.user-row:last-child{border-bottom:none}

/* ─────────────────────────── DRAWER (detail) ─────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(10,11,8,.4);backdrop-filter:blur(3px);z-index:60;opacity:0;
  pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);z-index:70;
  transform:translateX(100%);transition:transform .3s var(--ease);display:flex;flex-direction:column;
  box-shadow:var(--shadow-lg)}
.drawer.on{transform:none}
.dr-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px;
  background:var(--surface)}
.dr-head .dr-ava{width:44px;height:44px;border-radius:11px;background:var(--nc);color:#fff;display:grid;
  place-items:center;font-weight:700;font-size:15px;flex-shrink:0}
.dr-head h2{font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.dr-head .dh-sub{font-size:12px;color:var(--ink-3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dr-x{margin-left:auto;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3);flex-shrink:0}
.dr-x:hover{background:var(--fill);color:var(--ink)}
.dr-body{flex:1;overflow-y:auto;padding:20px 22px}
.dr-ring-row{display:flex;align-items:center;gap:18px;padding:16px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--surface);margin-bottom:18px}
.ring{width:74px;height:74px;flex-shrink:0}
.dr-ring-row .rr-txt b{font-size:22px;font-weight:600;letter-spacing:-.02em}
.dr-ring-row .rr-txt span{display:block;font-size:12px;color:var(--ink-3);margin-top:1px}
.dr-sec-h{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);
  margin:20px 0 10px}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-2);border:1px solid var(--line-2);
  border-radius:var(--radius-sm);overflow:hidden}
.meta-cell{background:var(--surface);padding:11px 13px}
.meta-cell.full{grid-column:1/-1}
.meta-cell .ml{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600}
.meta-cell .mv{font-size:13px;font-weight:500;margin-top:3px;word-break:break-word}
/* Genuinely-unavailable value — a muted dash, never a substituted number. */
.meta-cell .mv.muted{color:var(--ink-3);opacity:.5;font-weight:400}
/* Sub-group label inside the Vendor details profile card. */
.vd-group{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin:15px 0 7px}
.vd-group.first{margin-top:6px}
.elig-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-bottom:6px}
.es-card{border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 10px;text-align:center;position:relative}
.es-card.eligible{border-color:rgba(var(--ok-rgb),.4);background:var(--ok-tint)}
.es-card .es-nm{font-size:11.5px;font-weight:600}
.es-card .es-st{font-size:10.5px;margin-top:4px;font-weight:600}
.es-card.eligible .es-st{color:var(--ok)}.es-card.blocked .es-st{color:var(--ink-3)}
.doc-item{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.doc-item:last-child{border-bottom:none}
.doc-item .di-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.doc-item .di-nm{flex:1;font-size:13px;font-weight:500}
.doc-item .di-nm .di-cat{font-size:10.5px;color:var(--ink-3);font-weight:400;display:block}
.doc-sel{padding:5px 9px;border-radius:7px;font-size:11.5px;font-weight:600;border:1px solid var(--line);
  background:var(--surface)}

@media(max-width:820px){
  :root{--sidebar-w:0px}
  .sidebar{transform:translateX(-100%)}
  .main{margin-left:0}
  .tb-search{display:none}
}

    shipments: raw.Total_Shipments||'0',
    docs:{}
  };
  CATALOG.forEach(function(d){ e.docs[d.id] = ''; });   // no status on record yet
  return e;
}

   localStorage rebuild from the sheet instead of showing stale demo data. */
var STORE_KEY = 'nbfc-platform-v3';
var ENTITIES = [];
function loadEntities(){
  var saved = null;
  try{ saved = JSON.parse(localStorage.getItem(STORE_KEY)); }catch(e){}

/* ── 5. Eligibility engine ─────────────────────────────────────────────── */
function docSatisfied(e, docId){ return e.docs[docId]==='available'; }
function completion(e){
  var total=CATALOG.length, ok=0;
  CATALOG.forEach(function(d){ if(e.docs[d.id]==='available') ok++; });
  return {ok:ok, total:total, pct: Math.round(ok/total*100)};
}
function docCounts(e){
  var c={available:0,pending:0,missing:0,expired:0,na:0,none:0};
  CATALOG.forEach(function(d){
    var s = e.docs[d.id];
    if(s==='available'||s==='pending'||s==='missing'||s==='expired'||s==='na') c[s]++;
    else c.none++;                       // no status on record
  });
  return c;
}
/* Evaluates one entity against one NBFC. Everything here reads nbfc.req — the
   requirement matrix — so editing an NBFC's documents in Settings changes this
   with no code change. The gap is split by what action it needs:
     blocking — must be uploaded: 'missing', 'expired', or no status on record
     pending  — already submitted, awaiting review
     na       — marked not applicable
   `missing` stays the union of all three, so eligibility is unchanged: an entity
   is eligible only when every required document is 'available'. */
function evalNbfc(e, nbfc){
  var missing = [], blocking = [], pending = [], na = [];
  nbfc.req.forEach(function(id){
    if(docSatisfied(e,id)) return;
    missing.push(id);
    var s = e.docs[id];
    if(s === 'pending')   pending.push(id);
    else if(s === 'na')   na.push(id);
    else                  blocking.push(id);      // 'missing' | 'expired' | ''
  });
  var vintageOk = true;
  if(nbfc.vintageYrs){ vintageOk = e.vintage >= nbfc.vintageYrs; }
  return { eligible: missing.length===0 && vintageOk, missing:missing,
           blocking:blocking, pending:pending, na:na, vintageOk:vintageOk };
}
function eligibleNbfcs(e){ return NBFCS.filter(function(n){ return evalNbfc(e,n).eligible; }); }

function viewDashboard(){
  var sellers=ENTITIES.filter(function(e){return e.type==='seller';});

  /* Seller onboarding funnel. Total / First Check / Pending are derived from the
     synced master sheet. Logged In and Credit Limit Assigned have no column in
     that sheet, so they stay blank rather than showing an invented number. */
  var buyers        = ENTITIES.filter(function(e){return e.type==='buyer';});
  var firstCheckSet = sellers.filter(function(e){ return eligibleNbfcs(e).length>0; });
  var pendingSellers= sellers.filter(function(e){ return docCounts(e).pending>0; }).length;

  var kpis=
    kpiHero('Total Sellers', sellers.length, 'Open Marketplace · Completed', '', "kpiGo('all')") +
    kpiHero('Total Buyers', buyers.length, 'Open Marketplace · Completed', '', "go('buyers')") +
    kpiHero('First Check', firstCheckSet.length, 'Pre-screening passed', '', "kpiGo('eligible')") +
    kpiHero('Logged In', NODATA, 'Not in master sheet', '', '') +
    kpiHero('Credit Limit Assigned', NODATA, 'Not in master sheet', '', '') +
    kpiHero('Pending', pendingSellers, 'Documents still awaited', 'amber', "kpiGo('pending')");

  // per-NBFC eligibility
  var neRows=NBFCS.map(function(n){
    var elig=ENTITIES.filter(function(e){return evalNbfc(e,n).eligible;}).length;
    var pct=Math.round(elig/ENTITIES.length*100);
    return '<div class="nbfc-elig">'+
      '<div class="ne-badge" style="background:'+n.nc+'">'+initials(n.name)+'</div>'+
      '<div class="ne-name">'+esc(n.name)+'<span class="mut">'+n.req.length+' docs required</span></div>'+
      '<div class="ne-track"><div class="ne-fill" style="width:'+pct+'%;background:'+n.nc+'"></div></div>'+
      '<div class="ne-count">'+elig+' eligible <span class="mut">/ '+ENTITIES.length+'</span></div>'+
    '</div>';
  }).join('');

  // attention: entities closest to eligibility (1-2 docs from any NBFC)
  var near=[];
  ENTITIES.forEach(function(e){
    if(eligibleNbfcs(e).length>0) return;
    var best=999,bestN=null;
    NBFCS.forEach(function(n){ var m=evalNbfc(e,n); if(m.missing.length<best){best=m.missing.length;bestN=n;} });
    if(best>=1&&best<=2) near.push({e:e,n:bestN,miss:best,missing:evalNbfc(e,bestN).missing});
  });
  near.sort(function(a,b){return a.miss-b.miss;});
  var nearRows=near.slice(0,7).map(function(x){
    return '<div class="ent-row" onclick="openDetail(\''+x.e.id+'\')">'+
      '<div class="ent-ava">'+initials(x.e.name)+'</div>'+
      '<div class="en">'+esc(x.e.name)+'<span class="mut"> · '+esc(x.e.type)+' · '+x.miss+' doc'+(x.miss>1?'s':'')+' from '+esc(x.n.name)+'</span></div>'+
      '<div class="miss-tags">'+x.missing.map(function(id){return '<span class="miss-tag">'+esc(CAT_BY_ID[id].name)+'</span>';}).join('')+'</div>'+
    '</div>';
  }).join('') || '<div style="padding:24px;text-align:center;color:var(--ink-3)">No one within 2 documents of a new NBFC.</div>';

  return '<div class="kpi-row">'+kpis+'</div>'+
    '<div class="grid-2">'+
      '<div class="card"><div class="card-h"><h3>Submission readiness</h3><span class="sub">Vendors within 2 documents of a new NBFC</span></div>'+nearRows+'</div>'+
      '<div class="card"><div class="card-h"><h3>NBFC-wise eligibility</h3></div><div class="nbfc-elig-list">'+neRows+'</div></div>'+
    '</div>';
}

/* ═══════════════ NBFC DASHBOARD PAGE ═══════════════ */
function viewNbfc(n){
  var sellers = ENTITIES.filter(function(e){ return e.type==='seller'; });
  var buyers  = ENTITIES.filter(function(e){ return e.type==='buyer';  });
  var total   = ENTITIES.length;

  /* ── Eligibility ──────────────────────────────────────────────── */
  var eligS = sellers.filter(function(e){ return evalNbfc(e,n).eligible; });
  var eligB = buyers.filter(function(e){  return evalNbfc(e,n).eligible; });

  /* Logged In, Credit Limit Assigned, Credit Utilisation and Transactions have
     no column in the synced master sheet, so they render blank. Wire each to a
     real column before giving it a number. */

  /* ── 7 KPI cards ───────────────────────────────────────────────── */
  var kpis =
    kpiHero('Total Sellers',         sellers.length,            'Open Marketplace · Completed',                     '', "go('sellers')") +
    kpiHero('Total Buyers',          buyers.length,             'Open Marketplace · Completed',                     '', "go('buyers')") +
    kpiHero('Eligible',              eligS.length+eligB.length, eligS.length+' sellers · '+eligB.length+' buyers',  '', "kpiGo('eligible')") +
    kpiHero('Logged In',             NODATA,                    'Not in master sheet',                              '', '') +
    kpiHero('Credit Limit Assigned', NODATA,                    'Not in master sheet',                              '', '') +
    kpiHero('Credit Utilisation',    NODATA,                    'Not in master sheet',                              '', '') +
    kpiHero('Transactions',          NODATA,                    'Not in master sheet',                              '', '');

  /* ── Document requirements table ───────────────────────────────── */
  var docRows = n.req.map(function(docId){
    var cat = CAT_BY_ID[docId]; if(!cat) return '';
    var av=0, pe=0, mi=0, nr=0;
    ENTITIES.forEach(function(e){
      var s = e.docs[docId];
      if(s==='available') av++; else if(s==='pending') pe++;
      else if(s==='missing'||s==='expired') mi++; else nr++;
    });
    var pct = total>0 ? Math.round(av/total*100) : 0;
    /* Nothing tracked for this document yet — say so rather than printing
       three zeroes, which would read as a measured result. */
    var statH = nr===total
      ? '<span class="drq-none">No status on record</span>'
      : '<span class="drq-ok">'+av+'</span>'+
        '<span class="drq-warn">'+pe+'</span>'+
        '<span class="drq-bad">'+mi+'</span>'+
        '<span class="drq-pct">'+pct+'%</span>';
    return '<div class="drq">'+
      '<div class="drq-nm">'+esc(cat.name)+' <span class="drq-cat">'+esc(cat.cat)+'</span></div>'+
      '<div class="drq-stat">'+statH+'</div>'+
    '</div>';
  }).join('');

  /* Legend only earns its space once at least one document has a status. */
  var anyTracked = n.req.some(function(docId){
    return ENTITIES.some(function(e){ return !!e.docs[docId]; });
  });
  var keyH = anyTracked
    ? '<div class="drq-key">'+
        '<span><i style="background:var(--ok)"></i>ready</span>'+
        '<span><i style="background:var(--warn)"></i>pending</span>'+
        '<span><i style="background:var(--bad)"></i>missing</span>'+
      '</div>'
    : '';
  var docCard = '<div class="card" style="margin-bottom:18px">'+
    '<div class="card-h"><h3>'+esc(n.name)+' — Document Requirements</h3>'+
    '<span class="sub">'+n.req.length+' mandatory documents'+(n.vintageYrs?' · '+n.vintageYrs+'-year Recykal vintage required':'')+' — across all '+total+' entities</span>'+
    keyH+'</div>'+
    '<div class="drq-grid">'+docRows+'</div></div>';

  /* ── Entity lists: eligible | blocked ──────────────────────────── */
  var ready=[], blocked=[];
  ENTITIES.forEach(function(e){ var m=evalNbfc(e,n); if(m.eligible) ready.push(e); else blocked.push({e:e,m:m}); });
  blocked.sort(function(a,b){ return a.m.missing.length-b.m.missing.length; });

  var readyH = ready.slice(0,80).map(function(e){
    return '<div class="ent-row" onclick="openDetail(\''+e.id+'\')">'+
      '<div class="ent-ava" style="background:'+n.nc+';color:#fff">'+initials(e.name)+'</div>'+
      '<div class="en">'+esc(e.name)+'<span class="mut"> · '+esc(e.type)+' · '+esc(e.city||e.state)+'</span></div>'+
      '<span class="status-pill sp-ok"><span class="d"></span>Eligible</span></div>';
  }).join('') || emptyRow('No vendors fully eligible yet.');

  /* One row per entity not yet eligible for THIS NBFC. Chips are the documents
     n.req asks for and this entity has not supplied — nothing else is listed. */
  var TAG_CAP = 6;
  var blockedH = blocked.slice(0,120).map(function(b){
    var m = b.m;
    var docName = function(id){ return CAT_BY_ID[id] ? CAT_BY_ID[id].name : id; };

    var chips = '';
    if(!m.vintageOk) chips += '<span class="miss-tag">Vintage &lt; '+n.vintageYrs+'y</span>';
    chips += m.blocking.slice(0,TAG_CAP).map(function(id){
      return '<span class="miss-tag">'+esc(docName(id))+'</span>';
    }).join('');
    if(m.blocking.length > TAG_CAP){
      chips += '<span class="miss-tag nd-more">+'+(m.blocking.length-TAG_CAP)+' more</span>';
    }
    if(!chips) chips = '<span class="nd-meta">No documents outstanding</span>';

    /* "additional pending" = required docs already submitted and under review,
       plus any marked N/A — neither needs a fresh upload. */
    var extra = [];
    if(m.pending.length) extra.push(m.pending.length+' pending review');
    if(m.na.length)      extra.push(m.na.length+' marked N/A');

    return '<div class="nd-row" onclick="openDetail(\''+b.e.id+'\')">'+
      '<div class="ent-ava">'+initials(b.e.name)+'</div>'+
      '<div class="nd-main">'+
        '<div class="nd-top">'+
          '<span class="nd-name">'+esc(b.e.name)+'</span>'+
          '<span class="nd-type">'+(b.e.type==='seller'?'Seller':'Buyer')+'</span>'+
          '<span class="nd-req">'+m.blocking.length+' of '+n.req.length+' required outstanding</span>'+
        '</div>'+
        '<div class="nd-tags">'+chips+'</div>'+
        (extra.length ? '<div class="nd-meta">'+esc(extra.join(' · '))+'</div>' : '')+
      '</div>'+
      '<span class="status-pill sp-bad nd-status"><span class="d"></span>Not eligible</span>'+
    '</div>';
  }).join('') || emptyRow('Every seller and buyer is eligible for '+n.name+'.');

  /* The list is capped for DOM weight — say so, rather than letting the header
     count and the visible rows silently disagree. */
  if(blocked.length > 120){
    blockedH += '<div class="nd-meta" style="padding:12px 18px;border-top:1px solid var(--line-2)">'+
      'Showing first 120 of '+blocked.length+' · use the Sellers and Buyers registers for the full list</div>';
  }

  return '<div class="kpi-row kpi-row-7">'+kpis+'</div>'+
    docCard+
    '<div class="split-cols">'+
      '<div class="card"><div class="card-h"><h3>Eligible</h3><span class="sub">'+ready.length+' entities</span></div>'+readyH+'</div>'+
      '<div class="card"><div class="card-h"><h3>Needs documents</h3>'+
        '<span class="sub">'+blocked.length+' of '+total+' not yet eligible for '+esc(n.name)+
        ' · '+n.req.length+' documents required</span></div>'+blockedH+'</div>'+
    '</div>';
}
function emptyRow(t){ return '<div style="padding:28px;text-align:center;color:var(--ink-3);font-size:13px">'+esc(t)+'</div>'; }
function wireNbfc(n){}

/* ═══════════════ DOCUMENT MATRIX ═══════════════ */
function viewMatrix(){
  var docs=CATALOG;
  var head='<thead><tr><th>Vendor</th>'+docs.map(function(d){return '<th title="'+esc(d.name)+'">'+esc(shortDoc(d.name))+'</th>';}).join('')+'</tr></thead>';
  var body='<tbody>'+ENTITIES.slice(0,120).map(function(e){
    return '<tr><th onclick="openDetail(\''+e.id+'\')" title="'+esc(e.name)+'">'+esc(e.name)+'</th>'+
      docs.map(function(d){ var s=e.docs[d.id];
        var cls=s==='available'?'ok':s==='pending'?'warn':s==='expired'?'exp':s==='na'?'na':'bad';
        return '<td title="'+esc(d.name)+': '+s+'"><span class="mdot '+cls+'"></span></td>';
      }).join('')+'</tr>';
  }).join('')+'</tbody>';
  return '<div class="card"><div class="card-h"><h3>Document Matrix</h3><span class="sub">Canonical documents × vendors (first 120)</span>'+
    '<div class="right" style="font-size:11.5px;color:var(--ink-3);display:flex;gap:12px">'+
      legendDot('ok','Available')+legendDot('warn','Pending')+legendDot('bad','Missing')+legendDot('exp','Expired')+legendDot('na','N/A')+'</div></div>'+
    '<div class="matrix-wrap"><table class="matrix">'+head+body+'</table></div></div>';
}
function legendDot(cls,label){ return '<span style="display:inline-flex;align-items:center;gap:5px"><span class="mdot '+cls+'"></span>'+label+'</span>'; }
function shortDoc(s){ return s.length>26?s.slice(0,24)+'…':s; }

/* ═══════════════ SETTINGS ═══════════════ */
function viewSettings(){
  var nav=[['catalog','Document Catalog','table'],['mapping','NBFC Requirements','grid'],['sync','Data Sync (Meta)','gear'],['users','Users & Access','store']];
  var navH=nav.map(function(x){ return '<div class="set-nav-item'+(state.setPanel===x[0]?' on':'')+'" onclick="setPanel(\''+x[0]+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor">'+ICONS[x[2]]+'</svg>'+esc(x[1])+'</div>'; }).join('');
  return '<div class="settings-layout"><div class="set-nav">'+navH+'</div><div>'+
    panelCatalog()+panelMapping()+panelSync()+panelUsers()+'</div></div>';
}
function panelCatalog(){
  var rows='',lastCat='';
  CATALOG.forEach(function(d){
    if(d.cat!==lastCat){ rows+='<div class="dc-cat">'+esc(d.cat)+'</div>'; lastCat=d.cat; }
    var reqBy=NBFCS.filter(function(n){return n.req.indexOf(d.id)>=0;});
    rows+='<div class="doc-cat-row">'+
      '<div style="flex:1"><div class="dc-name">'+esc(d.name)+(d.expiry?' <span class="miss-tag" style="background:var(--warn-tint);color:var(--warn)">expires</span>':'')+'</div><div class="dc-alias">aka '+esc(d.aliases)+'</div></div>'+
      '<div style="display:flex;gap:3px">'+reqBy.map(function(n){return '<div class="ec" style="width:20px;height:20px;background:'+n.nc+'" title="Required by '+esc(n.name)+'">'+initials(n.name)[0]+'</div>';}).join('')+'</div>'+
    '</div>';
  });
  return '<div class="set-panel'+(state.setPanel==='catalog'?' on':'')+'"><div class="card"><div class="card-h"><h3>Document Catalog</h3><span class="sub">'+CATALOG.length+' canonical documents — the single taxonomy every NBFC maps onto</span><div class="right"><button class="btn btn-sm btn-primary">+ Add document</button></div></div>'+rows+'</div></div>';
}
function panelMapping(){
  var tabs=NBFCS.map(function(n){ return '<button class="map-tab'+(state.mapNbfc===n.id?' on':'')+'" style="'+(state.mapNbfc===n.id?'background:'+n.nc+';border-color:'+n.nc:'')+'" onclick="setMapNbfc(\''+n.id+'\')">'+esc(n.name)+'</button>'; }).join('');
  var n=NBFC_BY_ID[state.mapNbfc];
  var lastCat='',items='';
  CATALOG.forEach(function(d){
    if(d.cat!==lastCat){ items+='<div class="dc-cat">'+esc(d.cat)+'</div>'; lastCat=d.cat; }
    var on=n.req.indexOf(d.id)>=0;
    items+='<div class="reqmap-item'+(on?' req':'')+'" onclick="toggleReq(\''+d.id+'\')"><div class="rm-check">'+(on?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>':'')+'</div><div class="rm-name">'+esc(d.name)+'</div><div class="rm-cat">'+esc(d.cat)+'</div></div>';
  });
  return '<div class="set-panel'+(state.setPanel==='mapping'?' on':'')+'"><div class="card"><div class="card-h"><h3>NBFC Requirements</h3><span class="sub">Map each NBFC\'s required documents onto the catalog — this drives the eligibility engine</span></div>'+
    '<div class="map-nbfc-tabs">'+tabs+'</div>'+
    '<div style="padding:6px 0 10px">'+items+'</div>'+
    '<div style="padding:12px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3)">'+n.req.length+' documents required by '+esc(n.name)+(n.vintageYrs?' · plus '+n.vintageYrs+'-year Recykal vintage':'')+'</div>'+
  '</div></div>';
}
function panelSync(){
  return '<div class="set-panel'+(state.setPanel==='sync'?' on':'')+'"><div class="card"><div class="card-h"><h3>Data Sync — Meta</h3><span class="sub">Seller &amp; buyer master data auto-fetched from Meta into the Google Sheet</span><div class="right"><button class="btn btn-sm btn-primary" onclick="fakeSync()">Sync now</button></div></div>'+
    '<div class="sync-stat">'+
      '<div class="sync-box"><div class="sl">Connection</div><div class="sv" style="color:var(--ok)">● Connected</div></div>'+
      '<div class="sync-box"><div class="sl">Last sync</div><div class="sv">2 min ago</div></div>'+
      '<div class="sync-box"><div class="sl">Frequency</div><div class="sv">Every 30 min</div></div>'+
      '<div class="sync-box"><div class="sl">Records</div><div class="sv tnum">'+ENTITIES.length+'</div></div>'+
    '</div>'+
    '<div style="padding:0 18px 18px"><div class="login-note" style="margin:0">Meta credentials are stored in Apps Script <span class="mono">PropertiesService</span> (never in the sheet). A time-driven trigger runs <span class="mono">fetchFromMeta()</span> → transforms → writes to the Seller / Buyer tabs, preserving structure. Manual <b>Sync now</b> forces an immediate refresh.</div></div>'+
  '</div></div>';
}
function panelUsers(){
  var users=[['Management','mgmt@recykal.com','Full visibility, no edits','#8460D4'],['Operations','ops@recykal.com','Edit documents & statuses','#005DFF'],['Credit Team','credit@recykal.com','Submit folders to NBFCs','#049769']];
  var rows=users.map(function(u){ return '<div class="user-row"><div class="sb-ava" style="background:'+u[3]+'">'+initials(u[0])+'</div><div style="flex:1"><div style="font-weight:600;font-size:13px">'+esc(u[0])+'</div><div class="cell-sub">'+esc(u[1])+'</div></div><div style="font-size:12px;color:var(--ink-3)">'+esc(u[2])+'</div><div class="toggle on"></div></div>'; }).join('');
  return '<div class="set-panel'+(state.setPanel==='users'?' on':'')+'"><div class="card"><div class="card-h"><h3>Users &amp; Access</h3><span class="sub">Role-based access, gated by Google Workspace SSO</span><div class="right"><button class="btn btn-sm btn-primary">+ Invite</button></div></div>'+rows+'</div></div>';
}
function wireSettings(){}
function setPanel(p){ state.setPanel=p; render(); }
function setMapNbfc(id){ state.mapNbfc=id; render(); }
function toggleReq(docId){ var n=NBFC_BY_ID[state.mapNbfc]; var i=n.req.indexOf(docId); if(i>=0)n.req.splice(i,1); else n.req.push(docId); render(); }
function fakeSync(){ $('syncTxt').textContent='Live · synced just now'; toast('Synced '+ENTITIES.length+' records from Meta'); }

/* ═══════════════ DETAIL DRAWER ═══════════════ */
function openDetail(id){
  var e=ENTITIES.filter(function(x){return x.id===id;})[0]; if(!e) return;
  var c=completion(e), cnt=docCounts(e);
  var eligs=eligibleNbfcs(e);

  var esCards=NBFCS.map(function(n){ var m=evalNbfc(e,n);
    return '<div class="es-card '+(m.eligible?'eligible':'blocked')+'"><div class="es-nm">'+esc(n.name)+'</div><div class="es-st">'+(m.eligible?'Eligible':(m.missing.length+(m.vintageOk?'':'+v')+' missing'))+'</div></div>';
  }).join('');

  /* Vendor details — a profile card fed from the Meta-synced master sheet.
     Every value is read from the entity; a field with no data in the sheet shows
     a muted dash rather than a placeholder or invented value. Credit Limit,
     Credit Utilisation, and the sync/update timestamps have no column in the
     current sheet, so they stay blank until one is added. */
  var typeLabel = e.type==='seller' ? 'Seller' : 'Buyer';
  var eligNames = eligs.length ? eligs.map(function(x){ return x.name; }).join(', ') : 'None';
  var onboard   = e.status ? e.status.charAt(0).toUpperCase()+e.status.slice(1).toLowerCase() : '';

  function vdCell(label, value, opts){
    opts = opts || {};
    var empty = (value == null || String(value).trim() === '');
    var v     = empty ? '—' : String(value);
    var cls   = 'mv' + (opts.mono && !empty ? ' mono' : '') + (empty ? ' muted' : '');
    var style = (opts.mono && !empty) ? ' style="font-size:12px"' : '';
    return '<div class="meta-cell'+(opts.full?' full':'')+'"><div class="ml">'+esc(label)+'</div>'+
           '<div class="'+cls+'"'+style+'>'+esc(v)+'</div></div>';
  }
  function vdGroup(title, cells, first){
    return '<div class="vd-group'+(first?' first':'')+'">'+esc(title)+'</div>'+
           '<div class="meta-grid">'+cells.join('')+'</div>';
  }

  var metaH =
    vdGroup('Business', [
      vdCell('GSTIN', e.gst, {mono:true}),
      vdCell(typeLabel+' Business Name', e.name, {full:true}),
      vdCell('Category', e.category),
      vdCell('Business Vertical', 'Open Marketplace'),
      vdCell('Region', e.region),
      vdCell('State', e.state),
    ], true) +
    vdGroup('Classification & onboarding', [
      vdCell('Entity Type', e.entityType),
      vdCell(typeLabel+' Type', ''),          // Baler/Trader classification not in this sheet
      vdCell('Onboarding Status', onboard),
      vdCell('Vintage with Recykal', e.vintageRaw),
    ]) +
    vdGroup('Credit & activity', [
      vdCell('Credit Limit Assigned', ''),    // not in master sheet yet
      vdCell('Credit Utilisation', ''),       // not in master sheet yet
      vdCell('Total Transactions', ''),       // no transactions column in master sheet
      vdCell('Eligible NBFC(s)', eligNames, {full:true}),
    ]) +
    vdGroup('Relationship & contact', [
      vdCell('Relationship Manager / Account Owner', e.rh, {full:true}),
      vdCell('Primary Contact Person', e.poc),
      vdCell('Contact Number', e.mobile),
      vdCell('Email Address', e.email, {mono:true, full:true}),
    ]) +
    vdGroup('Sync', [
      vdCell('Last Document Updated On', ''), // no timestamp column in current sheet
      vdCell('Last Synced On', ''),
    ]);

  var lastCat='',docsH='';
  CATALOG.forEach(function(d){
    if(d.cat!==lastCat){ docsH+='<div class="dr-sec-h" style="margin:16px 0 8px">'+esc(d.cat)+'</div>'; lastCat=d.cat; }
    var s=e.docs[d.id];
    var meta2=statusMeta(s);
    docsH+='<div class="doc-item"><div class="di-ic" style="background:'+meta2.tint+';color:'+meta2.color+'">'+meta2.icon+'</div>'+
      '<div class="di-nm">'+esc(d.name)+'<span class="di-cat">'+esc(d.aliases.split('·')[0].trim())+'</span></div>'+
      '<select class="doc-sel" style="color:'+meta2.color+'" onchange="setDoc(\''+e.id+'\',\''+d.id+'\',this.value)">'+
        STATUS.map(function(st){return '<option value="'+st+'"'+(st===s?' selected':'')+'>'+statusMeta(st).label+'</option>';}).join('')+
      '</select></div>';
  });

  var ncColor = eligs.length?eligs[0].nc:'#8D8F82';
  $('drawer').style.setProperty('--nc', ncColor);
  $('drawer').style.setProperty('--nc-rgb', hexRgb(ncColor));
  $('drawer').innerHTML=
    '<div class="dr-head"><div class="dr-ava">'+initials(e.name)+'</div>'+
      '<div style="flex:1;min-width:0"><h2>'+esc(e.name)+'</h2><div class="dh-sub"><span class="gst">'+esc(e.gst)+'</span> · '+esc(e.type)+' · '+esc(e.city||e.state)+'</div></div>'+
      '<button class="dr-x" onclick="closeDrawer()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>'+
    '<div class="dr-body">'+
      '<div class="dr-ring-row">'+ring(c.pct,ncColor)+'<div class="rr-txt"><b class="tnum">'+c.ok+' of '+c.total+'</b><span>documents available · '+c.pct+'% complete</span>'+
        '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">'+
          pillMini('sp-ok',cnt.available+' available')+pillMini('sp-warn',cnt.pending+' pending')+pillMini('sp-bad',cnt.missing+' missing')+(cnt.expired?pillMini('sp-bad',cnt.expired+' expired'):'')+'</div>'+
      '</div></div>'+
      '<div class="dr-sec-h">NBFC eligibility</div><div class="elig-summary">'+esCards+'</div>'+
      '<div class="dr-sec-h">Vendor details</div>'+metaH+
      '<div class="dr-sec-h" style="margin-top:22px">Documents</div>'+docsH+
    '</div>';
  $('scrim').classList.add('on'); $('drawer').classList.add('on');
}
function pillMini(cls,t){ return '<span class="status-pill '+cls+'"><span class="d"></span>'+esc(t)+'</span>'; }
function statusMeta(s){
  return ({
    available:{label:'Available',color:'var(--ok)',tint:'var(--ok-tint)',icon:iconChk()},
    pending:{label:'Pending',color:'var(--warn)',tint:'var(--warn-tint)',icon:iconClock()},
    missing:{label:'Missing',color:'var(--bad)',tint:'var(--bad-tint)',icon:iconX()},
    expired:{label:'Expired',color:'var(--bad)',tint:'var(--bad-tint)',icon:iconAlert()},
    na:{label:'N/A',color:'var(--na)',tint:'var(--na-tint)',icon:iconDash()},
    '':{label:'Not on record',color:'var(--na)',tint:'var(--na-tint)',icon:iconDash()}
  })[s||''];
}
function iconChk(){return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg>';}
function iconClock(){return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';}
function iconX(){return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg>';}
function iconAlert(){return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';}
function iconDash(){return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14"/></svg>';}
function ring(pct,color){
  var r=30,circ=2*Math.PI*r,off=circ*(1-pct/100);
  return '<svg class="ring" viewBox="0 0 74 74"><circle cx="37" cy="37" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="7"/>'+
    '<circle cx="37" cy="37" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'" transform="rotate(-90 37 37)"/>'+
    '<text x="37" y="37" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="var(--ink)" font-family="Poppins">'+pct+'%</text></svg>';
}
function setDoc(entId,docId,val){
  var e=ENTITIES.filter(function(x){return x.id===entId;})[0]; if(!e) return;
  e.docs[docId]=val; persist(); openDetail(entId);
}
function closeDrawer(){ $('scrim').classList.remove('on'); $('drawer').classList.remove('on'); }

/* ═══════════════ TOAST ═══════════════ */
function toast(msg){
  var t=document.createElement('div'); t.textContent=msg;
  t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:13px;font-weight:500;z-index:90;opacity:0;transition:.25s;box-shadow:var(--shadow-lg)';
  document.body.appendChild(t);
  requestAnimationFrame(function(){ t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(0)'; });
  setTimeout(function(){ t.style.opacity='0'; setTimeout(function(){t.remove();},300); },2200);
}

/* ═══════════════ LOGIN / THEME / BOOT ═══════════════ */
function doLogin(){
  var role='Management';
  var on=document.querySelector('.role-opt.on'); if(on) role=on.getAttribute('data-role');
  state.role=role; state.email=$('li-email').value||'ops@recykal.com';
  state.user = role==='Management'?'Mgmt User':role==='Operations'?'Ops User':'Credit User';
  $('sbName').textContent=state.user; $('sbRole').textContent=role;
  $('sbAva').textContent=initials(state.user);
  $('login').style.display='none'; $('app').style.display='block';
  go('dashboard');
}
function logout(){ $('app').style.display='none'; $('login').style.display='grid'; }
function toggleTheme(){
  state.theme = state.theme==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',state.theme);
}
document.addEventListener('DOMContentLoaded',function(){
  loadEntities();
  Array.prototype.forEach.call(document.querySelectorAll('.role-opt'),function(o){
    o.onclick=function(){ document.querySelectorAll('.role-opt').forEach(function(x){x.classList.remove('on');}); o.classList.add('on'); };
  });
  $('globalSearch') && ($('globalSearch').oninput=function(e){
    var v=e.target.value; if(!v) return;
    if(state.route!=='sellers'&&state.route!=='buyers'){ state.sellerQ=v; go('sellers'); setTimeout(function(){var q=$('regQ'); if(q){q.value=v;q.focus();}},50); }
  });
  document.addEventListener('keydown',function(ev){ if(ev.key==='Escape') closeDrawer(); });
});

</script>
