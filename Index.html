<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ═══════════════════════════════════════════════════════════════════════
     Recykal · NBFC Document Tracker — Apple system design language
     Read-only visibility dashboard · Three NBFC tabs (Billmart / Capital XB /
     StrideOne) · Four clickable hero cards per tab with tabular drill-downs.
     SF Pro / Inter · Cool neutrals · Segmented controls · Frosted glass ·
     Borderless floating cards · Black hero band · Per-NBFC accent theming.
   ═══════════════════════════════════════════════════════════════════════ */

  /* ── Design tokens ─────────────────────────────────────────────────── */
  :root{
    /* Status semantics — meaning, not brand (stay constant across NBFCs) */
    --rk-green:#00A651;
    --rk-green-deep:#008843;
    --rk-green-ink:#036B36;
    --rk-green-tint:#E4F6EC;
    --rk-green-tint-2:#F1FAF5;
    --amber:#F59E0B;
    --amber-tint:#FFF6E0;
    --amber-ink:#7A4D06;
    --gray-dot:#C7C7CC;
    /* Follow-up remark accent — indigo "info", distinct from status green/amber */
    --remark-ink:#4338CA;
    --remark-tint:rgba(79,70,229,.07);
    --remark-bd:rgba(79,70,229,.22);

    /* NBFC brand accent — overwritten live by applyNbfcTheme(). Default = Billmart. */
    --nc:#E85D04;
    --nc-rgb:232,93,4;
    --nc-ring:#FF8C4A;

    /* Typography — SF Pro on Apple hardware, Inter elsewhere */
    --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Helvetica Neue',Arial,sans-serif;
    /* Surfaces — Apple neutral palette */
    --surface:#F5F5F7;
    --card:#FFFFFF;
    --ink:#1D1D1F;
    --ink-2:#6E6E73;
    --ink-3:#86868B;
    --line:rgba(18,20,28,.08);
    --line-2:rgba(18,20,28,.045);
    --fill:rgba(120,122,134,.09);
    --fill-2:rgba(120,122,134,.17);
    /* Shadows — soft, tight, premium depth */
    --shadow-sm:0 1px 2px rgba(18,20,28,.04),0 2px 6px rgba(18,20,28,.05);
    --shadow-md:0 4px 10px rgba(18,20,28,.06),0 12px 28px rgba(18,20,28,.09);
    --shadow-lg:0 14px 32px rgba(18,20,28,.12),0 36px 74px rgba(18,20,28,.17);
    /* Geometry */
    --radius:16px;
    /* Motion */
    --ease:cubic-bezier(.4,0,.2,1);
    --ease-out:cubic-bezier(0,0,.2,1);
    --drawer-open:cubic-bezier(.32,.72,0,1);
    --drawer-close:cubic-bezier(.4,0,1,1);
  }

  /* ── Dark mode tokens ───────────────────────────────────────────────── */
  @media (prefers-color-scheme:dark){
    :root{
      --surface:#000000;
      --card:#1D1D1F;
      --ink:#F5F5F7;
      --ink-2:#A1A1A6;
      --ink-3:#86868B;
      --line:rgba(255,255,255,.12);
      --line-2:rgba(255,255,255,.06);
      --fill:rgba(120,120,128,.24);
      --fill-2:rgba(120,120,128,.36);
      --gray-dot:#48484A;
      --rk-green-ink:#30D158;
      --amber-ink:#FFD60A;
      --remark-ink:#A5B4FC;
      --remark-tint:rgba(129,140,248,.13);
      --remark-bd:rgba(129,140,248,.30);
      --shadow-sm:0 1px 2px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.42);
      --shadow-md:0 6px 16px rgba(0,0,0,.5),0 16px 40px rgba(0,0,0,.55);
      --shadow-lg:0 18px 44px rgba(0,0,0,.62),0 44px 92px rgba(0,0,0,.72);
    }
  }
  :root[data-theme="dark"]{
    --surface:#000000;
    --card:#1D1D1F;
    --ink:#F5F5F7;
    --ink-2:#A1A1A6;
    --ink-3:#86868B;
    --line:rgba(255,255,255,.12);
    --line-2:rgba(255,255,255,.06);
    --fill:rgba(120,120,128,.24);
    --fill-2:rgba(120,120,128,.36);
    --gray-dot:#48484A;
    --rk-green-ink:#30D158;
    --amber-ink:#FFD60A;
    --remark-ink:#A5B4FC;
    --remark-tint:rgba(129,140,248,.13);
    --remark-bd:rgba(129,140,248,.30);
    --shadow-sm:0 1px 2px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.42);
    --shadow-md:0 6px 16px rgba(0,0,0,.5),0 16px 40px rgba(0,0,0,.55);
    --shadow-lg:0 18px 44px rgba(0,0,0,.62),0 44px 92px rgba(0,0,0,.72);
  }
  :root[data-theme="light"]{
    --surface:#F5F5F7;
    --card:#FFFFFF;
    --ink:#1D1D1F;
    --ink-2:#6E6E73;
    --ink-3:#86868B;
    --line:rgba(18,20,28,.08);
    --line-2:rgba(18,20,28,.045);
    --fill:rgba(120,122,134,.09);
    --fill-2:rgba(120,122,134,.17);
    --gray-dot:#C7C7CC;
    --rk-green-ink:#036B36;
    --amber-ink:#7A4D06;
    --remark-ink:#4338CA;
    --remark-tint:rgba(79,70,229,.07);
    --remark-bd:rgba(79,70,229,.22);
    --shadow-sm:0 1px 2px rgba(18,20,28,.04),0 2px 6px rgba(18,20,28,.05);
    --shadow-md:0 4px 10px rgba(18,20,28,.06),0 12px 28px rgba(18,20,28,.09);
    --shadow-lg:0 14px 32px rgba(18,20,28,.12),0 36px 74px rgba(18,20,28,.17);
  }

  /* ── Reset ─────────────────────────────────────────────────────────── */
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;height:100dvh}
  body{
    font-family:var(--font);color:var(--ink);
    height:100dvh;display:flex;flex-direction:column;overflow:hidden;
    background:
      radial-gradient(1200px 540px at 50% -12%,#FFFFFF,rgba(255,255,255,0) 72%),
      linear-gradient(180deg,#FAFBFD 0%,var(--surface) 380px),
      var(--surface);
    background-attachment:fixed;background-repeat:no-repeat;
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    font-feature-settings:'tnum' 1;
    letter-spacing:-.012em;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  ::-webkit-scrollbar{width:7px;height:7px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{
    background:rgba(0,0,0,.16);border-radius:99px;
    border:1.5px solid transparent;background-clip:content-box;
  }
  ::-webkit-scrollbar-thumb:hover{background-color:rgba(0,0,0,.28)}
  ::-webkit-scrollbar-corner{background:transparent}
  input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  ::selection{background:rgba(var(--nc-rgb),.22)}

  /* ── Topbar — frosted glass toolbar ─────────────────────────────────── */
  .topbar{
    position:sticky;top:0;z-index:40;display:flex;align-items:center;
    height:58px;padding:0 22px;gap:0;
    background:rgba(252,252,254,.88);
    backdrop-filter:blur(40px) saturate(240%);
    -webkit-backdrop-filter:blur(40px) saturate(240%);
    border-bottom:1px solid rgba(0,0,0,.055);
    box-shadow:0 1px 0 rgba(255,255,255,.6),0 1px 8px rgba(0,0,0,.04);
  }
  .topbar-brand{display:flex;align-items:center;gap:10px;padding-right:16px;flex:none}
  .brand-logo{height:30px;width:auto;display:block;flex:none;background:#fff;border-radius:8px;padding:5px 10px;box-sizing:content-box;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .brand-rule{width:1px;height:22px;background:var(--line);flex:none;margin:0 2px}
  .brand-sub{font-size:13px;color:#111;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
  .topbar-spacer{flex:1;min-width:8px}
  .topbar-div{width:1px;height:16px;background:var(--line);flex:none;margin:0 10px}
  .sync{font-size:11.5px;color:var(--ink-3);line-height:1.5;white-space:nowrap}
  .sync b{color:var(--ink-2);font-weight:600}

  /* ── NBFC switcher — segmented control in the topbar ────────────────── */
  nav#nbfcNav{
    display:flex;align-items:center;gap:2px;
    background:var(--fill);border-radius:11px;padding:3px;
    margin-left:2px;flex:none;
  }
  .nbfc-pill{
    display:flex;align-items:center;gap:8px;height:32px;padding:0 15px;
    font-size:13px;font-weight:500;color:var(--ink-2);
    border-radius:8px;transition:all .18s var(--ease);white-space:nowrap;letter-spacing:-.01em;
  }
  .nbfc-pill:hover{color:var(--ink)}
  .nbfc-pill.on{color:#fff;font-weight:600}
  .nbfc-dot{width:8px;height:8px;border-radius:50%;flex:none;transition:box-shadow .18s}
  .nbfc-pill.on .nbfc-dot{background:#fff !important;box-shadow:0 0 0 2px rgba(255,255,255,.35)}

  /* ── Buttons ────────────────────────────────────────────────────────── */
  .icon-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:34px;height:34px;padding:0;border-radius:50%;border:none;
    background:var(--fill);color:var(--ink);flex:none;
    transition:all .18s var(--ease);text-decoration:none;
  }
  .icon-btn:hover{background:var(--fill-2)}
  .icon-btn:active{transform:scale(.94)}
  .icon-btn svg{width:15px;height:15px}
  .btn-primary{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    height:36px;padding:0 18px;
    border-radius:980px;background:var(--nc);color:#fff;
    font-size:13px;font-weight:600;letter-spacing:-.01em;text-decoration:none;
    box-shadow:0 1px 3px rgba(var(--nc-rgb),.28);
    transition:all .2s var(--ease);white-space:nowrap;
  }
  .btn-primary:hover{filter:brightness(.94);box-shadow:0 3px 10px rgba(var(--nc-rgb),.34)}
  .btn-primary:active{transform:scale(.97)}
  .btn-primary svg{width:13.5px;height:13.5px}
  .btn-ghost{
    height:36px;padding:0 17px;border-radius:980px;border:none;
    background:var(--fill);font-size:13px;font-weight:500;
    color:var(--ink);transition:all .18s var(--ease);letter-spacing:-.01em;
  }
  .btn-ghost:hover{background:var(--fill-2)}
  .btn-ghost:active{transform:scale(.97)}

  /* ── Animations ─────────────────────────────────────────────────────── */
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes fadeSlideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pendPulse{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.25)}55%{box-shadow:0 0 0 4px rgba(245,158,11,0)}}
  @keyframes rot{to{transform:rotate(360deg)}}
  @keyframes shim{to{background-position:-200% 0}}
  @keyframes heroShimmer{
    0%{transform:translateX(-120%) skewX(-18deg);opacity:0}
    5%{opacity:1}
    92%{opacity:.7}
    100%{transform:translateX(240%) skewX(-18deg);opacity:0}
  }

  /* ── Shell / content wrapper ────────────────────────────────────────── */
  .shell{max-width:1320px;margin:0 auto;padding:14px 24px 16px;flex:1;min-height:0;overflow-y:auto;width:100%;box-sizing:border-box}
  .view{display:none}
  .view.on{display:block;animation:fadeUp .4s var(--ease-out) both}

  /* ── Cards — borderless, floating ───────────────────────────────────── */
  .card{
    background:var(--card);border:none;
    border-radius:var(--radius);
    box-shadow:0 0 0 1px var(--line),var(--shadow-sm);
    transition:box-shadow .25s var(--ease),transform .25s var(--ease);
  }
  .card:hover{box-shadow:0 0 0 1px var(--line),var(--shadow-md)}
  .card-h{
    display:flex;align-items:baseline;justify-content:space-between;gap:6px 14px;
    padding:14px 18px 0;flex-wrap:wrap;
  }
  /* Apple two-tone headline — bold statement + muted continuation, same size */
  .card-h h3{font-size:17px;font-weight:600;letter-spacing:-.022em;color:var(--ink);line-height:1.3}
  .card-h h3 .sub{color:var(--ink-3);font-weight:600}
  .card-h h3 .sub::before{content:' '}
  .card-h .hint{font-size:12px;color:var(--ink-3);font-weight:400}

  /* ── NBFC hero band — identity strip ────────────────────────────────── */
  .nbfc-hero{
    display:flex;align-items:center;justify-content:space-between;gap:20px;
    background:linear-gradient(165deg,#232327 0%,#161618 46%,#0A0A0C 100%);
    border-radius:16px;padding:13px 24px;position:relative;overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.18),0 16px 44px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.08);
    color:#fff;
  }
  .nbfc-hero::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(820px 420px at 2% -26%,rgba(var(--nc-rgb),.26),transparent 60%),
      radial-gradient(620px 340px at 100% 128%,rgba(var(--nc-rgb),.15),transparent 58%);
  }
  .nbfc-hero::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(130% 150% at 100% 0%,rgba(255,255,255,.06),transparent 46%);
  }
  .nh-info{position:relative;min-width:0}
  .nh-eyebrow{
    display:flex;align-items:center;gap:8px;
    font-size:11px;font-weight:600;color:rgba(255,255,255,.62);
    letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;
  }
  .nh-eyebrow i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--nc-ring);box-shadow:0 0 14px rgba(var(--nc-rgb),.85),0 0 6px rgba(var(--nc-rgb),.6)}
  .nh-name{font-size:25px;font-weight:700;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
  .nh-sub{font-size:12px;color:rgba(255,255,255,.52);margin-top:5px;letter-spacing:-.005em}

  /* ── KPI hero cards — clickable ─────────────────────────────────────── */
  .kpis{display:flex;flex-wrap:nowrap;gap:10px;margin-top:10px;overflow-x:auto}
  .kpis.kpis-6{flex-wrap:nowrap}
  .kpi{
    text-align:left;background:var(--card);border-radius:var(--radius);
    box-shadow:0 0 0 1px var(--line),var(--shadow-sm);
    padding:15px 16px 14px;display:flex;flex-direction:column;
    cursor:pointer;position:relative;overflow:hidden;
    flex:1 1 0;min-width:110px;
    transition:transform .22s var(--ease),box-shadow .28s var(--ease);
    animation:fadeUp .5s var(--ease-out) both;
  }
  /* Horizontal top accent bar — always subtly visible, full on hover */
  .kpi::before{
    content:'';position:absolute;left:0;right:0;top:0;height:2.5px;
    background:var(--kpi-accent,var(--fill-2));
    opacity:.32;transition:opacity .28s var(--ease);
  }
  .kpi:hover{transform:translateY(-3px)}
  .kpi:hover::before{opacity:1}
  .kpi:active{transform:translateY(-1px)}
  /* Tone-specific glow on hover — count(neutral) · pipeline(brand) · status */
  .kpi-total:hover,.kpi-buyers:hover,.kpi-phase0:hover{box-shadow:0 0 0 .5px var(--line),var(--shadow-md)}
  .kpi-eligible:hover,.kpi-qualified:hover,.kpi-creditlimit:hover{box-shadow:0 0 0 .5px rgba(var(--nc-rgb),.22),var(--shadow-md),0 8px 32px rgba(var(--nc-rgb),.14)}
  .kpi-pending:hover{box-shadow:0 0 0 .5px rgba(245,158,11,.22),var(--shadow-md),0 8px 32px rgba(245,158,11,.12)}
  .kpi-completed:hover{box-shadow:0 0 0 .5px rgba(0,166,81,.22),var(--shadow-md),0 8px 32px rgba(0,166,81,.12)}
  .kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
  .kpi-ico{
    width:34px;height:34px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;flex:none;
    transition:transform .2s var(--ease);
  }
  .kpi:hover .kpi-ico{transform:scale(1.06)}
  .kpi-ico svg{width:17px;height:17px}
  .kpi-chev{color:var(--ink-3);opacity:.55;transition:transform .2s var(--ease),opacity .2s;flex:none}
  .kpi-chev svg{width:16px;height:16px}
  .kpi:hover .kpi-chev{opacity:1;transform:translateX(3px)}
  .kpi-num{font-size:31px;font-weight:700;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
  .kpi-label{font-size:11.5px;font-weight:700;margin-top:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
  .kpi-sub{font-size:11.5px;color:var(--ink-3);margin-top:4px;letter-spacing:-.005em;line-height:1.35}
  /* ── KPI tone system — one coherent palette ──────────────────────────
     Count (total/buyers) = authoritative neutral · Financing pipeline
     (eligible/qualified/credit) = brand accent · Status (completed=green,
     pending=amber). Numbers stay ink except where colour carries meaning. */
  /* count tier — neutral, brand-tinted accent bar */
  .kpi-total,.kpi-buyers,.kpi-phase0{--kpi-accent:var(--nc)}
  .kpi-total .kpi-ico,.kpi-buyers .kpi-ico,.kpi-phase0 .kpi-ico{background:var(--fill);color:var(--ink-2)}
  /* pipeline tier — brand accent */
  .kpi-eligible,.kpi-qualified,.kpi-creditlimit{--kpi-accent:var(--nc)}
  .kpi-eligible .kpi-ico,.kpi-qualified .kpi-ico,.kpi-creditlimit .kpi-ico{background:rgba(var(--nc-rgb),.11);color:var(--nc)}
  /* status tier — pending (amber) */
  .kpi-pending{--kpi-accent:var(--amber)}
  .kpi-pending .kpi-ico{background:var(--amber-tint);color:var(--amber-ink)}
  .kpi-pending .kpi-num{color:var(--amber-ink)}
  /* status tier — completed (green) */
  .kpi-completed{--kpi-accent:var(--rk-green)}
  .kpi-completed .kpi-ico{background:var(--rk-green-tint);color:var(--rk-green-ink)}
  .kpi-completed .kpi-num{color:var(--rk-green-ink)}

  /* ── Secondary view switcher ────────────────────────────────────────── */
  .subnav{display:inline-flex;background:var(--fill);border-radius:11px;padding:3px;gap:2px;margin:10px 0 2px}
  .subnav button{
    display:flex;align-items:center;gap:7px;height:34px;padding:0 15px;
    font-size:13px;font-weight:500;color:var(--ink-2);border-radius:8px;
    transition:all .18s var(--ease);white-space:nowrap;letter-spacing:-.01em;
  }
  .subnav button svg{width:14px;height:14px;opacity:.55;transition:opacity .18s;flex:none}
  .subnav button:hover{color:var(--ink)}
  .subnav button.on{
    color:var(--ink);font-weight:600;background:var(--card);
    box-shadow:0 0 0 .5px rgba(0,0,0,.04),0 1px 1px rgba(0,0,0,.06),0 2px 6px rgba(0,0,0,.08);
  }
  .subnav button.on svg{opacity:1;color:var(--nc)}

  /* ── Overview layout ────────────────────────────────────────────────── */
  .ov-grid{display:grid;grid-template-columns:1.06fr .94fr;gap:10px;align-items:start;margin-top:10px}
  .stack{display:grid;gap:10px}

  /* ── Document bars ──────────────────────────────────────────────────── */
  .docbars{padding:8px 18px 18px;display:grid;grid-template-columns:1fr;row-gap:2px}
  .docbar{
    display:grid;grid-template-columns:minmax(120px,.9fr) 1.5fr 56px;
    gap:12px;align-items:center;padding:8px 9px;border-radius:9px;
    transition:background .15s;
    animation:fadeSlideUp .3s var(--ease) both;
    animation-delay:calc(var(--db-i,0)*30ms);
  }
  .docbar:hover{background:var(--fill)}
  .docbar .name{font-size:12px;font-weight:500;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
  .docbar.has-pen .name{color:var(--ink);font-weight:600}
  .strack{height:6px;border-radius:3px;overflow:hidden;display:flex;background:var(--fill)}
  .strack .s-rec{background:var(--rk-green);height:100%;border-radius:3px 0 0 3px;min-width:0;transition:flex .6s var(--ease-out)}
  .strack .s-pen{background:var(--amber);opacity:.9;height:100%;min-width:0;transition:flex .6s var(--ease-out) .05s}
  .dstat{font-size:11px;font-weight:600;text-align:right;white-space:nowrap;line-height:1.3;font-variant-numeric:tabular-nums}
  .dstat.pen{color:var(--amber-ink)}
  .dstat.ok{color:var(--rk-green-ink)}
  .dstat.muted{color:var(--ink-3);font-weight:400}
  .legend{display:flex;gap:14px;align-items:center;padding:0 18px 8px;font-size:11px;color:var(--ink-3);font-weight:400}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:-1px}

  /* ── Attention cards ────────────────────────────────────────────────── */
  .attn{
    padding:10px 14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;
    max-height:172px;overflow-y:auto;
    -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 22px),transparent);
    mask-image:linear-gradient(to bottom,#000 calc(100% - 22px),transparent);
  }
  .attn-card{
    background:var(--surface);border:none;border-radius:16px;
    padding:14px 16px;cursor:pointer;
    transition:all .22s var(--ease);
    animation:fadeSlideUp .3s var(--ease) both;
    box-shadow:0 0 0 1px var(--line-2);
  }
  .attn-card:hover{
    background:rgba(var(--nc-rgb),.06);
    transform:translateY(-2px);box-shadow:var(--shadow-md),0 0 0 .5px rgba(var(--nc-rgb),.16);
  }
  .attn-card:active{transform:translateY(0)}
  .attn-head{display:flex;align-items:center;gap:10px}
  .avatar{
    width:34px;height:34px;border-radius:50%;
    background:rgba(var(--nc-rgb),.12);color:var(--nc);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:11px;flex:none;letter-spacing:.01em;
  }
  .attn-info{flex:1;min-width:0}
  .attn-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;letter-spacing:-.015em}
  .attn-type{font-size:12px;color:var(--ink-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
  .attn-tv-txt{color:var(--nc);font-weight:600}
  .attn-cnt{
    flex:none;font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:980px;
    background:var(--amber-tint);color:var(--amber-ink);
    animation:pendPulse 2.6s ease-in-out infinite;
  }
  .attn-prog{height:3px;background:var(--fill);border-radius:2px;overflow:hidden;margin-top:12px}
  .attn-prog-fill{height:100%;background:var(--rk-green);border-radius:2px;transition:width .5s var(--ease-out)}
  .attn-checklist{margin-top:10px;display:flex;flex-direction:column;gap:4px}
  .attn-check-item{
    display:flex;align-items:flex-start;gap:6px;
    font-size:11px;color:var(--ink-2);line-height:1.45;letter-spacing:-.005em;
  }
  .attn-check-item .aci{
    flex:none;width:12px;height:12px;margin-top:1px;
    color:var(--amber-ink);opacity:.7;
  }
  .attn-check-more{
    font-size:10.5px;color:var(--ink-3);padding-left:18px;
    margin-top:1px;font-style:italic;
  }
  /* chips */
  .chip{
    display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:980px;
    font-size:10.5px;font-weight:600;white-space:nowrap;letter-spacing:0;
  }
  .chip.warn{background:var(--amber-tint);color:var(--amber-ink)}
  .chip.ok{background:var(--rk-green-tint);color:var(--rk-green-ink)}
  .chip.mut{background:var(--fill);color:var(--ink-3)}
  .chip.brand{background:rgba(var(--nc-rgb),.12);color:var(--nc)}

  /* ── Portfolio breakdown (facets) ───────────────────────────────────── */
  .facets{padding:10px 18px 18px;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .facet h4{font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:-.005em;margin-bottom:8px}
  .facet-row{display:flex;flex-direction:column;gap:2px}
  .facet-chip{
    position:relative;display:flex;flex-direction:column;align-items:stretch;gap:4px;
    background:transparent;border:none;padding:7px 2px 16px;font-size:12.5px;color:var(--ink-2);
    width:100%;text-align:left;border-radius:8px;transition:background .15s;
  }
  button.facet-chip{cursor:pointer}
  button.facet-chip:hover{background:var(--fill)}
  .facet-chip .fc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .facet-chip::after{
    content:'';position:absolute;left:2px;right:2px;bottom:9px;height:4px;
    border-radius:2px;background:var(--fill);
  }
  .facet-chip b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .facet-bar{
    position:absolute;left:2px;bottom:9px;z-index:1;height:4px;
    border-radius:2px;background:var(--nc);transition:width .5s var(--ease-out);
  }

  /* ── Toolbar / filters (inside the table card) ──────────────────────── */
  .toolbar{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    padding:14px 16px;border-bottom:1px solid var(--line-2);
  }
  .tbl-count{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;padding-right:2px}
  .search{position:relative;flex:1;min-width:220px;max-width:340px}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--ink-3)}
  .search input{
    width:100%;height:38px;border:none;border-radius:11px;
    background:var(--fill);padding:0 12px 0 37px;font-size:13.5px;
    transition:background .18s,box-shadow .18s;
  }
  .search input::placeholder{color:var(--ink-3)}
  .search input:focus,select.flt:focus{
    outline:none;background:var(--card);box-shadow:0 0 0 3.5px rgba(var(--nc-rgb),.22);
  }
  select.flt{
    height:38px;border:none;border-radius:11px;background-color:var(--fill);
    padding:0 30px 0 13px;font-size:13px;font-weight:400;color:var(--ink);
    appearance:none;
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' fill='none'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%2386868B' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right 12px center;cursor:pointer;
    transition:background-color .18s,box-shadow .18s;
  }
  select.flt:hover{background-color:var(--fill-2)}

  /* ── Entities table ─────────────────────────────────────────────────── */
  .tbl-wrap{overflow-x:auto;border-radius:0 0 var(--radius) var(--radius)}
  table.tbl{width:100%;border-collapse:collapse;min-width:760px}
  .tbl th{
    text-align:left;font-size:11px;font-weight:600;color:var(--ink-3);
    letter-spacing:.05em;text-transform:uppercase;
    padding:14px 18px 12px;border-bottom:1px solid var(--line);
    background:var(--card);position:sticky;top:0;z-index:1;
  }
  .tbl td{padding:14px 18px;border-bottom:1px solid var(--line-2);font-size:13.5px;vertical-align:middle}
  .tbl tbody tr{cursor:pointer;transition:background .16s}
  .tbl tbody tr:hover{background:rgba(var(--nc-rgb),.06)}
  .tbl tbody tr:last-child td{border-bottom:none}
  .cell-name{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap;letter-spacing:-.015em}
  .cell-sub{font-size:12px;color:var(--ink-3);margin-top:3px;font-weight:400;letter-spacing:-.005em}
  .gst{
    font-family:ui-monospace,'SF Mono',Menlo,'Roboto Mono',monospace;
    font-size:12px;color:var(--ink-2);letter-spacing:.02em;font-weight:500;
  }
  .tv-tag{font-size:10.5px;font-weight:600;padding:2.5px 9px;border-radius:980px;white-space:nowrap;font-variant-numeric:tabular-nums;flex-shrink:0;background:rgba(var(--nc-rgb),.12);color:var(--nc)}
  .prog-cell{display:flex;align-items:center;gap:10px;min-width:150px}
  .prog-cell .track{flex:1;height:5px;background:var(--fill);border-radius:3px;overflow:hidden;position:relative}
  .prog-cell .track .fill{height:100%;background:var(--rk-green);border-radius:3px;transition:width .5s var(--ease-out)}
  .prog-cell span{font-size:12px;font-weight:600;min-width:40px;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}

  /* ── Matrix ─────────────────────────────────────────────────────────── */
  .matrix-wrap{overflow:auto;max-height:600px;border-radius:var(--radius)}
  table.matrix{border-collapse:separate;border-spacing:0;min-width:100%}
  .matrix th,.matrix td{border-bottom:1px solid var(--line-2);white-space:nowrap}
  .matrix thead th{
    position:sticky;top:0;z-index:3;background:var(--card);
    font-size:10px;font-weight:600;color:var(--ink-3);
    letter-spacing:.03em;text-transform:uppercase;
    padding:11px 8px;text-align:center;
    max-width:96px;white-space:normal;vertical-align:bottom;line-height:1.32;
    border-bottom:1px solid var(--line);
  }
  .matrix thead th:first-child{left:0;z-index:4;text-align:left;padding-left:18px;min-width:190px}
  .matrix tbody th{
    position:sticky;left:0;z-index:2;background:var(--card);
    text-align:left;font-size:13px;font-weight:500;
    padding:11px 18px;max-width:230px;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;cursor:pointer;
  }
  .matrix td{text-align:center;padding:8px}
  .matrix tbody tr:hover th,.matrix tbody tr:hover td{background:rgba(var(--nc-rgb),.06)}
  .dot{display:inline-block;width:11px;height:11px;border-radius:50%}
  .dot.rec{background:var(--rk-green);box-shadow:0 0 0 3px rgba(0,166,81,.13)}
  .dot.pen{background:var(--amber);box-shadow:0 0 0 3px rgba(245,158,11,.14)}
  .dot.na{background:transparent;border:1.5px solid var(--gray-dot)}
  .dot.note{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px rgba(245,158,11,.4)}

  /* ── Drawers — floating sheets ──────────────────────────────────────── */
  .scrim{
    position:fixed;inset:0;background:rgba(0,0,0,.28);
    backdrop-filter:blur(10px) saturate(150%);-webkit-backdrop-filter:blur(10px) saturate(150%);
    opacity:0;pointer-events:none;transition:opacity .25s var(--ease);z-index:60;
  }
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:12px;right:12px;bottom:12px;width:min(560px,calc(100vw - 24px));
    background:var(--card);z-index:70;border-radius:24px;
    transform:translateX(calc(100% + 140px));transition:transform .34s var(--drawer-open);
    box-shadow:var(--shadow-lg),0 0 0 .5px var(--line);display:flex;flex-direction:column;
    overflow:hidden;
  }
  #kpiDrawer{width:min(760px,calc(100vw - 24px))}
  .drawer.on{transform:none}
  .drawer-h{
    display:flex;align-items:flex-start;gap:12px;
    padding:22px 24px 16px;border-bottom:1px solid var(--line-2);
  }
  .drawer-h h2{font-size:18px;font-weight:700;letter-spacing:-.03em;line-height:1.3}
  .drawer-h .meta-line{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .mpill{display:inline-flex;align-items:center;gap:5px;background:var(--fill);border:1px solid var(--line-2);border-radius:7px;padding:3px 9px;line-height:1.3}
  .mpill .mk{font-size:10px;font-weight:700;color:var(--ink-3);letter-spacing:.055em;text-transform:uppercase;white-space:nowrap}
  .mpill .mv{font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap}
  .mpill.gst-pill .mv{font-family:ui-monospace,'SF Mono',Menlo,'Roboto Mono',monospace;font-size:11px;letter-spacing:.04em}
  .drawer-body{flex:1;overflow-y:auto;padding:20px 24px 28px}
  #kpiDrBody{padding:6px 0 18px}
  .drawer-f{
    padding:14px 24px;border-top:1px solid var(--line-2);
    display:flex;gap:10px;justify-content:flex-end;
    background:rgba(245,245,247,.85);
    backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  }
  .x-btn{
    margin-left:auto;width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-2);flex:none;transition:all .15s;
    background:var(--fill);
  }
  .x-btn:hover{background:var(--fill-2);color:var(--ink)}
  .x-btn svg{width:13px;height:13px}

  /* ── Detail drawer body ─────────────────────────────────────────────── */
  .detail-hero{
    display:flex;align-items:center;gap:20px;
    background:var(--surface);border-radius:16px;
    padding:16px 20px;margin-bottom:6px;
  }
  .detail-hero .nums{display:flex;gap:24px;flex-wrap:wrap}
  .dh-num .v{font-size:22px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .dh-num .k{font-size:10.5px;color:var(--ink-3);font-weight:500;margin-top:1px;letter-spacing:-.005em}
  .doc-group{margin-top:16px}
  .doc-group > h4{
    font-size:13px;font-weight:600;letter-spacing:-.015em;color:var(--ink);
    padding-bottom:8px;display:flex;align-items:center;gap:8px;
  }
  .doc-item{display:flex;gap:11px;align-items:flex-start;padding:9px 11px;border-radius:10px}
  .doc-item:hover{background:var(--fill)}
  .doc-item .di-ico{width:20px;height:20px;flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .doc-item .di-name{font-size:13px;font-weight:500;color:var(--ink);letter-spacing:-.01em}
  .doc-item .di-note{font-size:12px;color:var(--ink-3);margin-top:2px;line-height:1.45}
  .drive-link{
    display:inline-flex;align-items:center;gap:4px;flex:none;
    font-size:11.5px;font-weight:500;color:var(--rk-green-ink);text-decoration:none;
    padding:4px 11px;border-radius:980px;background:var(--rk-green-tint);transition:background .15s;
  }
  .drive-link:hover{background:rgba(0,166,81,.22)}
  .drive-link svg{width:12px;height:12px;flex:none}

  /* ── Seller detail — centered modal ──────────────────────────────────── */
  .modal-scrim{
    position:fixed;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;padding:28px 20px;
    background:rgba(18,20,28,.44);
    backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);
    opacity:0;pointer-events:none;transition:opacity .26s var(--ease);
  }
  .modal-scrim.on{opacity:1;pointer-events:auto}
  .modal{
    position:relative;background:var(--card);border-radius:24px;
    width:min(960px,100%);max-height:calc(100vh - 56px);
    display:flex;flex-direction:column;overflow:hidden;
    box-shadow:var(--shadow-lg),0 0 0 .5px var(--line);
    transform:translateY(16px) scale(.984);opacity:.5;
    transition:transform .36s var(--drawer-open),opacity .28s var(--ease);
  }
  .modal-scrim.on .modal{transform:none;opacity:1}
  /* header — fixed; body scrolls beneath */
  .modal-head{flex:none;position:relative;padding:22px 26px 18px;border-bottom:1px solid var(--line-2)}
  .dm-head-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
  .dm-eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dm-eyebrow i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--nc);box-shadow:0 0 0 3px rgba(var(--nc-rgb),.16)}
  .modal-back{
    display:inline-flex;align-items:center;gap:6px;
    font-size:13px;font-weight:600;color:var(--ink-3);
    background:none;border:none;cursor:pointer;padding:4px 0;
    transition:color .15s var(--ease);
  }
  .modal-back:hover{color:var(--ink)}
  .modal-back svg{width:16px;height:16px;flex:none}
  .dm-head-row{display:flex;align-items:center;justify-content:space-between;gap:20px}
  .dm-head-left{flex:1;min-width:0}
  .dm-head-left h2{font-size:24px;font-weight:700;letter-spacing:-.04em;line-height:1.15;color:var(--ink);word-break:break-word}
  .dm-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px;align-items:center}
  .det-ring-wrap{position:relative;width:84px;height:84px;flex:none}
  .det-ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;letter-spacing:-.04em;color:var(--ink)}
  /* body — scroll region, page-surface so white cards float */
  .modal-body{flex:1;overflow-y:auto;padding:20px 26px 26px;background:var(--surface)}
  .det-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
  .det-stat{background:var(--card);border-radius:16px;box-shadow:0 0 0 1px var(--line),var(--shadow-sm);padding:17px 14px 14px;text-align:center;transition:box-shadow .25s var(--ease)}
  .det-stat:hover{box-shadow:0 0 0 1px var(--line),var(--shadow-md)}
  .det-stat .ds-n{font-size:30px;font-weight:700;letter-spacing:-.055em;line-height:1;font-variant-numeric:tabular-nums}
  .det-stat .ds-l{font-size:10px;font-weight:700;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-top:8px}
  /* full-width stacked detail sections */
  .det-sections{display:flex;flex-direction:column;gap:12px}
  .di-card,.dd-card{background:var(--card);border-radius:18px;box-shadow:0 0 0 1px var(--line),var(--shadow-sm);overflow:hidden}
  .di-card-h{
    padding:14px 18px;border-bottom:1px solid var(--line-2);
    font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
    display:flex;align-items:center;
  }
  /* seller info — full-width cell grid (label over value), hairline separators via gap */
  .di-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line-2)}
  .di-cell{background:var(--card);padding:14px 18px 13px;min-width:0}
  .di-cell .dck{font-size:10px;font-weight:700;color:var(--ink-3);letter-spacing:.055em;text-transform:uppercase}
  .di-cell .dcv{font-size:13.5px;color:var(--ink);font-weight:600;margin-top:6px;word-break:break-word;letter-spacing:-.01em;line-height:1.35}
  .di-cell .dcv.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;font-weight:500;letter-spacing:.02em}
  .dds{border-bottom:1px solid var(--line-2)}
  .dds:last-child{border-bottom:none}
  .dds-h{
    display:flex;align-items:center;gap:8px;
    padding:11px 18px;border-bottom:1px solid var(--line-2);
    font-size:10.5px;font-weight:700;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase;
  }
  .dds-h.pend{background:rgba(245,158,11,.06)}
  .dds-h.recv{background:rgba(0,166,81,.06)}
  /* doc rows — two columns, hairline separators via 1px gap */
  .dds-items{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line-2)}
  .ddi{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 18px;background:var(--card);transition:background .14s;min-width:0}
  .ddi:hover{background:var(--fill)}
  .ddi-empty{background:var(--card);pointer-events:none}
  @media(max-width:600px){.ddi-empty{display:none}}
  .ddi-main{display:flex;gap:11px;align-items:flex-start;min-width:0}
  .ddi .dii{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .ddi .din{font-size:12.5px;font-weight:500;color:var(--ink);letter-spacing:-.01em}
  .ddi .din-note{font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.4}
  .det-sheet-link{
    margin-left:auto;display:inline-flex;align-items:center;gap:5px;
    font-size:11px;font-weight:600;color:var(--rk-green-ink);letter-spacing:0;text-transform:none;
    background:var(--rk-green-tint);border:1px solid rgba(0,166,81,.18);border-radius:8px;
    padding:5px 11px;text-decoration:none;transition:background .15s;
  }
  .det-sheet-link:hover{background:rgba(0,166,81,.18)}

  /* ── Follow-up remark (Plastic-Remarks tab, joined by GST) ──────────── */
  /* Detail-view remark card */
  .remark-card{
    background:var(--remark-tint);border-radius:16px;
    box-shadow:inset 0 0 0 1px var(--remark-bd);
    padding:14px 16px;margin-bottom:12px;
    display:flex;flex-direction:column;gap:8px;
  }
  .remark-card-h{
    display:flex;align-items:center;gap:8px;
    font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--remark-ink);
  }
  .remark-card-h svg{width:14px;height:14px;flex:none}
  .remark-card-body{
    font-size:14px;font-weight:500;color:var(--ink);line-height:1.5;
    letter-spacing:-.01em;white-space:pre-wrap;word-break:break-word;
  }
  .eta-pill{
    margin-left:auto;display:inline-flex;align-items:center;gap:5px;
    font-size:11px;font-weight:700;letter-spacing:.01em;text-transform:none;
    color:var(--remark-ink);background:var(--card);
    box-shadow:inset 0 0 0 1px var(--remark-bd);
    border-radius:980px;padding:3px 10px;white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .eta-pill svg{width:12px;height:12px;flex:none}
  /* ETA badge in tables */
  .eta-badge{
    display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
    font-size:11px;font-weight:600;color:var(--remark-ink);
    background:var(--remark-tint);box-shadow:inset 0 0 0 1px var(--remark-bd);
    border-radius:7px;padding:2px 8px;font-variant-numeric:tabular-nums;
  }
  /* Remark cell in overview table — clamp to 2 lines */
  td.remark-cell{max-width:260px}
  td.remark-cell .rc-txt{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;font-size:12px;color:var(--ink-2);line-height:1.4;letter-spacing:-.01em;
  }
  /* Remark strip on KPI kanban card */
  .kb-remark{
    margin:2px 0 6px;padding:9px 11px;border-radius:10px;
    background:var(--remark-tint);box-shadow:inset 0 0 0 1px var(--remark-bd);
    display:flex;flex-direction:column;gap:5px;
  }
  .kb-remark-h{
    display:flex;align-items:center;gap:6px;
    font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--remark-ink);
  }
  .kb-remark-h svg{width:12px;height:12px;flex:none}
  .kb-remark-txt{
    font-size:12px;color:var(--ink-2);line-height:1.45;letter-spacing:-.01em;
    white-space:pre-wrap;word-break:break-word;
  }
  /* Remark snippet on attention card */
  .attn-remark{
    margin-top:8px;padding:7px 10px;border-radius:9px;
    background:var(--remark-tint);box-shadow:inset 0 0 0 1px var(--remark-bd);
    display:flex;gap:6px;align-items:flex-start;
  }
  .attn-remark svg{width:12px;height:12px;flex:none;margin-top:2px;color:var(--remark-ink)}
  .attn-remark .ar-txt{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:11.5px;color:var(--ink-2);line-height:1.4;letter-spacing:-.01em;
  }
  .det-sheet-link svg{width:11px;height:11px;flex:none}
  @media(max-width:600px){
    .modal-scrim{padding:0}
    .modal{max-height:100vh;height:100dvh;width:100vw;border-radius:0}
    .det-stats{grid-template-columns:repeat(2,1fr)}
    .dm-head-left h2{font-size:20px}
    .det-ring-wrap{width:66px;height:66px}
    .det-ring-label{font-size:13px}
    .modal-head{padding:16px 18px 14px}
    .modal-body{padding:16px 16px 22px}
    .dds-items{grid-template-columns:1fr}
  }

  /* ── KPI drill-down summary bar ─────────────────────────────────────── */
  .kpi-sumbar{
    display:flex;gap:18px;flex-wrap:wrap;align-items:center;
    padding:14px 24px;background:var(--surface);margin:0 0 2px;
    font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;
    border-bottom:1px solid var(--line-2);
  }
  .kpi-sumbar b{color:var(--ink);font-weight:700}
  .kpi-sumbar i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:0}

  /* ── Toast / spinner / states ───────────────────────────────────────── */
  .toast{
    position:fixed;bottom:28px;left:50%;transform:translate(-50%,20px);
    opacity:0;z-index:90;background:rgba(30,30,32,.86);color:#F5F5F7;border-radius:980px;
    padding:11px 20px;font-size:13px;font-weight:500;letter-spacing:-.01em;
    display:flex;align-items:center;gap:9px;
    box-shadow:0 12px 32px rgba(0,0,0,.28),0 4px 12px rgba(0,0,0,.16);
    backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
    pointer-events:none;transition:all .28s var(--ease-out);max-width:min(520px,90vw);
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast svg{width:15px;height:15px;flex:none}
  .toast.ok svg{color:#30D158}
  .toast.err{background:rgba(120,20,14,.9)}
  .spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:rot .7s linear infinite}
  .skeleton{
    border-radius:var(--radius);
    background:linear-gradient(100deg,var(--fill) 40%,var(--line-2) 50%,var(--fill) 60%);
    background-size:200% 100%;animation:shim 1.3s infinite;
  }
  .state-box{padding:64px 20px;text-align:center;color:var(--ink-3)}
  .state-box h3{color:var(--ink);font-size:16px;margin-bottom:6px;font-weight:600;letter-spacing:-.02em}
  .state-box p{font-size:13px;max-width:440px;margin:0 auto 18px}
  .empty-cell{padding:40px;text-align:center;color:var(--ink-3);font-size:13px}

  /* ── Tooltip ────────────────────────────────────────────────────────── */
  .tip{
    position:fixed;z-index:100;background:rgba(30,30,32,.9);color:#F5F5F7;font-size:12px;
    border-radius:10px;padding:8px 12px;max-width:280px;pointer-events:none;
    opacity:0;transition:opacity .12s;line-height:1.45;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
    backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);
  }
  .tip.on{opacity:1}
  .tip b{font-weight:600}
  .tip .t-sub{color:rgba(255,255,255,.62)}

  /* ── Focus ──────────────────────────────────────────────────────────── */
  :focus-visible{outline:2.5px solid rgba(var(--nc-rgb),.6);outline-offset:2px;border-radius:6px}
  .btn-primary:focus-visible{outline-color:rgba(255,255,255,.8)}

  /* ── Responsive ─────────────────────────────────────────────────────── */
  @media (max-width:1000px){
    .ov-grid{grid-template-columns:1fr}
    .nbfc-hero{flex-direction:column;align-items:flex-start;gap:20px}
  }
  @media (max-width:768px){
    .topbar{height:auto;flex-wrap:wrap;padding:10px 16px;gap:8px}
    .topbar-brand{padding-right:0}
    nav#nbfcNav{width:100%;overflow-x:auto;margin-left:0}
    .topbar-spacer{display:none}
    .topbar-div{display:none}
    .sync{font-size:11px}
    .shell{padding:14px 14px 44px}
    .nh-name{font-size:30px}
  }
  @media (max-width:560px){
    .attn{grid-template-columns:1fr}
    .facets{grid-template-columns:1fr}
    .drawer{top:0;right:0;bottom:0;width:100vw;border-radius:0;transform:translateX(calc(100% + 140px))}
    .subnav{width:100%;overflow-x:auto}
  }

  /* ── Dark mode component overrides ──────────────────────────────────── */
  @media (prefers-color-scheme:dark){
    ::selection{background:rgba(var(--nc-rgb),.4)}
    .brand-sub{color:#F5F5F7}
    .topbar{background:rgba(8,8,10,.86);backdrop-filter:blur(40px) saturate(220%);-webkit-backdrop-filter:blur(40px) saturate(220%);border-bottom-color:rgba(255,255,255,.08);box-shadow:none}
    .drawer-f{background:rgba(28,28,30,.85)}
    .subnav button.on{background:#636366;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.32)}
    .subnav button.on svg{color:var(--nc-ring)}
    .nbfc-hero{
      background:linear-gradient(165deg,#2E2E32 0%,#18181B 48%,#050506 100%);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.13),0 4px 20px rgba(0,0,0,.5),0 28px 70px rgba(0,0,0,.38);
    }
    .kpi-total .kpi-ico,.kpi-buyers .kpi-ico,.kpi-phase0 .kpi-ico{color:var(--ink)}
    .attn-card{background:rgba(255,255,255,.05)}
    .attn-card:hover{background:rgba(var(--nc-rgb),.16)}
    .tbl tbody tr:hover{background:rgba(var(--nc-rgb),.14)}
    .matrix tbody tr:hover th,.matrix tbody tr:hover td{background:rgba(var(--nc-rgb),.14)}
    .doc-item:hover{background:rgba(255,255,255,.06)}
    .chip.ok{background:rgba(48,209,88,.16);color:#30D158}
    .chip.warn{background:rgba(255,214,10,.14);color:#FFD60A}
    .chip.mut{background:rgba(255,255,255,.08);color:var(--ink-2)}
    .attn-cnt{background:rgba(255,214,10,.14);color:#FFD60A}
    .kpi-pending .kpi-ico{background:rgba(255,214,10,.14);color:#FFD60A}
    .kpi-completed .kpi-ico{background:rgba(48,209,88,.16);color:#30D158}
    .detail-hero{background:rgba(255,255,255,.05)}
    .kpi-sumbar{background:rgba(255,255,255,.05)}
    .drive-link{background:rgba(48,209,88,.15);color:#30D158}
    .drive-link:hover{background:rgba(48,209,88,.24)}
    body{
      background:
        radial-gradient(1200px 580px at 50% -12%,rgba(72,74,92,.30),rgba(0,0,0,0) 72%),
        #000;
      background-attachment:fixed;background-repeat:no-repeat;
    }
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border:1.5px solid transparent;background-clip:content-box}
    ::-webkit-scrollbar-thumb:hover{background-color:rgba(255,255,255,.32)}
    .search input:focus,select.flt:focus{background:#2C2C2E;box-shadow:0 0 0 3.5px rgba(var(--nc-rgb),.4)}
  }
  :root[data-theme="dark"] ::selection{background:rgba(var(--nc-rgb),.4)}
  :root[data-theme="dark"] .brand-sub{color:#F5F5F7}
  :root[data-theme="light"] .brand-sub{color:#111}
  :root[data-theme="dark"] .topbar{background:rgba(8,8,10,.86);backdrop-filter:blur(40px) saturate(220%);-webkit-backdrop-filter:blur(40px) saturate(220%);border-bottom-color:rgba(255,255,255,.08);box-shadow:none}
  :root[data-theme="dark"] .drawer-f{background:rgba(28,28,30,.85)}
  :root[data-theme="dark"] .subnav button.on{background:#636366;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.32)}

  :root[data-theme="dark"] .nbfc-hero{

    box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.13),0 4px 20px rgba(0,0,0,.5),0 28px 70px rgba(0,0,0,.38);

  :root[data-theme="dark"] .kpi-total .kpi-ico,
  :root[data-theme="dark"] .kpi-buyers .kpi-ico,

  :root[data-theme="dark"] .attn-card{background:rgba(255,255,255,.05)}

  :root[data-theme="dark"] .matrix tbody tr:hover th,

  :root[data-theme="dark"] .doc-item:hover{background:rgba(255,255,255,.06)}

  :root[data-theme="dark"] .kpi-pending .kpi-ico{background:rgba(255,214,10,.14);color:#FFD60A}
  :root[data-theme="dark"] .kpi-completed .kpi-ico{background:rgba(48,209,88,.16);color:#30D158}
  :root[data-theme="dark"] .detail-hero{background:rgba(255,255,255,.05)}
  :root[data-theme="dark"] .kpi-sumbar{background:rgba(255,255,255,.05)}
  :root[data-theme="dark"] .drive-link{background:rgba(48,209,88,.15);color:#30D158}
  :root[data-theme="dark"] body{
    background:
      radial-gradient(1200px 580px at 50% -12%,rgba(72,74,92,.30),rgba(0,0,0,0) 72%),
      #000;
    background-attachment:fixed;background-repeat:no-repeat;
  }
  :root[data-theme="dark"] ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border:1.5px solid transparent;background-clip:content-box}

  :root[data-theme="dark"] select.flt:focus{background:#2C2C2E;box-shadow:0 0 0 3.5px rgba(var(--nc-rgb),.4)}

  :root[data-theme="light"] .chip.warn{background:var(--amber-tint);color:var(--amber-ink)}
  :root[data-theme="light"] .chip.mut{background:var(--fill);color:var(--ink-3)}
  :root[data-theme="light"] .attn-cnt{background:var(--amber-tint);color:var(--amber-ink)}

      radial-gradient(1200px 540px at 50% -12%,#FFFFFF,rgba(255,255,255,0) 72%),
      linear-gradient(180deg,#FAFBFD 0%,var(--surface) 380px),
      var(--surface);
    background-attachment:fixed;background-repeat:no-repeat;
  }
  :root[data-theme="light"] .search input:focus,
  :root[data-theme="light"] select.flt:focus{background:var(--card);box-shadow:0 0 0 3.5px rgba(var(--nc-rgb),.22)}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  }

  /* ── KPI drill-down — card accordion rows ───────────────────────────── */
  .ksc{
    background:var(--card);border-radius:16px;
    box-shadow:0 0 0 .5px var(--line),var(--shadow-sm);
    overflow:hidden;transition:box-shadow .22s var(--ease);
  }
  .ksc:hover{box-shadow:0 0 0 .5px var(--line),var(--shadow-md)}
  .ksc.open{box-shadow:0 0 0 1.5px rgba(var(--nc-rgb),.32),var(--shadow-md),0 8px 32px rgba(var(--nc-rgb),.10)}
  .ksc-hdr{
    display:grid;grid-template-columns:36px 1fr auto auto 20px;
    align-items:center;gap:11px;padding:13px 15px;
    cursor:pointer;border:none;background:none;width:100%;text-align:left;
    font-family:inherit;color:var(--ink);transition:background .14s;
  }
  .ksc-hdr:hover{background:rgba(var(--nc-rgb),.05)}
  .ksc-av{
    width:34px;height:34px;border-radius:50%;
    background:rgba(var(--nc-rgb),.13);color:var(--nc);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;flex:none;letter-spacing:.01em;
  }
  .ksc-info{min-width:0;text-align:left}
  .ksc-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.015em}
  .ksc-sub{font-size:11.5px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
  .ksc-ring{position:relative;width:40px;height:40px;flex:none}
  .ksc-ring svg{display:block}
  .ksc-ring-lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;letter-spacing:-.02em}
  .ksc-chev svg{transition:transform .22s var(--ease)}
  .ksc.open .ksc-chev svg{transform:rotate(90deg)}
  .ksc-panel{max-height:0;overflow:hidden;transition:max-height .38s var(--ease)}
  .ksc.open .ksc-panel{max-height:900px}
  .ksc-panel-inner{border-top:1px solid var(--line-2);padding:14px 15px 15px}
  .ksc-doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:6px;margin-bottom:12px}
  .ksc-doc{
    display:flex;align-items:flex-start;gap:9px;padding:9px 10px;
    border-radius:10px;border:1px solid var(--line-2);
  }
  .ksc-doc.pend{border-color:rgba(245,158,11,.32);background:var(--amber-tint)}
  .ksc-doc.recv{border-color:rgba(0,166,81,.22);background:var(--rk-green-tint-2)}
  .ksc-doc.na{background:var(--surface)}
  .ksc-doc-dot{width:7px;height:7px;border-radius:50%;flex:none;margin-top:4.5px}
  .ksc-doc.pend .ksc-doc-dot{background:var(--amber)}
  .ksc-doc.recv .ksc-doc-dot{background:var(--rk-green)}
  .ksc-doc.na .ksc-doc-dot{background:transparent;border:1.5px solid var(--gray-dot)}
  .ksc-doc-name{font-size:11.5px;font-weight:600;color:var(--ink);line-height:1.35;letter-spacing:-.01em}
  .ksc-doc-tag{
    font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    margin-top:4px;display:inline-block;padding:2px 7px;border-radius:4px;
  }
  .ksc-doc.pend .ksc-doc-tag{background:rgba(245,158,11,.18);color:var(--amber-ink)}
  .ksc-doc.recv .ksc-doc-tag{background:rgba(0,166,81,.14);color:var(--rk-green-ink)}
  .ksc-doc.na .ksc-doc-tag{background:var(--fill);color:var(--ink-3)}
  .ksc-foot{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--line-2);gap:10px}
  .ksc-prog{height:4px;background:var(--fill);border-radius:2px;overflow:hidden;flex:1;max-width:120px}
  .ksc-prog-fill{height:100%;background:var(--rk-green);border-radius:2px;transition:width .5s var(--ease-out)}
  @media(prefers-color-scheme:dark){
    .ksc-doc.na{background:rgba(255,255,255,.04)}
    .ksc-doc.recv{background:rgba(0,166,81,.10);border-color:rgba(0,166,81,.22)}
    .ksc-doc.pend{background:rgba(245,158,11,.10);border-color:rgba(245,158,11,.24)}
  }
  :root[data-theme="dark"] .ksc-doc.na{background:rgba(255,255,255,.04)}
  :root[data-theme="dark"] .ksc-doc.recv{background:rgba(0,166,81,.10);border-color:rgba(0,166,81,.22)}
  :root[data-theme="dark"] .ksc-doc.pend{background:rgba(245,158,11,.10);border-color:rgba(245,158,11,.24)}

  /* ── KPI drill-down — centered box with a scrollable table ──────────────── */
  #kpiDrawer{
    top:50%;left:50%;right:auto;bottom:auto;
    width:min(1080px,calc(100vw - 44px));max-height:calc(100vh - 56px);
    border-radius:24px;background:var(--card);
    box-shadow:var(--shadow-lg),0 0 0 .5px var(--line);
    transform:translate(-50%,-50%) translateY(14px) scale(.985);opacity:0;pointer-events:none;
    transition:transform .34s var(--drawer-open),opacity .24s var(--ease);
    display:flex;flex-direction:column;overflow:hidden;z-index:80;
  }
  #kpiDrawer.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  #scrim{z-index:75}
  #kpiDrawer .drawer-h{
    flex:none;padding:20px 24px 16px;
    border-bottom:1px solid var(--line-2);background:var(--card);align-items:flex-start;
  }
  #kpiDrawer .drawer-h h2{font-size:19px;font-weight:700;letter-spacing:-.03em;color:var(--ink)}
  #kpiDrawer .drawer-h .meta-line{margin-top:5px;font-size:12.5px;color:var(--ink-3)}
  #kpiSearchWrap{position:relative;margin-top:12px}
  #kpiSearchWrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink-3)}
  #kpiSearch{width:100%;box-sizing:border-box;padding:7px 10px 7px 32px;font-size:13px;font-family:inherit;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);outline:none}
  #kpiSearch:focus{border-color:var(--nc);box-shadow:0 0 0 3px rgba(var(--nc-rgb),.12)}
  #kpiSearch::placeholder{color:var(--ink-3)}
  #kpiNoResults{display:none;padding:48px 24px;text-align:center;font-size:13px;color:var(--ink-3)}
  /* body is the scroll region — both axes; sticky header comes from .tbl th */
  #kpiDrBody{flex:1;min-height:0;overflow:auto;padding:0;background:var(--surface)}
  #kpiDrBody table.tbl{min-width:840px}
  #kpiDrBody .tbl th{background:var(--card)}
  #kpiDrBody .tbl th:first-child,#kpiDrBody .tbl td:first-child{padding-left:24px}
  #kpiDrBody .tbl th:last-child,#kpiDrBody .tbl td:last-child{padding-right:24px}
  .kpi-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;text-align:center;min-height:220px}
  .kpi-empty h4{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.02em;margin-bottom:8px}
  .kpi-empty p{font-size:13px;color:var(--ink-3);line-height:1.6;max-width:360px}
  /* ── Kanban card grid ──────────────────────────────────────────────────── */
  .kb-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(292px,1fr));
    gap:10px;align-content:start;
  }
  /* ── Extra-meta attribute badges (Vintage, Eligibility) ───────────────── */
  .kb-attrs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .kb-attr{
    display:inline-flex;align-items:center;gap:5px;
    padding:4px 11px;border-radius:8px;
    font-size:11.5px;font-weight:600;
    background:var(--fill);color:var(--ink-2);
  }
  .kb-attr svg{width:11px;height:11px;flex:none;opacity:.85}
  .kb-attr-vintage{background:rgba(var(--nc-rgb),.12);color:var(--nc)}
  .kb-attr-elig-yes{background:var(--rk-green-tint);color:var(--rk-green-ink)}
  .kb-attr-elig-no{background:rgba(220,38,38,.10);color:#DC2626}
  /* ── Document section labels inside expanded card ──────────────────────── */
  .kb-sec{
    display:flex;align-items:center;gap:6px;
    font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink-3);margin:10px 0 6px;
  }
  .kb-sec:first-of-type{margin-top:0}
  .kb-sec-badge{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:18px;height:18px;border-radius:9px;padding:0 4px;
    font-size:9.5px;font-weight:800;
  }
  .kb-sec-pend .kb-sec-badge{background:var(--amber-tint);color:var(--amber-ink)}
  .kb-sec-na   .kb-sec-badge{background:var(--fill);color:var(--ink-3)}
  .kb-sec-recv .kb-sec-badge{background:var(--rk-green-tint);color:var(--rk-green-ink)}
  /* ── Overview sellers table ────────────────────────────────────────────── */
  #ovSellersCard{margin-top:10px}
  /* ── Responsive — KPI box becomes a full sheet on small screens ─────────── */
  @media(max-width:768px){
    #kpiDrawer{
      top:0;left:0;right:0;bottom:0;
      width:100vw;max-height:100vh;height:100dvh;border-radius:0;
      transform:translateY(16px) scale(1);
    }
    #kpiDrawer.on{transform:none}
    #kpiDrawer .drawer-h{padding:14px 16px 12px}
    #kpiDrBody table.tbl{min-width:660px}
    #kpiDrBody .tbl th:first-child,#kpiDrBody .tbl td:first-child{padding-left:16px}
    #kpiDrBody .tbl th:last-child,#kpiDrBody .tbl td:last-child{padding-right:16px}
  }
  @media(prefers-color-scheme:dark){
    .kb-attr-elig-no{background:rgba(220,38,38,.18)}
  }
  :root[data-theme="dark"] .kb-attr-elig-no{background:rgba(220,38,38,.18)}

  /* ══════════════════ Seller Detail Deep-Dive modal ══════════════════ */
  .modal-dd{width:min(880px,100%)}
  .dd-head{
    flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:19px 24px;border-bottom:1px solid var(--line-2);
  }
  .dd-title{font-size:19px;font-weight:600;letter-spacing:-.02em;color:var(--ink);line-height:1.3;min-width:0}
  .dd-x{
    width:32px;height:32px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-2);background:var(--fill);transition:all .15s var(--ease);
  }
  .dd-x:hover{background:var(--fill-2);color:var(--ink)}
  .dd-x:active{transform:scale(.94)}
  .dd-x svg{width:15px;height:15px}
  .dd-body{display:flex;flex-direction:column;gap:15px}

  /* top row — completion ring · follow-up remark */
  .dd-top{display:grid;grid-template-columns:minmax(230px,.86fr) 1.14fr;gap:15px;align-items:stretch}
  .dd-ringcard{
    background:var(--card);border-radius:18px;box-shadow:0 0 0 1px var(--line),var(--shadow-sm);
    padding:22px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:16px;
  }
  .dd-ring{position:relative;width:152px;height:152px;flex:none}
  .dd-ring svg{display:block}
  .dd-ring-lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .dd-ring-lbl b{font-size:39px;font-weight:600;letter-spacing:-.035em;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
  .dd-ring-lbl span{margin-top:7px;font-size:12px;font-weight:500;color:var(--ink-3);line-height:1.25}
  .dd-callout{
    width:100%;background:var(--surface);border-radius:12px;box-shadow:0 0 0 1px var(--line-2);
    padding:12px 14px;text-align:center;font-size:13px;font-weight:400;color:var(--ink-2);letter-spacing:-.005em;
  }
  .dd-callout b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

  .dd-followwrap{display:flex;min-width:0}
  .dd-follow{
    flex:1;min-width:0;background:var(--remark-tint);border-radius:18px;box-shadow:inset 0 0 0 1px var(--remark-bd);
    padding:20px 20px;display:flex;flex-direction:column;
  }
  .dd-follow-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:13px}
  .dd-follow-title{font-size:17px;font-weight:600;letter-spacing:-.02em;color:var(--ink);line-height:1.22}
  .dd-follow-badge{
    flex:none;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--remark-ink);background:var(--card);box-shadow:inset 0 0 0 1px var(--remark-bd);
    border-radius:980px;padding:5px 10px;white-space:nowrap;
  }
  .dd-follow-body{font-size:13.5px;font-weight:400;color:var(--ink);line-height:1.55;letter-spacing:-.005em;white-space:pre-wrap;word-break:break-word}
  .dd-follow-none{color:var(--ink-3)}
  .dd-follow-eta{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:7px}
  .dd-eta-k{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--remark-ink)}
  .dd-eta-v{
    align-self:flex-start;font-size:13px;font-weight:600;color:var(--remark-ink);
    background:var(--card);box-shadow:inset 0 0 0 1px var(--remark-bd);border-radius:980px;
    padding:7px 14px;font-variant-numeric:tabular-nums;
  }

  /* metadata grid — hairlines via 1px gap */
  .dd-meta{
    background:var(--line-2);border-radius:18px;box-shadow:0 0 0 1px var(--line),var(--shadow-sm);
    display:grid;grid-template-columns:repeat(3,1fr);gap:1px;overflow:hidden;
  }
  .dd-mcell{background:var(--card);padding:14px 18px 13px;min-width:0}
  .dd-mk{font-size:10px;font-weight:700;letter-spacing:.055em;text-transform:uppercase;color:var(--ink-3)}
  .dd-mv{font-size:14px;font-weight:600;color:var(--ink);margin-top:6px;letter-spacing:-.01em;word-break:break-word;line-height:1.3}
  .dd-mv.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12.5px;font-weight:500;letter-spacing:.02em}

  /* document status + links */
  .dd-doccard{background:var(--card);border-radius:18px;box-shadow:0 0 0 1px var(--line),var(--shadow-sm);overflow:hidden}
  .dd-doc-h{padding:15px 20px;font-size:15px;font-weight:600;letter-spacing:-.015em;color:var(--ink);border-bottom:1px solid var(--line-2)}
  .dd-doclist{padding:6px 8px}
  .dd-drow{
    display:grid;grid-template-columns:minmax(0,1fr) 92px 172px 22px;align-items:center;gap:12px;
    padding:11px 12px;border-radius:10px;transition:background .14s;
  }
  .dd-drow:hover{background:var(--fill)}
  .dd-dname{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:13.5px;font-weight:500;color:var(--ink);letter-spacing:-.01em}
  .dd-dnote{font-size:11.5px;color:var(--ink-3);font-weight:400;line-height:1.4}
  .dd-dstat{font-size:12.5px;font-weight:600;letter-spacing:-.005em}
  .dd-dstat.ok{color:var(--rk-green-ink)}
  .dd-dstat.warn{color:var(--amber-ink)}
  .dd-dstat.mut{color:var(--ink-3)}
  .dd-dlink{font-size:12.5px;min-width:0}
  .dd-drive{color:var(--nc);font-weight:500;text-decoration:none;white-space:nowrap}
  .dd-drive:hover{text-decoration:underline}
  .dd-nolink{color:var(--ink-3)}
  .dd-dico{width:22px;height:22px;justify-self:end;flex:none}
  .dd-dico.ok{color:var(--rk-green)}
  .dd-dico.warn{color:var(--amber)}
  .dd-dico.mut{color:var(--gray-dot)}
  .dd-dico svg{width:22px;height:22px;display:block}

  @media (max-width:680px){
    .dd-top{grid-template-columns:1fr}
    .dd-meta{grid-template-columns:1fr 1fr}
    .dd-drow{
      grid-template-columns:1fr auto;grid-template-areas:"name ico" "stat link";row-gap:5px;column-gap:12px;
    }
    .dd-dname{grid-area:name}.dd-dico{grid-area:ico;align-self:start}
    .dd-dstat{grid-area:stat}.dd-dlink{grid-area:link;justify-self:end}
  }
</style>
