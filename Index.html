<script>
'use strict';

/* ═══════════════════════════ State & helpers ═══════════════════════════ */

var DATA = null;            // full getInitialData() payload
var NBFCS = {};             // id → nbfc object
var NBFC_ORDER = [];        // ordered list of nbfc ids
var activeNbfcId = null;
var ND = null;              // active nbfc object
var fieldByType = {};       // gst / date / entity / turnover → header (active NBFC)
var nameHeader = null;      // active NBFC's business-name header
var eligibilityHeader = null;
var qualifiedHeader = null;
var creditLimitHeader = null;
var vintageHeader = null;   // active NBFC's Vintage_with_Recykal header (for eligibility)
var lastFocusRefresh = 0;

/* Vintage-based eligibility thresholds (years) per financing product.
   A seller/vendor is eligible only when the Recykal×Vendor vintage ≥ threshold.
   Products not listed here fall back to the sheet's Eligibility column. */
var VINTAGE_ELIG_YEARS = { billmart: 1, capitalxb: 0.5 };

/* Per-NBFC accent theming. Keys are backend tab ids (see Code.gs CONFIG.NBFC_TABS). */
var NBFC_THEME = {
  billmart:  { nc:'#E85D04', rgb:'232,93,4',   ring:'#FF8C4A' },
  capitalxb: { nc:'#1849D6', rgb:'24,73,214',  ring:'#7DABFF' },
  strideone: { nc:'#0D9488', rgb:'13,148,136', ring:'#2DD4BF' }
};
function themeFor(id){ return NBFC_THEME[id] || { nc:'#E85D04', rgb:'232,93,4', ring:'#FF8C4A' }; }

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function initials(name){
  var p = String(name||'').replace(/[^A-Za-z0-9 ]/g,' ').trim().split(/\s+/);
  return ((p[0]||'')[0]||'•').toUpperCase() + ((p[1]||'')[0]||'').toUpperCase();
}
function pct(n){ return (Math.round(n*10)/10) + '%'; }
function normKey(s){ return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]+/g,''); }
/* Entity noun for the active tab — StrideOne tracks buyers, the others sellers. */
function entNoun(cap){ var n = (ND && ND.id === 'strideone') ? 'buyer' : 'seller'; return cap ? n.charAt(0).toUpperCase()+n.slice(1) : n; }

/* ── Follow-up remark helpers (data from the Plastic-Remarks tab) ─────── */
var REMARK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
var ETA_ICON    = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';
function hasRemark(e){ return !!(e && (e.remarks || e.eta)); }
function etaPill(eta){ return eta ? '<span class="eta-pill">' + ETA_ICON + 'ETA · ' + esc(eta) + '</span>' : ''; }
/* Detail-view remark card — '' when the seller has neither a remark nor an ETA */
function remarkCard(e){
  if (!hasRemark(e)) return '';
  return '<div class="remark-card">' +
      '<div class="remark-card-h">' + REMARK_ICON + 'Follow-up Remark' + etaPill(e.eta) + '</div>' +
      (e.remarks ? '<div class="remark-card-body">' + esc(e.remarks) + '</div>' : '') +
    '</div>';
}

function animCount(el, to, dur){
  if (!el) return;
  var start = null, ease = function(t){ return 1 - Math.pow(1 - t, 3); };
  var step = function(ts){
    if (!start) start = ts;
    var p = Math.min((ts - start) / (dur || 680), 1);
    el.textContent = Math.round(ease(p) * to);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function run(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function(res, rej){
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(rej);
    r[fn].apply(r, args);
  });
}
function toast(msg, kind){
  var t = $('toast');
  t.className = 'toast on ' + (kind === 'err' ? 'err' : 'ok');
  $('toastMsg').textContent = msg;
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('on'); }, 3600);
}

/* Format a turnover value for display: "2.5 Cr" → "₹2.5 Cr" */
function formatTurnover(raw){
  if (!raw) return '';
  var s = String(raw).trim();
  if (!s || s === '—') return '';
  var m = s.replace(/₹/g,'').trim().match(/^([\d,]+(?:\.\d+)?)\s*(cr(?:ore)?s?|l(?:akh)?s?)/i);
  if (m){
    var n = parseFloat(m[1].replace(/,/g,''));
    var unit = /^cr/i.test(m[2]) ? 'Cr' : 'L';
    return '₹' + n + ' ' + unit;
  }
  return s.indexOf('₹') === 0 ? s : '₹ ' + s;
}
function docShort(key){
  var s = String(key);
  return s.length > 44 ? s.slice(0, 42).replace(/[ ,;–-]+$/,'') + '…' : s;
}

/* Parse a vintage string like "1 year", "6 months", "18 months", "2.5 yrs"
   Returns the number of months, or null if unparseable. */
function vintageMonths_(str){
  if (!str) return null;
  var s = String(str).trim().toLowerCase();
  var m = s.match(/(\d+(?:\.\d+)?)\s*(year|yr|y(?:\b|r)|month|mon|mo(?:\b|n))/);
  if (!m) return null;
  var n = parseFloat(m[1]);
  return /year|yr/.test(m[2]) ? n * 12 : n;
}

/* Parse a Vintage_with_Recykal value into YEARS.
   Handles bare numbers (the sheet stores years, e.g. "0.5", "1", "5.8") as well
   as unit-qualified strings ("6 months", "3 yrs"). Blank / "-" / non-numeric → null. */
function vintageYears_(raw){
  if (raw == null) return null;
  var s = String(raw).trim().toLowerCase();
  if (!s || s === '-') return null;
  var m = s.match(/(\d+(?:\.\d+)?)\s*(year|yr|y(?:\b|r)|month|mon|mo(?:\b|n))/);
  if (m){ var n = parseFloat(m[1]); return /year|yr/.test(m[2]) ? n : n / 12; }
  var num = parseFloat(s.replace(/[^0-9.\-]/g, ''));
  return isNaN(num) ? null : num;
}

/* Vintage value for one entity (may live in meta or extraMeta depending on tab). */
function vintageValueOf(e){
  if (!vintageHeader) return null;
  if (e.meta && e.meta[vintageHeader] != null && String(e.meta[vintageHeader]).trim() !== '') return e.meta[vintageHeader];
  return (e.extraMeta || {})[vintageHeader];
}

/* Eligibility for the active product.
   Billmart / Capital XB use a live vintage threshold (≥1yr / ≥6mo); every other
   product falls back to the sheet's Eligibility column (value === "yes"). */
function isEligibleEntity(e){
  var thr = VINTAGE_ELIG_YEARS[activeNbfcId];
  if (thr != null){
    var vy = vintageYears_(vintageValueOf(e));
    return vy != null && vy >= thr;
  }
  return !!(eligibilityHeader && String((e.extraMeta || {})[eligibilityHeader] || '').trim().toLowerCase() === 'yes');
}

function regionHeader(){
  var f = (ND.metaFields || []).filter(function(f){ return normKey(f.key) === 'region'; })[0];
  return f ? f.key : '';
}

/* ─── SVG icons ──────────────────────────────────────────────────────── */
var ICON = {
  users:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  buyers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>',
  seed:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V12"/><path d="M12 12C12 8 9 5 4 5c0 5 3 8 8 7z"/><path d="M12 10c0-3 3-6 8-6 0 4-3 7-8 6z"/></svg>',
  clock:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3.2 2"/></svg>',
  check:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>',
  award:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>',
  card:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>',
  chev:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>'
};

/* Ring gauge SVG */
function ringSvg(p, size, stroke, trackColor, fillColor){
  var r = (size - stroke) / 2, c = 2 * Math.PI * r;
  var off = c * (1 - Math.min(Math.max(p,0),100)/100);
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="transform:rotate(-90deg)">' +
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+trackColor+'" stroke-width="'+stroke+'"/>' +
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+fillColor+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" style="transition:stroke-dashoffset .8s cubic-bezier(.22,1,.36,1)"/></svg>';
}

/* ═══════════════════════════════ Boot ══════════════════════════════════ */

function boot(){
  $('fatal').style.display = 'none';
  $('app').style.display = 'none';
  $('loading').style.display = 'block';
  run('getInitialData').then(onData).catch(function(err){
    $('loading').style.display = 'none';
    $('fatalMsg').textContent = (err && err.message) ? err.message : String(err);
    $('fatal').style.display = 'block';
  });
}

function onData(data){
  DATA = data;
  lastFocusRefresh = Date.now();
  NBFCS = {}; NBFC_ORDER = [];
  (data.nbfcs || []).forEach(function(n){ NBFCS[n.id] = n; NBFC_ORDER.push(n.id); });
  // Log MB debug info so filter strings can be verified in browser console.
  if (data.mbCounts && data.mbCounts._debug) console.log('[MB debug]', JSON.stringify(data.mbCounts._debug, null, 2));

  if (!NBFC_ORDER.length){
    $('loading').style.display = 'none';
    $('fatalMsg').textContent = 'No NBFC tabs were returned by the sheet.';
    $('fatal').style.display = 'block';
    return;
  }

  // Preserve the active NBFC across refreshes; otherwise pick the first that loaded ok.
  if (!activeNbfcId || !NBFCS[activeNbfcId]){
    activeNbfcId = NBFC_ORDER.filter(function(id){ return NBFCS[id].ok; })[0] || NBFC_ORDER[0];
  }

  $('loading').style.display = 'none';
  $('fatal').style.display = 'none';
  $('app').style.display = 'block';
  $('sheetLink').href = DATA.sheetUrl; $('sheetLink').style.display = 'inline-flex';
  var t = new Date(DATA.generatedAt);
  $('syncLabel').innerHTML = 'Synced <b>' + t.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) + '</b> · ' + esc(DATA.sheetName || 'Google Sheet');

  applyNbfcTheme(activeNbfcId);
  renderNbfcNav();
  setNd();
  renderAll();
}

function refresh(quiet){
  var btn = $('refreshBtn');
  btn.disabled = true; btn.style.opacity = .55;
  return run('getInitialData', {forceRefresh: true}).then(function(d){
    onData(d);
    if (!quiet) toast('Refreshed from Google Sheet');
  }).catch(function(err){
    if (!quiet) toast((err && err.message) || 'Refresh failed', 'err');
  }).finally(function(){ btn.disabled = false; btn.style.opacity = 1; });
}

/* ═══════════════════════════ NBFC switching ════════════════════════════ */

function applyNbfcTheme(id){
  var th = themeFor(id), s = document.documentElement.style;
  s.setProperty('--nc', th.nc);
  s.setProperty('--nc-rgb', th.rgb);
  s.setProperty('--nc-ring', th.ring);
}

function renderNbfcNav(){
  $('nbfcNav').innerHTML = NBFC_ORDER.map(function(id){
    var n = NBFCS[id], th = themeFor(id), on = id === activeNbfcId;
    var style = on ? ' style="background:'+th.nc+';box-shadow:0 1px 3px rgba('+th.rgb+',.35)"' : '';
    return '<button type="button" class="nbfc-pill'+(on?' on':'')+'" data-nbfc="'+id+'"'+style+'>' +
      '<i class="nbfc-dot" style="background:'+th.nc+'"></i>' + esc(n.name) + '</button>';
  }).join('');
}

function switchNbfc(id){
  if (!NBFCS[id] || id === activeNbfcId) return;
  activeNbfcId = id;
  applyNbfcTheme(id);
  renderNbfcNav();
  setNd();
  if ($('detailModal').classList.contains('on')) closeDetailView();
  closeKpi();
  renderAll();
}

function setNd(){
  ND = NBFCS[activeNbfcId];
  fieldByType = {}; nameHeader = ND.nameHeader || null;
  eligibilityHeader = ND.eligibilityHeader || null;
  qualifiedHeader   = ND.qualifiedHeader   || null;
  creditLimitHeader = ND.creditLimitHeader || null;
  vintageHeader     = null;
  (ND.metaFields || []).forEach(function(f){
    if (f.type !== 'text' && !fieldByType[f.type]) fieldByType[f.type] = f.key;
    if (!nameHeader && normKey(f.key).indexOf('name') !== -1) nameHeader = f.key;
    if (!vintageHeader && normKey(f.key).indexOf('vintage') !== -1) vintageHeader = f.key;
  });
  // Vintage may sit in the display-only (extraMeta) columns on some tabs.
  if (!vintageHeader) (ND.extraMetaFields || []).forEach(function(k){
    if (!vintageHeader && normKey(k).indexOf('vintage') !== -1) vintageHeader = k;
  });
}

function renderAll(){
  if (!ND.ok){ renderNbfcError(); return; }
  $('nbfcError').style.display = 'none';
  document.querySelectorAll('.view').forEach(function(v){ v.style.removeProperty('display'); });
  $('subnav').style.display = '';
  renderHero();
  renderKpis();
  renderOverview();
  renderMatrix();
}

function renderNbfcError(){
  $('nbfcHero').innerHTML =
    '<div class="nh-info"><div class="nh-eyebrow"><i></i>' + esc(ND.name) + '</div>' +
    '<div class="nh-name">Unavailable</div>' +
    '<div class="nh-sub">This NBFC tab could not be read from the sheet.</div></div>';
  $('kpis').innerHTML = '';
  $('subnav').style.display = 'none';
  document.querySelectorAll('.view').forEach(function(v){ v.style.display = 'none'; });
  $('nbfcErrorMsg').textContent = ND.error
    ? ('“' + ND.name + '” tab: ' + ND.error)
    : ('The “' + ND.name + '” tab could not be located or parsed.');
  $('nbfcError').style.display = 'block';
}

/* ═══════════════════════════ Statistics ════════════════════════════════ */

/* Bucket definitions (per NBFC tab):
   • total     — every seller in the tab
   • phase0    — all identified sellers (Phase 0 = everyone in the system)
   • pending   — has at least one document still awaited (pending > 0)
   • completed — every required document received (pending === 0, applicable > 0) */
function computeStats(entities){
  var s = {total:0, phase0:0, pending:0, completed:0, received:0, pendingDocs:0, na:0, applicable:0,
           eligible:0, qualified:0, creditLimit:0};
  (entities || []).forEach(function(e){
    s.total++;
    s.received += e.received; s.pendingDocs += e.pending; s.na += e.na; s.applicable += e.applicable;
    if (e.pending === 0 && e.applicable > 0) s.completed++;
    var em = e.extraMeta || {};
    if (isEligibleEntity(e)) s.eligible++;
    if (qualifiedHeader   && String(em[qualifiedHeader]   || '').trim().toLowerCase() === 'yes') s.qualified++;
    if (creditLimitHeader && String(em[creditLimitHeader] || '').trim()) s.creditLimit++;
  });
  s.phase0 = s.total;
  s.pending = Math.max(0, s.eligible - s.completed);
  s.completion = s.applicable ? Math.round(s.received / s.applicable * 1000) / 10 : 0;
  return s;
}

function filterByKind(kind){
  var ents = ND.entities || [];
  if (kind === 'phase0')      return ents.slice();
  if (kind === 'pending')     return ents.filter(function(e){
    return isEligibleEntity(e) && !(e.pending === 0 && e.applicable > 0);
  });
  if (kind === 'completed')   return ents.filter(function(e){ return e.pending === 0 && e.applicable > 0; });
  if (kind === 'eligible')    return ents.filter(function(e){ return isEligibleEntity(e); });
  if (kind === 'qualified')   return ents.filter(function(e){
    return qualifiedHeader && String((e.extraMeta||{})[qualifiedHeader]||'').trim().toLowerCase() === 'yes';
  });
  if (kind === 'creditlimit') return ents.filter(function(e){
    return creditLimitHeader && String((e.extraMeta||{})[creditLimitHeader]||'').trim();
  });
  return ents.slice();
}

/* ═══════════════════════════ NBFC hero band ════════════════════════════ */

function renderHero(){
  var st = computeStats(ND.entities);
  var th = themeFor(activeNbfcId);
  var isBuyer = (ND.id === 'strideone');
  $('nbfcHero').innerHTML =
    '<div class="nh-info">' +
      '<div class="nh-eyebrow"><i></i>' + (isBuyer ? 'NBFC · Buyer tracker' : 'NBFC · Document tracker') + '</div>' +
      '<div class="nh-name">' + esc(ND.name) + '</div>' +
    '</div>';
}

/* ═══════════════════════════ Hero KPI cards ════════════════════════════ */

function renderKpis(){
  var st          = computeStats(ND.entities);
  var mbC         = (DATA && DATA.mbCounts) ? DATA.mbCounts : { sellers: 0, buyers: 0 };
  var isStrideOne = (ND.id === 'strideone');

  var cards;
  // For StrideOne, Phase 0 = P-0 priority buyers counted by the backend.
  var stridePhase0 = (isStrideOne && ND.phase0 != null) ? ND.phase0 : st.phase0;

  if (isStrideOne) {
    // StrideOne: 7 cards. Total Buyers = filtered _mb_buyers (Open Marketplace · Completed).
    cards = [
      { kind:'buyers',      tone:'buyers',      icon:ICON.buyers, num:mbC.buyers,     label:'Total Buyers',  sub:'Open Marketplace · Completed' },
      { kind:'phase0',      tone:'phase0',      icon:ICON.seed,   num:stridePhase0,   label:'Phase 0',       sub:'P-0 priority buyers' },
      { kind:'eligible',    tone:'eligible',    icon:ICON.shield, num:st.eligible,    label:'First Check',   sub:'Pre-screening passed' },
      { kind:'qualified',   tone:'qualified',   icon:ICON.award,  num:st.qualified,   label:'Logged In',     sub:'Buyers logged in' },
      { kind:'creditlimit', tone:'creditlimit', icon:ICON.card,    num:st.creditLimit, label:'Credit Limit',  sub:'Buyers with credit limit assigned' },
      { kind:'completed',   tone:'completed',   icon:ICON.check,   num:st.completed,   label:'Completed',     sub:'All required docs received' },
      { kind:'pending',     tone:'pending',     icon:ICON.clock,   num:st.pending,     label:'Pending',       sub:'Documents still awaited' }
    ];
  } else {
    // Billmart / Capital XB: 6 cards. Total Sellers = filtered _mb_sellers (Open Marketplace · Completed).
    cards = [
      { kind:'phase0',      tone:'phase0',      icon:ICON.users,  num:mbC.sellers,    label:'Total Sellers', sub:'Open Marketplace · Completed' },
      { kind:'eligible',    tone:'eligible',    icon:ICON.shield, num:st.eligible,    label:'First Check',   sub:'Pre-screening passed' },
      { kind:'qualified',   tone:'qualified',   icon:ICON.award,  num:st.qualified,   label:'Logged In',     sub:'Sellers logged in' },
      { kind:'creditlimit', tone:'creditlimit', icon:ICON.card,   num:st.creditLimit, label:'Credit Limit Assigned',  sub:'Sellers with credit limit assigned' },
      { kind:'pending',     tone:'pending',     icon:ICON.clock,  num:st.pending,     label:'Pending',       sub:'Documents still awaited' }
    ];
  }

  $('kpis').classList.toggle('kpis-6', !isStrideOne);
  $('kpis').innerHTML = cards.map(function(c, i){
    return '<button type="button" class="kpi kpi-' + c.tone + '" onclick="openKpi(\'' + c.kind + '\')" style="animation-delay:' + (i*60) + 'ms">' +
      '<div class="kpi-top"><span class="kpi-ico">' + c.icon + '</span><span class="kpi-chev">' + ICON.chev + '</span></div>' +
      '<div class="kpi-num" id="kpi-' + c.kind + '">0</div>' +
      '<div class="kpi-label">' + c.label + '</div>' +
      '<div class="kpi-sub">' + esc(c.sub) + '</div>' +
    '</button>';
  }).join('');

  if (isStrideOne) {
    animCount($('kpi-buyers'), mbC.buyers);
  }
  animCount($('kpi-phase0'),      isStrideOne ? stridePhase0 : mbC.sellers);
  animCount($('kpi-eligible'),    st.eligible);
  animCount($('kpi-qualified'),   st.qualified);
  animCount($('kpi-creditlimit'), st.creditLimit);
  animCount($('kpi-completed'),   st.completed);
  animCount($('kpi-pending'),     st.pending);
}

/* ═══════════════════════════ Overview view ═════════════════════════════ */

function renderOverview(){
  var docs = ND.docs || [], entities = ND.entities || [];

  /* Needs attention */
  $('attnList').innerHTML = buildAttnCards(entities, docs);
  var withPending = entities.filter(function(e){ return e.pending > 0; }).length;

    : 'Every document is in.';

/* Stacked document bars from docs + entity rows */
function buildDocBars(docs, rows){
  if (!docs || !docs.length) return '<div class="empty-cell">No document columns found.</div>';
  var data = docs.map(function(doc){
    var rec=0,pen=0,na=0;
    (rows||[]).forEach(function(r){ var st=(r.docs[doc.key]||{}).status; if(st==='received')rec++; else if(st==='na')na++; else pen++; });
    var app=rec+pen;
    return {key:doc.key, rec:rec, pen:pen, na:na, app:app, p:app?rec/app*100:0};
  }).sort(function(a,b){ return b.pen-a.pen||a.p-b.p; });
  return data.map(function(r,i){
    var tipTxt='<b>'+esc(r.key)+'</b><br><span class="t-sub">'+r.rec+' received · '+r.pen+' pending · '+r.na+' not applicable</span>';
    var bar=r.app===0
      ? '<div class="strack" style="opacity:.3"><div class="s-rec" style="flex:0"></div></div>'
      : '<div class="strack"><div class="s-rec" style="flex:'+r.rec+'"></div><div class="s-pen" style="flex:'+r.pen+'"></div></div>';
    var badge=r.app===0?'<div class="dstat muted">N/A</div>'
      :r.pen===0?'<div class="dstat ok">'+r.rec+'/'+r.app+'</div>'
      :'<div class="dstat pen">'+r.pen+' left</div>';
    return '<div class="docbar'+(r.pen>0?' has-pen':'')+'" data-tip="'+esc(tipTxt)+'" style="--db-i:'+i+'">'+
      '<span class="name" title="'+esc(r.key)+'">'+esc(docShort(r.key))+'</span>'+bar+badge+'</div>';
  }).join('');
}

/* Attention cards from entity rows */
var CHK_BOX = '<svg class="aci" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x=".65" y=".65" width="10.7" height="10.7" rx="2.5" stroke="currentColor" stroke-width="1.3"/></svg>';

function buildAttnCards(rows, docs){
  var withPending = (rows||[]).slice().sort(function(a,b){ return b.pending-a.pending||a.completion-b.completion; }).filter(function(r){ return r.pending>0; });
  if (!withPending.length) return '<div class="empty-cell" style="padding:24px 12px">All checklists are complete.</div>';
  var entityHeader = ND.entityHeader || fieldByType.entity;
  var tvHeader = fieldByType.turnover;
  return withPending.slice(0,6).map(function(r,i){
    var nm = nameHeader ? r.meta[nameHeader] : ('Row '+r.row);
    var tv = tvHeader ? formatTurnover(r.meta[tvHeader]) : '';
    var ent = entityHeader ? (r.meta[entityHeader]||'') : '';
    var pendingDocs = (docs||[]).filter(function(d){ return (r.docs[d.key]||{}).status==='pending'; })
      .map(function(d){ return d.key; });
    var maxShow = 5;
    var shown = pendingDocs.slice(0, maxShow);
    var more  = pendingDocs.length - shown.length;
    var checklist =
      '<div class="attn-checklist">' +
        shown.map(function(name){
          return '<div class="attn-check-item">' + CHK_BOX + '<span>' + esc(name) + '</span></div>';
        }).join('') +
        (more > 0 ? '<div class="attn-check-more">+' + more + ' more</div>' : '') +
      '</div>';
    /* Follow-up remark snippet (from Plastic-Remarks, joined by GST) */
    var remarkSnip = hasRemark(r) ? '<div class="attn-remark">' + REMARK_ICON +
      '<span class="ar-txt">' +
        (r.eta ? '<b>ETA ' + esc(r.eta) + '</b>' + (r.remarks ? ' · ' : '') : '') +
        esc(r.remarks || '') +
      '</span></div>' : '';
    return '<div class="attn-card" onclick="openDetail('+r.row+')" style="animation-delay:'+(i*55)+'ms">'+
      '<div class="attn-head">'+
        '<div class="avatar">'+esc(initials(nm))+'</div>'+
        '<div class="attn-info">'+
          '<div class="attn-name">'+esc(nm)+'</div>'+
          '<div class="attn-type">'+esc(ent)+
            (tv ? (ent ? ' · ' : '')+'<b class="attn-tv-txt">'+esc(tv)+'</b>' : '')+
          '</div>'+
        '</div>'+
        '<span class="attn-cnt">'+r.pending+' pending</span>'+
      '</div>'+
      '<div class="attn-prog"><div class="attn-prog-fill" style="width:'+r.completion+'%"></div></div>'+
      checklist+
      remarkSnip+
    '</div>';
  }).join('');
}

/* Portfolio facet → KPI drawer listing that category's sellers */
function openFacet(enc){
  var parts = enc.split('::');
  var header = decodeURIComponent(parts[0]), value = decodeURIComponent(parts[1]);
  var list = (ND.entities || []).filter(function(e){ return (e.meta[header] || '—') === value; });
  openKpiDrawer(value, list.length + ' seller' + (list.length===1?'':'s') + ' · ' + header, list, null);
}

/* ═══════════════════════════ All sellers table ═════════════════════════ */

function renderOvTable(){
  var entities = ND.entities || [];
  var q  = $('ovQ')        ? $('ovQ').value.trim().toLowerCase() : '';
  var fs = $('ovFltStatus') ? $('ovFltStatus').value : '';
  var rh = regionHeader();
  var hasGst = !!fieldByType.gst;

  /* Collect all extra-meta field names (Vintage, Eligibility, …) */
  var extraFieldSet = {};
  entities.forEach(function(e){
    Object.keys(e.extraMeta || {}).forEach(function(k){ if (k) extraFieldSet[k] = 1; });
  });
  var extraFields = Object.keys(extraFieldSet);
  var anyRemark = entities.some(hasRemark);   // only add ETA/Remarks cols when present

  /* Header row */
  $('ovSellersHead').innerHTML = '<tr><th>#</th><th>' + entNoun(true) + '</th>' +
    (hasGst ? '<th>GST</th>' : '') +
    (rh ? '<th>Region</th>' : '') +
    '<th>Entity Type</th>' +
    extraFields.map(function(f){ return '<th>' + esc(f) + '</th>'; }).join('') +
    '<th>Pending</th><th>Completion</th><th>Status</th>' +
    (anyRemark ? '<th>ETA</th><th>Remarks</th>' : '') + '</tr>';

  /* Apply filters */
  var rows = entities.filter(function(e){
    // phase0 = all sellers — no additional filter
    if (fs === 'pending'   && e.pending === 0) return false;
    if (fs === 'completed' && !(e.pending === 0 && e.applicable > 0)) return false;
    if (q){
      var hay = [
        nameHeader ? (e.meta[nameHeader] || '') : '',
        hasGst ? (e.meta[fieldByType.gst] || '') : '',
        fieldByType.entity ? (e.meta[fieldByType.entity] || '') : '',
        rh ? (e.meta[rh] || '') : '',
        extraFields.map(function(f){ return (e.extraMeta || {})[f] || ''; }).join(' '),
        e.remarks || '', e.eta || ''
      ].join(' ').toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });

  var colCount = 6 + (hasGst?1:0) + (rh?1:0) + extraFields.length + (anyRemark ? 2 : 0);

  $('ovSellersBody').innerHTML = rows.length ? rows.map(function(e){
    var nm = nameHeader ? e.meta[nameHeader] : ('Row ' + e.row);
    return '<tr onclick="openDetail(' + e.row + ')">' +
      '<td style="color:var(--ink-3)">' + esc(String(e.serial || '')) + '</td>' +
      '<td><div class="cell-name">' + esc(nm) + '</div></td>' +
      (hasGst ? '<td class="gst">' + esc(e.meta[fieldByType.gst] || '—') + '</td>' : '') +
      (rh ? '<td>' + esc(e.meta[rh] || '—') + '</td>' : '') +
      '<td>' + esc((fieldByType.entity && e.meta[fieldByType.entity]) || '—') + '</td>' +
      extraFields.map(function(f){
        var v  = (e.extraMeta || {})[f] || '';
        var kn = normKey(f);
        var isElig    = kn.indexOf('elig') !== -1;
        var isVintage = kn === 'vintage' || kn.indexOf('vintage') !== -1;
        var style = '';
        if (isElig) {
          style = String(v).toLowerCase() === 'yes'
            ? 'color:var(--rk-green-ink);font-weight:700'
            : v ? 'color:#DC2626;font-weight:700' : '';
        } else if (isVintage && v) {
          var vm = vintageMonths_(v);
          style = vm !== null && vm < 12  ? 'color:#DC2626;font-weight:700' :
                  vm !== null && vm >= 12 ? 'color:var(--rk-green-ink);font-weight:700' : '';
        }
        return '<td' + (style ? ' style="' + style + '"' : '') + '>' + esc(v || '—') + '</td>';
      }).join('') +
      '<td>' + (e.pending
        ? '<span class="chip warn">' + e.pending + '</span>'
        : '<span style="color:var(--ink-3)">0</span>') + '</td>' +
      '<td><div class="prog-cell"><div class="track"><div class="fill" style="width:' + e.completion + '%"></div></div><span>' + pct(e.completion) + '</span></div></td>' +
      '<td>' + statusChip(e) + '</td>' +
      (anyRemark
        ? '<td>' + (e.eta ? '<span class="eta-badge">' + esc(e.eta) + '</span>' : '<span style="color:var(--ink-3)">—</span>') + '</td>' +
          '<td class="remark-cell">' + (e.remarks ? '<div class="rc-txt" title="' + esc(e.remarks) + '">' + esc(e.remarks) + '</div>' : '<span style="color:var(--ink-3)">—</span>') + '</td>'
        : '') +
    '</tr>';
  }).join('') : '<tr><td colspan="' + colCount + '" class="empty-cell">No ' + entNoun() + 's match.</td></tr>';

  var sc = $('ovSellersCount');
  if (sc) sc.textContent = rows.length === entities.length
    ? rows.length + ' ' + entNoun() + (rows.length === 1 ? '' : 's')
    : rows.length + ' of ' + entities.length;
}

function statusChip(e){
  if (e.pending === 0 && e.applicable > 0) return '<span class="chip ok">Completed</span>';
  if (e.received === 0 && e.applicable > 0) return '<span class="chip mut">Phase 0</span>';
  if (e.pending > 0) return '<span class="chip warn">' + e.pending + ' pending</span>';
  return '<span class="chip mut">—</span>';
}

/* ═══════════════════════════ Document matrix ═══════════════════════════ */

function renderMatrix(){
  var rows = ND.entities || [], docsArr = ND.docs || [];
  var head = '<thead><tr><th>' + entNoun(true) + '</th>' + docsArr.map(function(d){
    return '<th title="' + esc(d.key) + '">' + esc(docShort(d.key)) + '</th>';
  }).join('') + '</tr></thead>';

  var body = '<tbody>' + rows.map(function(s){
    var nm = nameHeader ? s.meta[nameHeader] : ('Row ' + s.row);
    return '<tr><th onclick="openDetail(' + s.row + ')" title="' + esc(nm) + '">' + esc(nm) + '</th>' +
      docsArr.map(function(d){
        var cell = s.docs[d.key] || {status:'pending', note:''};
        var cls = cell.status === 'received' ? 'rec' : cell.status === 'na' ? 'na' : 'pen';
        var tipTxt = '<b>' + esc(nm) + '</b><br>' + esc(d.key) + '<br><span class="t-sub">' +
          (cell.status === 'received' ? 'Received' : cell.status === 'na' ? 'Not applicable' : 'Pending') +
          (cell.note ? ' — ' + esc(cell.note) : '') + '</span>';
        return '<td data-tip="' + esc(tipTxt) + '"><span class="dot ' + cls + (cell.note ? ' note' : '') + '"></span></td>';
      }).join('') + '</tr>';
  }).join('') + '</tbody>';

  $('matrixTable').innerHTML = rows.length ? head + body
    : head + '<tbody><tr><td colspan="' + (docsArr.length+1) + '" class="empty-cell">No ' + entNoun() + 's in this tab yet.</td></tr></tbody>';
}

/* ═══════════════════════════ KPI drill-down ════════════════════════════ */

function openKpi(kind){
  // StrideOne Phase 0 — render P-0 buyer cards from ND.phase0Buyers
  if (kind === 'phase0' && ND.id === 'strideone') {
    var buyers = ND.phase0Buyers || [];
    var bn = buyers.length, bs = bn === 1 ? '' : 's';
    $('kpiDrTitle').textContent = 'Phase 0 — Identified Buyers';
    $('kpiDrSub').textContent   = bn + ' buyer' + bs + ' · P-0 priority · StrideOne';
    _kscOpen = null;
    $('kpiDrBody').innerHTML = buildP0BuyerList(buyers);
    $('kpiDrBody').scrollTop = 0;
    $('scrim').classList.add('on');
    $('kpiDrawer').classList.add('on');
    $('kpiDrawer').setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
    return;
  }

  var list = filterByKind(kind);
  var n = list.length, s = n === 1 ? '' : 's';
  var noun  = (ND.id === 'strideone') ? 'buyer' : 'seller';
  var nounC = noun.charAt(0).toUpperCase() + noun.slice(1);
  var titles = {
    buyers:      'All ' + nounC + 's',
    total:       'All ' + nounC + 's',
    phase0:      'Total ' + nounC + 's',
    pending:     'Pending Documents',
    completed:   'Completed',
    eligible:    'First Check / Pre-Screening',
    qualified:   'Logged In ' + nounC + 's',
    creditlimit: 'Credit Limit Assigned'
  };
  var subs = {
    buyers:      '',
    total:       n + ' ' + noun + s + ' in ' + ND.name,
    phase0:      '',
    pending:     n + ' ' + noun + s + ' with one or more documents outstanding',
    completed:   n + ' ' + noun + s + ' with every required document received',
    eligible:    n + ' ' + noun + s + ' passed first check / pre-screening in ' + ND.name,
    qualified:   n + ' ' + noun + s + ' logged in to ' + ND.name,
    creditlimit: n + ' ' + noun + s + ' with a credit limit assigned in ' + ND.name
  };
  openKpiDrawer(titles[kind] || kind, subs[kind] || '', list, kind);
}

var _kpiList = [], _kpiKind = '';

function openKpiDrawer(title, sub, list, kind){
  $('kpiDrTitle').textContent = title;
  $('kpiDrSub').textContent = sub;
  $('kpiDrSub').style.display = sub ? '' : 'none';

  _kscOpen = null;
  _kpiList = list || [];
  _kpiKind = kind || '';
  var si = $('kpiSearch'); if(si){ si.value = ''; }
  $('kpiNoResults').style.display = 'none';
  $('kpiDrBody').innerHTML = buildKpiTable(_kpiList, _kpiKind);
  $('kpiDrBody').scrollTop = 0;
  $('kpiDrBody').scrollLeft = 0;

  $('scrim').classList.add('on');
  $('kpiDrawer').classList.add('on');
  $('kpiDrawer').setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
}

function kpiFilter(){
  var q = ($('kpiSearch').value || '').trim().toLowerCase();
  if(!q){
    $('kpiDrBody').innerHTML = buildKpiTable(_kpiList, _kpiKind);
    $('kpiNoResults').style.display = 'none';
    return;
  }
  var filtered = _kpiList.filter(function(e){
    var name = (e.name || '').toLowerCase();
    var gst  = (e.gst  || '').toLowerCase();
    var reg  = (e.region || (e.extraMeta && e.extraMeta[Object.keys(e.extraMeta||{}).find(function(k){ return k.toLowerCase().includes('region'); })||'']) || '').toString().toLowerCase();
    var ent  = (e.entityType || (e.extraMeta && e.extraMeta[Object.keys(e.extraMeta||{}).find(function(k){ return k.toLowerCase().includes('entity'); })||'']) || '').toString().toLowerCase();
    var rmk  = ((e.remarks || '') + ' ' + (e.eta || '')).toLowerCase();
    return name.includes(q) || gst.includes(q) || reg.includes(q) || ent.includes(q) || rmk.includes(q);
  });
  $('kpiDrBody').innerHTML = buildKpiTable(filtered, _kpiKind);
  $('kpiNoResults').style.display = filtered.length ? 'none' : 'block';
  $('kpiDrBody').scrollTop = 0;
}

function buildP0BuyerList(buyers){
  if (!buyers || !buyers.length){
    return '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 24px;text-align:center;min-height:260px">' +
      '<div style="font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.02em;margin-bottom:8px">No P-0 buyers found</div>' +
      '<div style="font-size:13px;color:var(--ink-3);line-height:1.6">No buyers with P-0 priority were found in the StrideOne sheet.</div>' +
    '</div>';
  }
  return '<div style="display:flex;flex-direction:column;gap:10px;padding:4px 0">' +
    buyers.map(function(b, i){
      var initials = (b.name || '?').trim().split(/\s+/).slice(0,2).map(function(w){ return w[0]; }).join('').toUpperCase();
      var meta = [b.type, b.category, b.state].filter(Boolean).join(' · ');
      var vintage = b.vintage && b.vintage !== '-' ? b.vintage + ' yrs with Recykal' : '';
      return '<div style="background:var(--card);border-radius:var(--radius);box-shadow:0 0 0 .5px var(--line),var(--shadow-sm);padding:14px 16px;display:flex;gap:14px;align-items:flex-start;animation:fadeUp .4s var(--ease-out) both;animation-delay:' + (i*40) + 'ms">' +
        '<div style="flex-shrink:0;width:40px;height:40px;border-radius:10px;background:rgba(var(--nc-rgb),.12);color:var(--nc);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;letter-spacing:.02em">' + esc(initials) + '</div>' +
        '<div style="flex:1;min-width:0">' +
          '<div style="font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(b.name || '—') + '</div>' +
          (meta ? '<div style="font-size:12px;color:var(--ink-2);margin-top:2px">' + esc(meta) + '</div>' : '') +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:7px;align-items:center">' +
            (b.gst ? '<span style="font-size:11px;font-family:monospace;background:var(--fill);color:var(--ink-2);padding:2px 7px;border-radius:5px;letter-spacing:.02em">' + esc(b.gst) + '</span>' : '') +
            (vintage ? '<span style="font-size:11px;color:var(--ink-3)">' + esc(vintage) + '</span>' : '') +
            (b.contact ? '<span style="font-size:11px;color:var(--ink-3)">' + esc(b.contact) + '</span>' : '') +
            '<span style="font-size:10px;font-weight:700;letter-spacing:.06em;background:rgba(var(--nc-rgb),.12);color:var(--nc);padding:2px 8px;border-radius:20px;margin-left:auto">' + esc(b.priority) + '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('') +
  '</div>';
}

function buildKpiTable(list, kind){
  if (!list || !list.length){
    return '<div class="kpi-empty"><h4>No ' + entNoun() + 's in this group</h4>' +
      '<p>No ' + entNoun() + 's currently match this criteria.</p></div>';
  }
  var hasGst = !!fieldByType.gst;
  var rh = regionHeader();
  var anyRemark = list.some(hasRemark);   // add ETA/Remarks cols only when present
  var head = '<tr><th>#</th><th>' + entNoun(true) + '</th>' +
    (hasGst ? '<th>GST</th>' : '') +
    (rh ? '<th>Region</th>' : '') +
    '<th>Entity Type</th><th>Received</th><th>Pending</th><th>Completion</th><th>Status</th>' +
    (anyRemark ? '<th>ETA</th><th>Remarks</th>' : '') + '</tr>';
  var body = list.map(function(e){
    var nm = nameHeader ? e.meta[nameHeader] : ('Row ' + e.row);
    return '<tr onclick="openDetail(' + e.row + ')">' +
      '<td style="color:var(--ink-3)">' + esc(String(e.serial || '')) + '</td>' +
      '<td><div class="cell-name">' + esc(nm) + '</div></td>' +
      (hasGst ? '<td class="gst">' + esc(e.meta[fieldByType.gst] || '—') + '</td>' : '') +
      (rh ? '<td>' + esc(e.meta[rh] || '—') + '</td>' : '') +
      '<td>' + esc((fieldByType.entity && e.meta[fieldByType.entity]) || '—') + '</td>' +
      '<td><span style="color:var(--rk-green-ink);font-weight:600;font-variant-numeric:tabular-nums">' + e.received + '</span></td>' +
      '<td>' + (e.pending
        ? '<span class="chip warn">' + e.pending + '</span>'
        : '<span style="color:var(--ink-3)">0</span>') + '</td>' +
      '<td><div class="prog-cell"><div class="track"><div class="fill" style="width:' + e.completion + '%"></div></div><span>' + pct(e.completion) + '</span></div></td>' +
      '<td>' + statusChip(e) + '</td>' +
      (anyRemark
        ? '<td>' + (e.eta ? '<span class="eta-badge">' + esc(e.eta) + '</span>' : '<span style="color:var(--ink-3)">—</span>') + '</td>' +
          '<td class="remark-cell">' + (e.remarks ? '<div class="rc-txt" title="' + esc(e.remarks) + '">' + esc(e.remarks) + '</div>' : '<span style="color:var(--ink-3)">—</span>') + '</td>'
        : '') +
    '</tr>';
  }).join('');
  return '<table class="tbl"><thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
}

/* ── Kanban seller card (unified builder) ───────────────────────────────── */
var _kscOpen = null;
function toggleKpiCard(row){
  var el = document.getElementById('ksc-' + row);
  if (!el) return;
  var wasOpen = el.classList.contains('open');
  if (_kscOpen && _kscOpen !== el){ _kscOpen.classList.remove('open'); }
  el.classList.toggle('open', !wasOpen);
  _kscOpen = wasOpen ? null : el;
}

function buildKbCard(e, idx, kind){
  var docs = ND.docs || [];
  var nm   = nameHeader ? e.meta[nameHeader] : ('Row ' + e.row);
  var ent  = (fieldByType.entity && e.meta[fieldByType.entity]) || '';
  var tv   = fieldByType.turnover ? formatTurnover(e.meta[fieldByType.turnover]) : '';
  var sub  = [ent, tv].filter(Boolean).join(' · ');
  // For credit limit drawer: surface the credit limit amount in the sub-line
  if (kind === 'creditlimit' && creditLimitHeader) {
    var cl = ((e.extraMeta || {})[creditLimitHeader] || '').trim();
    if (cl) sub = (sub ? sub + ' · ' : '') + 'Credit Limit: ₹' + cl;
  }

  var pendDocs = docs.filter(function(d){ return (e.docs[d.key]||{}).status === 'pending'; });
  var recvDocs = docs.filter(function(d){ return (e.docs[d.key]||{}).status === 'received'; });
  var naDocs   = docs.filter(function(d){ return (e.docs[d.key]||{}).status === 'na'; });

  /* Extra-meta badges (Vintage, Eligibility, …) */
  var em = e.extraMeta || {};
  var emKeys = Object.keys(em).filter(function(k){ return em[k]; });
  var attrsHtml = emKeys.length ? '<div class="kb-attrs">' + emKeys.map(function(k){
    var v = em[k], kn = normKey(k);
    var isElig    = kn.indexOf('elig') !== -1;
    var isVintage = kn === 'vintage' || kn.indexOf('vintage') !== -1;
    var cls = isElig && String(v).toLowerCase() === 'yes' ? 'kb-attr-elig-yes' :
              isElig ? 'kb-attr-elig-no' :
              isVintage ? 'kb-attr-vintage' : '';
    var icon = isElig && String(v).toLowerCase() === 'yes'
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>'
      : isElig
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
    return '<span class="kb-attr ' + cls + '">' + icon + esc(k) + ': <b>' + esc(v) + '</b></span>';
  }).join('') + '</div>' : '';

  /* Document section builder */
  function docSec(arr, secCls, label, dotCls){
    if (!arr.length) return '';
    var tag = dotCls === 'pend' ? 'Pending' : dotCls === 'recv' ? 'Received' : 'N/A';
    return '<div class="kb-sec ' + secCls + '">' + label + '<span class="kb-sec-badge">' + arr.length + '</span></div>' +
      '<div class="ksc-doc-grid">' + arr.map(function(d){
        return '<div class="ksc-doc ' + dotCls + '"><span class="ksc-doc-dot"></span>' +
          '<div><div class="ksc-doc-name">' + esc(d.key) + '</div>' +
          '<span class="ksc-doc-tag">' + tag + '</span></div></div>';
      }).join('') + '</div>';
  }

  /* Follow-up remark strip (from Plastic-Remarks, joined by GST) */
  var remarkHtml = hasRemark(e) ? '<div class="kb-remark">' +
      '<div class="kb-remark-h">' + REMARK_ICON + 'Follow-up Remark' + etaPill(e.eta) + '</div>' +
      (e.remarks ? '<div class="kb-remark-txt">' + esc(e.remarks) + '</div>' : '') +
    '</div>' : '';

  var panelHtml = attrsHtml + remarkHtml +
    docSec(pendDocs, 'kb-sec-pend', 'Missing',        'pend') +
    docSec(naDocs,   'kb-sec-na',   'Not Applicable', 'na')   +
    docSec(recvDocs, 'kb-sec-recv', 'Received',       'recv');

  var totalApp = pendDocs.length + recvDocs.length;
  panelHtml +=
    '<div class="ksc-foot">' +
      '<div class="ksc-prog"><div class="ksc-prog-fill" style="width:' + e.completion + '%"></div></div>' +
      '<span style="font-size:11px;color:var(--ink-3)">' + recvDocs.length + ' of ' + totalApp + ' docs received</span>' +
      '<button class="btn-ghost" style="height:30px;padding:0 13px;font-size:12px" onclick="fromKpiToDetail(' + e.row + ')" type="button">View details</button>' +
    '</div>';

  /* Card header decorations */
  var ringClr = (kind === 'completed' || e.completion === 100 || e.completion >= 75)
    ? 'var(--rk-green)' : e.completion >= 40 ? 'var(--amber)' : '#e05252';
  var ringHtml = ringSvg(e.completion, 40, 4.5, 'var(--fill)', ringClr);
  var ringLbl  = Math.round(e.completion) + '%';
  var chipHtml = kind === 'completed' ? '<span class="chip ok">Completed</span>' : statusChip(e);
  var avStyle  = kind === 'completed' ? ' style="background:var(--rk-green-tint);color:var(--rk-green-ink)"' : '';

  return '<div class="ksc" id="ksc-' + e.row + '" style="animation:fadeSlideUp .28s var(--ease) both;animation-delay:' + (idx*18) + 'ms">' +
    '<button class="ksc-hdr" onclick="toggleKpiCard(' + e.row + ')" type="button">' +
      '<div class="ksc-av"' + avStyle + '>' + esc(initials(nm)) + '</div>' +
      '<div class="ksc-info"><div class="ksc-name">' + esc(nm) + '</div>' +
        (sub ? '<div class="ksc-sub">' + esc(sub) + '</div>' : '') + '</div>' +
      '<div class="ksc-ring">' + ringHtml +
        '<div class="ksc-ring-lbl">' + ringLbl + '</div></div>' +
      chipHtml +
      '<span class="ksc-chev"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>' +
    '</button>' +
    '<div class="ksc-panel"><div class="ksc-panel-inner">' + panelHtml + '</div></div>' +
  '</div>';
}

function fromKpiToDetail(row){
  openDetail(row); /* detail modal layers above the kanban (z-index 100) */
}

function closeKpi(){
  $('kpiDrawer').classList.remove('on');
  $('kpiDrawer').setAttribute('aria-hidden','true');
  $('scrim').classList.remove('on');
  document.body.style.overflow = '';
}

/* ═══════════════════════════ Inline detail view ════════════════════════ */

function entityByRow(row){
  return (ND.entities || []).filter(function(e){ return e.row === row; })[0] || null;
}

/* Status badge icons for the deep-dive document list (filled circle + glyph) */
var DD_ICO = {
  ok:   '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M7 12.4l3.2 3.2L17 8.8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  warn: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M12 6.6v6.1" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="16.6" r="1.15" fill="#fff"/></svg>',
  mut:  '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 12h8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>'
};
/* Follow-up remark card for the deep-dive (empty state when the seller has none) */
function followupCard(e){
  var has = !!(e.remarks || e.eta);
  var body = has
    ? (e.remarks ? '<div class="dd-follow-body">' + esc(e.remarks) + '</div>' : '') +
      (e.eta ? '<div class="dd-follow-eta"><span class="dd-eta-k">ETA</span><span class="dd-eta-v">' + esc(e.eta) + '</span></div>' : '')
    : '<div class="dd-follow-body dd-follow-none">No follow-up remarks recorded for this ' + entNoun() + '.</div>';
  return '<div class="dd-follow">' +
    '<div class="dd-follow-h"><span class="dd-follow-title">Follow-up Remark</span><span class="dd-follow-badge">Follow-up</span></div>' +
    body + '</div>';
}

function openDetail(row){
  var e = entityByRow(row);
  if (!e) return;
  var nm = nameHeader ? e.meta[nameHeader] : ('Row ' + e.row);

  /* ── Header ── */
  $('dvName').textContent = entNoun(true) + ' Detail Deep-Dive: ' + nm;

  /* ── Completion ring ── */
  $('dvRing').innerHTML =
    ringSvg(e.completion, 152, 13, 'var(--line)', 'var(--rk-green)') +
    '<div class="dd-ring-lbl"><b>' + Math.round(e.completion) + '%</b><span>Document<br>Completion</span></div>';
  $('dvSubmitted').innerHTML = '<b>' + e.received + '</b> of <b>' + e.applicable + '</b> documents submitted.';

  /* ── Follow-up remark (from Plastic-Remarks, joined by GST) ── */
  $('dvRemark').innerHTML = followupCard(e);

  /* ── Metadata grid (padded so the 3-col grid never exposes a bare gap-cell) ── */
  var metaCells = (ND.metaFields || [])
    .filter(function(f){ return f.key !== nameHeader && e.meta[f.key]; })
    .map(function(f){
      var val = (f.type === 'turnover') ? formatTurnover(e.meta[f.key]) : e.meta[f.key];
      return '<div class="dd-mcell"><div class="dd-mk">' + esc(f.key) + '</div>' +
        '<div class="dd-mv' + (f.type === 'gst' ? ' mono' : '') + '">' + esc(val) + '</div></div>';
    });
  while (metaCells.length % 3 !== 0) metaCells.push('<div class="dd-mcell" aria-hidden="true"></div>');
  $('dvInfo').innerHTML = metaCells.join('');

  /* ── Document status + links (flat, scannable list) ── */
  $('dvDocs').innerHTML = (ND.docs || []).map(function(d){
    var cell = e.docs[d.key] || {status:'pending'};
    var st = cell.status;
    var t = st === 'received' ? 'Received' : st === 'pending' ? 'Pending' : 'N/A';
    var c = st === 'received' ? 'ok' : st === 'pending' ? 'warn' : 'mut';
    var link = cell.driveUrl
      ? '<a href="' + esc(cell.driveUrl) + '" target="_blank" rel="noopener" class="dd-drive">View on Google Drive</a>'
      : '<span class="dd-nolink">—</span>';
    return '<div class="dd-drow">' +
      '<div class="dd-dname">' + esc(d.key) + (cell.note ? '<span class="dd-dnote">' + esc(cell.note) + '</span>' : '') + '</div>' +
      '<div class="dd-dstat ' + c + '">' + t + '</div>' +
      '<div class="dd-dlink">' + link + '</div>' +
      '<div class="dd-dico ' + c + '">' + DD_ICO[c] + '</div>' +
    '</div>';
  }).join('');

  /* ── Open modal (layers above the KPI kanban if that's open) ── */
  var m = $('detailModal');
  m.classList.add('on');
  m.setAttribute('aria-hidden', 'false');
  m.querySelector('.modal-body').scrollTop = 0;
  document.body.style.overflow = 'hidden';
}

function closeDetailView(){
  var m = $('detailModal');
  m.classList.remove('on');
  m.setAttribute('aria-hidden', 'true');
  /* keep scroll locked if the KPI kanban is still open underneath */
  if (!$('kpiDrawer').classList.contains('on')) document.body.style.overflow = '';
}

/* ═══════════════════════ Drawers, tooltip, wiring ══════════════════════ */

$('scrim').addEventListener('click', function(){ closeKpi(); });
/* click the dimmed area outside the modal to dismiss */
$('detailModal').addEventListener('click', function(e){ if (e.target === this) closeDetailView(); });
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  if ($('detailModal').classList.contains('on')) closeDetailView();
  else if ($('kpiDrawer').classList.contains('on')) closeKpi();
});

/* NBFC switcher */
$('nbfcNav').addEventListener('click', function(e){
  var b = e.target.closest('button[data-nbfc]'); if (!b) return;
  switchNbfc(b.dataset.nbfc);
});

/* Secondary view switcher */
$('subnav').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  this.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === b); });
  document.querySelectorAll('.view').forEach(function(v){
    v.classList.toggle('on', v.id === 'view-' + b.dataset.view);
  });
});

$('refreshBtn').addEventListener('click', function(){ if (DATA) refresh(false); });
$('ovQ').addEventListener('input',           function(){ if (ND && ND.ok) renderOvTable(); });
$('ovFltStatus').addEventListener('change',  function(){ if (ND && ND.ok) renderOvTable(); });

/* tooltip (delegated) */
var tipEl = $('tip');
document.addEventListener('mouseover', function(e){
  var t = e.target.closest('[data-tip]');
  if (!t){ tipEl.classList.remove('on'); return; }
  tipEl.innerHTML = t.dataset.tip;
  tipEl.classList.add('on');
});
document.addEventListener('mousemove', function(e){
  if (!tipEl.classList.contains('on')) return;
  var x = Math.min(e.clientX + 14, window.innerWidth - tipEl.offsetWidth - 10);
  var y = e.clientY + 16;
  if (y + tipEl.offsetHeight > window.innerHeight - 8) y = e.clientY - tipEl.offsetHeight - 10;
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
});

/* pick up outside edits when the tab regains focus (throttled) */
window.addEventListener('focus', function(){
  if (!DATA) return;
  var now = Date.now();
  if (now - lastFocusRefresh > 60000){ lastFocusRefresh = now; refresh(true); }
});

boot();
</script>
